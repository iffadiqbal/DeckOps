      /* ═══ CUSTOMERS ═════════════════════════════════ */
      function vCustomers() {
        const f = F.cust;
        const marked = db.customers.map(c => ({ c, f: flagInfo(c) }));
        const cnt = lvl => marked.filter(x => x.f.level === lvl).length;
        let list = marked.slice();
        if (f.flag) list = list.filter(x => x.f.level === f.flag);
        if (f.source) list = list.filter(x => (x.c.source || '').toLowerCase() === f.source.toLowerCase());
        if (f.owing) list = list.filter(x => jobsOf(x.c.id).reduce((s, j) => s + owed(j), 0) > 0);
        if (query) list = list.filter(x => {
          const c = x.c;
          return (cname(c) + ' ' + (c.phone || '') + ' ' + (c.email || '') + ' ' + (c.address || '') + ' ' + (c.notes || '') + ' ' + (c.source || '')).toLowerCase().includes(query);
        });
        const bal = c => jobsOf(c.id).reduce((s, j) => s + owed(j), 0);
        const life = c => jobsOf(c.id).reduce((s, j) => s + (Number(j.paid) || 0), 0);
        const sorts = {
          name: (a, b) => cname(a.c).localeCompare(cname(b.c)),
          last: (a, b) => String(a.c.last || '').localeCompare(String(b.c.last || '')),
          recent: (a, b) => String(b.c.created || '').localeCompare(String(a.c.created || '')),
          owing: (a, b) => bal(b.c) - bal(a.c),
          value: (a, b) => life(b.c) - life(a.c),
          address: (a, b) => String(a.c.address || '~').localeCompare(String(b.c.address || '~'))
        };
        list.sort(sorts[f.sort] || sorts.name);
        const sources = uniq(db.customers.map(c => c.source));

        let h = `<div class="filters">
    <button class="pill ${!f.flag ? 'on' : ''}" data-flag="">Everyone<span class="n">${db.customers.length}</span></button>
    ${FLAGS.map(([k, label]) => `<button class="pill f-${k} ${f.flag === k ? 'on' : ''}" data-flag="${k}"><span class="dot d-${k}"></span>${esc(label)}<span class="n">${cnt(k)}</span></button>`).join('')}
  </div><div class="filters">
    <select data-cf="source"><option value="">Any source</option>${sources.map(s => `<option ${f.source === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
    <select data-cf="sort">
      <option value="name" ${f.sort === 'name' ? 'selected' : ''}>First name A–Z</option>
      <option value="last" ${f.sort === 'last' ? 'selected' : ''}>Last name A–Z</option>
      <option value="address" ${f.sort === 'address' ? 'selected' : ''}>Address A–Z</option>
      <option value="recent" ${f.sort === 'recent' ? 'selected' : ''}>Newest added</option>
      <option value="owing" ${f.sort === 'owing' ? 'selected' : ''}>Most owed</option>
      <option value="value" ${f.sort === 'value' ? 'selected' : ''}>Highest lifetime</option></select>
    <button class="pill ${f.owing ? 'on' : ''}" data-owing>Owes money</button>
    ${(f.flag || f.source || f.owing || f.sort !== 'name') ? `<button class="clear" data-clear="cust">Clear filters</button>` : ''}
    <span class="tally">${list.length} shown</span></div>`;
        h += list.length ? list.map(x => custRow(x.c, x.f)).join('')
          : `<div class="empty"><b>No customers match</b>${query || f.flag || f.source || f.owing ? 'Try clearing a filter.' : 'Add someone the moment they text you — before they book.'}
      <div><button class="btn primary" data-act="new-customer">Add a customer</button></div></div>`;
        paint(h);
        $$('[data-flag]').forEach(b => b.addEventListener('click', () => { f.flag = b.dataset.flag; render(); }));
        $$('[data-cf]').forEach(s => s.addEventListener('change', () => { f[s.dataset.cf] = s.value; render(); }));
        $$('[data-owing]').forEach(b => b.addEventListener('click', () => { f.owing = !f.owing; render(); }));
        $$('[data-clear="cust"]').forEach(b => b.addEventListener('click', () => { F.cust = { flag: '', source: '', sort: 'name', owing: false }; render(); }));
      }

      function editCustomer(id, then, prefillName) {
        const c = id ? db.customers.find(x => x.id === id) : { id: '', first: '', last: '', phone: '', email: '', address: '', source: '', notes: '', flag: 'auto', flagBasis: '', followUp: '' };
        if (!id && prefillName) { const p = String(prefillName).trim().split(/\s+/); c.first = p.shift() || ''; c.last = p.join(' '); }
        const fi = id ? flagInfo(c) : null;
        const js = id ? jobsOf(id) : [];
        const life = js.reduce((s, j) => s + (Number(j.paid) || 0), 0), bal = js.reduce((s, j) => s + owed(j), 0);
        const info = id ? flagInfo(c) : null;
        openModal(`
    <header><h3>${id ? esc(cname(c)) : 'New customer'}</h3>${id ? `<button class="btn sm danger" id="del">Delete</button>` : ''}</header>
    <div class="body">
      <div class="rule"><b>Required:</b> first name, last name, and at least one way to reach them — phone or email.
        Email alone is fine, but a record without any contact method gets flagged red.</div>
      <div class="two">
        <div class="field" id="w-first"><label>First name <span class="req">*</span></label>
          <input id="c-first" value="${esc(c.first || '')}" placeholder="Maria"><div class="err">First name is required.</div></div>
        <div class="field" id="w-last"><label>Last name <span class="req">*</span></label>
          <input id="c-last" value="${esc(c.last || '')}" placeholder="Delgado"><div class="err">Last name is required.</div></div>
      </div>
      <div class="two">
        <div class="field" id="w-phone"><label>Phone <span class="req">*</span></label>
          <input id="c-phone" value="${esc(c.phone)}" placeholder="(929) 555-0134" inputmode="tel">
          <div class="err">Enter a phone number, or an email below.</div></div>
        <div class="field" id="w-email"><label>Email</label>
          <input id="c-email" value="${esc(c.email)}" placeholder="name@email.com" inputmode="email">
          <div class="err">That doesn't look like a valid email.</div></div>
      </div>
      <div class="field"><label>Address</label><input id="c-addr" value="${esc(c.address)}" placeholder="Howard Beach, Queens"></div>
      <div class="field"><label>How they found you</label><input id="c-src" value="${esc(c.source || '')}" placeholder="Google, referral, Instagram…">
        <div class="hint">Tells you which channel is actually working.</div></div>
      <div class="two">
        <div class="field"><label>Follow up on</label><input type="date" id="c-fu" value="${esc(c.followUp || '')}">
          <div class="hint">Flags red on that date.</div></div>
        <div class="field"><label>Status</label>
          <div class="statread"><span class="dot d-${esc(fi ? fi.level : 'grey')}"></span><b>${esc(flagName(fi ? fi.level : 'grey'))}</b></div>
          <div class="hint">${id ? esc(fi.why) + '. Worked out from their jobs, their follow-up date and what is still owed \u2014 there is nothing to set here.' : 'Worked out from their jobs once they have some.'}</div></div>
      </div>
      <div class="field" id="w-cnotes"><label>Notes</label><textarea id="c-notes" placeholder="Co-op board needs a COI. Parking is tight after 6.">${esc(c.notes)}</textarea><div class="err"></div></div>
      ${(id && seeMoney()) ? `<div class="balance"><span>${isExec() ? 'Lifetime ' + money(life) : 'Balance'}</span><b>${bal > 0 ? money(bal) + ' owed' : 'nothing owed'}</b></div>` : ''}
      ${c.phone || c.address ? `<div class="pillrow">
        ${c.phone ? `<a class="btn sm line" href="tel:${esc(tel(c.phone))}">${icon('phone')} Call</a>
        <a class="btn sm line" href="sms:${esc(tel(c.phone))}">${icon('msg')} Text</a>` : ''}
        ${c.address ? `<a class="btn sm line" target="_blank" rel="noopener" href="https://maps.google.com/?q=${encodeURIComponent(c.address)}">Map</a>` : ''}</div>` : ''}
      ${js.length ? `<h2 class="sec">Their jobs <span class="tag">${js.length}</span></h2>${js.map(jobRow).join('')}` : ''}
    </div>
    <footer>${id ? `<button class="btn line" id="addjob">Add a job</button>` : ''}
      <button class="btn line" id="cancel">Cancel</button>
      <button class="btn primary" id="ok">${id ? 'Save' : 'Add customer'}</button></footer>`);
        /* customer notes are optional shorthand — capped, but no sentence floor */
        const okCNotes = wireNote('#c-notes', { floor: false });
        $('#cancel').addEventListener('click', closeModal);
        /* status has no control any more — it is read straight off their jobs */
        $$('#modal [data-job]').forEach(r => r.addEventListener('click', e => { if (!e.target.closest('.rowacts')) editJob(r.dataset.job); }));
        if (id) {
          $('#addjob').addEventListener('click', () => { closeModal(); setTimeout(() => editJob(null, id), 60); });
          $('#del').addEventListener('click', () => {
            const back = db.customers.find(x => x.id === id);
            removeRec('customers', id); closeModal(); render();
            toast('Customer deleted', { label: 'Undo', run: () => { upsert('customers', back); render(); } });
          });
        }
        $('#ok').addEventListener('click', () => {
          const first = $('#c-first').value.trim(), last = $('#c-last').value.trim();
          const phone = $('#c-phone').value.trim(), email = $('#c-email').value.trim();
          const digits = phone.replace(/[^0-9]/g, '');
          const badPhone = phone && digits.length < 10;
          const badEmail = email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
          const noContact = !phone && !email;
          $('#w-first').classList.toggle('bad', !first);
          $('#w-last').classList.toggle('bad', !last);
          $('#w-phone').classList.toggle('bad', noContact || badPhone);
          $('#w-email').classList.toggle('bad', badEmail);
          if (badPhone) $('#w-phone').querySelector('.err').textContent = 'That phone number looks too short.';
          else $('#w-phone').querySelector('.err').textContent = 'Enter a phone number, or an email below.';
          if (!first || !last || noContact || badPhone || badEmail) {
            toast(noContact ? 'Add a phone number or an email' : 'Fill in the highlighted fields');
            (!first ? $('#c-first') : !last ? $('#c-last') : badEmail ? $('#c-email') : $('#c-phone')).focus();
            return;
          }
          if (!checkNotes([['#w-cnotes', okCNotes, '#c-notes']])) return;
          const draft = {
            id: c.id || uid(), first, last, phone, email, address: $('#c-addr').value.trim(),
            source: $('#c-src').value.trim(), followUp: $('#c-fu').value, notes: $('#c-notes').value.trim(),
            created: c.created || new Date().toISOString()
          };
          /* the "mark them Complete and sweep their open jobs to Paid" shortcut lived
             inside the old status pin. Marking money collected should be a deliberate
             act on the job, not a side effect of picking a label — Jobs still has the
             bulk Complete path for that. */
          const rec = Object.assign(draft, { flag: 'auto', flagBasis: '' });
          upsert('customers', rec);
          save(); closeModal(); render();
          if (then) then(rec.id);
          toast(id ? 'Customer saved' : 'Customer added');
        });
      }

      /* ═══ PARTS ═════════════════════════════════════ */
      function vParts() {
        const tabs = [{ k: 'inventory', label: 'Inventory', n: db.parts.filter(p => p.track !== false).length },
        { k: 'pricebook', label: 'Price book', n: db.parts.length },
        { k: 'toorder', label: 'To order', n: openOrders().length }];
        if (!tabs.some(t => t.k === partsTab)) partsTab = 'inventory';
        paint(ptabs(tabs, partsTab, 'parts') +
          (partsTab === 'pricebook' ? priceBookBlock() : partsTab === 'toorder' ? toOrderBlock() : inventoryBlock()));
        wirePtabs();
        if (partsTab === 'pricebook') wirePriceBook();
        else if (partsTab === 'toorder') wireToOrder();
        else wireInventory();
      }

      /* ── what's on the shelf. Untracked rows (labour rates, materials you
            buy per job) belong in the price book, not in a stock count. ── */
      function inventoryBlock() {
        const f = F.part;
        const stock = db.parts.filter(p => p.track !== false);
        let list = stock.slice();
        if (f.stock === 'low') list = list.filter(p => Number(p.qty) <= Number(p.lowAt || 0) && Number(p.qty) > 0);
        if (f.stock === 'out') list = list.filter(p => Number(p.qty) <= 0);
        if (f.stock === 'in') list = list.filter(p => Number(p.qty) > Number(p.lowAt || 0));
        if (f.device) list = list.filter(p => (p.device || '') === f.device);
        if (f.supplier) list = list.filter(p => (p.supplier || '') === f.supplier);
        if (query) list = list.filter(p => (p.name + ' ' + (p.device || '') + ' ' + (p.sku || '') + ' ' + (p.supplier || '') + ' ' + (p.notes || '')).toLowerCase().includes(query));
        const marg = p => (Number(p.price) || 0) - (Number(p.cost) || 0);
        const sorts = {
          name: (a, b) => a.name.localeCompare(b.name), qty: (a, b) => (Number(a.qty) || 0) - (Number(b.qty) || 0),
          margin: (a, b) => marg(b) - marg(a), value: (a, b) => ((Number(b.qty) || 0) * (Number(b.cost) || 0)) - ((Number(a.qty) || 0) * (Number(a.cost) || 0)),
          device: (a, b) => String(a.device || '~').localeCompare(String(b.device || '~'))
        };
        list.sort(sorts[f.sort] || sorts.name);
        const low = stock.filter(p => Number(p.qty) <= Number(p.lowAt || 0));
        const value = stock.reduce((s, p) => s + (Number(p.qty) || 0) * (Number(p.cost) || 0), 0);
        const potential = stock.reduce((s, p) => s + (Number(p.qty) || 0) * marg(p), 0);
        const devices = uniq(stock.map(p => p.device)), sups = uniq(stock.map(p => p.supplier));

        let h = `<div class="grid g3" style="margin-bottom:1.1rem">
    <div class="card stat in"><div class="k">On the shelf, at cost</div><div class="v">${money(value)}</div><div class="s">${stock.length} part type${stock.length === 1 ? '' : 's'}</div></div>
    <div class="card stat in good"><div class="k">Margin if it all sells</div><div class="v">${money(potential)}</div><div class="s">price minus cost</div></div>
    <div class="card stat in ${low.length ? 'alert' : ''}"><div class="k">At reorder point</div><div class="v">${low.length}</div><div class="s">${low.length ? 'order before the next booking' : 'nothing to reorder'}</div></div>
  </div>
  <div class="filters">
    <button class="pill ${!f.stock ? 'on' : ''}" data-stock="">All<span class="n">${stock.length}</span></button>
    <button class="pill ${f.stock === 'low' ? 'on' : ''}" data-stock="low">Running low<span class="n">${stock.filter(p => Number(p.qty) <= Number(p.lowAt || 0) && Number(p.qty) > 0).length}</span></button>
    <button class="pill ${f.stock === 'out' ? 'on' : ''}" data-stock="out">Out<span class="n">${stock.filter(p => Number(p.qty) <= 0).length}</span></button>
    <button class="pill ${f.stock === 'in' ? 'on' : ''}" data-stock="in">In stock<span class="n">${stock.filter(p => Number(p.qty) > Number(p.lowAt || 0)).length}</span></button>
  </div>
  <div class="filters">
    <select data-pf="device"><option value="">Any device</option>${devices.map(d => `<option ${f.device === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select>
    <select data-pf="supplier"><option value="">Any supplier</option>${sups.map(s => `<option ${f.supplier === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
    <select data-pf="sort">
      <option value="name" ${f.sort === 'name' ? 'selected' : ''}>Name A–Z</option>
      <option value="device" ${f.sort === 'device' ? 'selected' : ''}>Device A–Z</option>
      <option value="qty" ${f.sort === 'qty' ? 'selected' : ''}>Fewest on hand</option>
      <option value="margin" ${f.sort === 'margin' ? 'selected' : ''}>Best margin</option>
      <option value="value" ${f.sort === 'value' ? 'selected' : ''}>Most tied-up cash</option></select>
    ${(f.stock || f.device || f.supplier || f.sort !== 'name') ? `<button class="clear" data-clear="part">Clear filters</button>` : ''}
    <span class="tally">${list.length} shown</span></div>`;
        if (!list.length) {
          h += `<div class="empty"><b>No parts match</b>${query || f.stock || f.device || f.supplier ? 'Try clearing a filter.' : 'Add a part the first time you order it — so the second time you already know the price.'}
      <div><button class="btn primary" data-act="new-part">Add a part</button></div></div>`;
        } else if (compact()) {
          h += list.map(partCard).join('');
        } else {
          h += `<div class="tablewrap"><table><thead><tr><th>Part</th><th>Fits</th><th>On hand</th>
      <th class="num">Cost</th><th class="num">You charge</th><th class="num">Margin</th><th class="num">Reorder</th></tr></thead><tbody>`+
            list.map(p => {
              const q = Number(p.qty) || 0, lo = Number(p.lowAt) || 0, cls = q <= 0 ? 'out' : (q <= lo ? 'low' : ''), m = marg(p);
              return `<tr data-part="${p.id}"><td><b>${esc(p.name)}</b>${p.sku ? `<div class="sku">${esc(p.sku)}</div>` : ''}</td>
          <td>${esc(p.device || '—')}</td>
          <td><span class="stepper"><button data-dec="${p.id}" aria-label="Used one">−</button>
            <span class="qty ${cls}">${q}</span><button data-inc="${p.id}" aria-label="Received one">+</button></span></td>
          <td class="num">${money(p.cost)}</td><td class="num">${money(p.price)}</td>
          <td class="num" style="color:${m > 0 ? 'var(--done)' : 'var(--muted)'}">${money(m)}</td>
          <td class="num">${safeUrl(p.link) ? `<a class="btn line sm" href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener noreferrer">${esc(p.supplier || 'Buy')}</a>` : '<span class="sku">&mdash;</span>'}</td></tr>`;
            }).join('') + `</tbody></table></div>`;
        }
        return h;
      }
      function wireInventory() {
        const f = F.part;
        $$('[data-stock]').forEach(b => b.addEventListener('click', () => { f.stock = b.dataset.stock; render(); }));
        $$('[data-pf]').forEach(s => s.addEventListener('change', () => { f[s.dataset.pf] = s.value; render(); }));
        $$('[data-clear="part"]').forEach(b => b.addEventListener('click', () => { F.part = { stock: '', device: '', supplier: '', sort: 'name' }; render(); }));
        $$('[data-inc]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); bump(b.dataset.inc, 1); }));
        $$('[data-dec]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); bump(b.dataset.dec, -1); }));
      }

      /* ── the price book: every catalogue row, priced. This is what the
            estimator reads from, so an item only has to be costed once. ── */
      function priceBookBlock() {
        let list = db.parts.slice();
        if (query) list = list.filter(p => (p.name + ' ' + (p.device || '') + ' ' + (p.sku || '') + ' ' + (p.supplier || '') + ' ' + (p.notes || '')).toLowerCase().includes(query));
        list.sort((a, b) => String(a.kind || 'material').localeCompare(String(b.kind || 'material')) || a.name.localeCompare(b.name));
        const charge = p => Number(p.price) > 0 ? Number(p.price) : r2((Number(p.cost) || 0) * (1 + (Number(p.markup) || 0) / 100));
        const priced = db.parts.filter(p => charge(p) > 0).length;
        let h = `<div class="grid g3" style="margin-bottom:1.1rem">
    <div class="card stat in"><div class="k">Items in the book</div><div class="v">${db.parts.length}</div><div class="s">${priced} with a price on them</div></div>
    <div class="card stat in"><div class="k">Labour &amp; service rates</div><div class="v">${db.parts.filter(p => ['labor', 'service'].includes(p.kind || 'material')).length}</div><div class="s">hourly or flat</div></div>
    <div class="card stat in ${db.parts.length - priced ? 'alert' : ''}"><div class="k">Missing a price</div><div class="v">${db.parts.length - priced}</div><div class="s">${db.parts.length - priced ? 'the estimator will read these as zero' : 'every item is costed'}</div></div>
  </div>`;
        if (!list.length) {
          h += `<div class="empty"><b>Nothing in the price book yet</b>Add the things you buy and the hours you sell. Price each one once, and every estimate after that builds itself.
      <div><button class="btn primary" data-act="new-part">Add an item</button></div></div>`;
          return h;
        }
        h += `<div class="tablewrap"><table><thead><tr><th>Item</th><th>Kind</th><th>Sold by</th>
    <th class="num">Cost</th><th class="num">Markup</th><th class="num">You charge</th><th class="num">Reorder</th></tr></thead><tbody>`+
          list.map(p => `<tr class="pbrow" data-part="${p.id}">
      <td><b>${esc(p.name)}</b>${p.sku ? `<div class="sku">${esc(p.sku)}</div>` : ''}</td>
      <td>${esc(kindLabel(p.kind || 'material'))}</td>
      <td>${esc(unitLabel(p.unit || 'each'))}</td>
      <td class="num">${money(p.cost)}</td>
      <td class="num">${Number(p.markup) > 0 ? Number(p.markup) + '%' : '\u2014'}</td>
      <td class="num"><b>${money(charge(p))}</b>${Number(p.price) > 0 ? '' : '<div class="sku">from markup</div>'}</td>
      <td class="num">${safeUrl(p.link) ? `<a class="btn line sm" href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener noreferrer">${esc(p.supplier || 'Buy')}</a>` : '<span class="sku">no link</span>'}</td>
    </tr>`).join('') + `</tbody></table></div>
    <div class="hint" style="margin-top:.7rem">Leave “You charge” blank to let the markup set it. Type a figure to pin that item's price whatever the cost does.</div>`;
        return h;
      }
      function wirePriceBook() { /* rows are wired by paint() through [data-part] */ }

      /* ── To order ────────────────────────────────────────────────────────
         DERIVED, never stored. This list is computed from the estimate lines of
         jobs that are scheduled or in progress. Nothing is written to `parts`
         until you actually order something, so there is no row to garbage-collect
         when a job slips, is pushed back or is cancelled — it just stops showing
         up. A timer that DELETED from parts would eventually eat a part you had
         already bought and were physically holding. */
      function toOrderBlock() {
        const all = toOrderLines(), need = all.filter(x => !x.line.ordered), on = all.filter(x => x.line.ordered);
        const stages = ORDER_STAGES.map(k => (STATUS.find(s => s[0] === k) || [k, k])[1]).join(' and ');
        const known = sk => db.parts.some(p => String(p.sku || '').trim().toLowerCase() === String(sk || '').trim().toLowerCase());
        const card = (x, done) => {
          const j = x.job, l = x.line, c = cust(j.customerId), u = safeUrl(l.link);
          return `<div class="ordrow${done ? ' done' : ''}">
      <div class="ordmain">
        <div class="t"><b>${esc(l.name || 'Untitled item')}</b>
          <span class="qty">${esc(estQty(l) + ' ' + unitLabel(l.unit || 'each'))}</span></div>
        <div class="sku">${l.sku ? esc(l.sku) : 'no SKU'}${known(l.sku) ? ' \u00b7 already in inventory' : ''}</div>
        <div class="sub"><span class="tk">${esc(j.ticket || '')}</span> ${esc(j.title || 'Untitled job')}
          \u00b7 ${esc(c ? cname(c) : 'no customer')} \u00b7 ${esc(j.date ? niceDate(j.date) : 'no date set')}</div>
        ${done && l.orderedAt ? `<div class="sub">Marked ordered ${esc(String(l.orderedAt).slice(0, 10))}</div>` : ''}
      </div>
      <div class="ordacts">
        ${u ? `<a class="btn line sm" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Buy</a>` : ''}
        ${seeMoney() ? `<button class="btn ${done ? 'line' : 'primary'} sm" data-ord="${esc(j.id)}|${esc(l.id)}|${done ? '0' : '1'}">${done ? 'Undo' : 'Ordered'}</button>` : ''}
      </div></div>`;
        };
        let h = `<h2 class="sec">To order <span class="tag">${need.length} outstanding</span></h2>
    <div class="note">Anything on an estimate with a SKU shows up here once its job reaches
      <b>${esc(stages)}</b>. Nothing is added to your inventory until you mark it ordered \u2014 if a job
      slips back or gets cancelled, its parts drop off this list on their own.
      ${seeMoney() ? '' : '<br>Marking items ordered is a manager action.'}</div>`;
        if (!all.length) {
          h += `<div class="empty"><b>Nothing waiting on an order</b>Put a SKU on an estimate line, then schedule the job.</div>`;
          return h;
        }
        h += need.length ? need.map(x => card(x, false)).join('')
          : `<div class="empty"><b>Everything's ordered</b>No outstanding items on scheduled work.</div>`;
        if (on.length) h += `<h2 class="sec" style="margin-top:1.4rem">On order <span class="tag">${on.length}</span></h2>` +
          on.map(x => card(x, true)).join('');
        return h;
      }
      function wireToOrder() {
        $$('[data-ord]').forEach(b => b.addEventListener('click', () => {

      /* ═══ DATA ══════════════════════════════════════ */
      async function pushBackupStamp() {
        if (!ONLINE || !sb) return;
        try { await sb.from('settings').upsert({ key: 'backup', value: { at: db.meta.lastExport, by: MYEMAIL || '' } }); }
        catch (e) { /* best effort — the local stamp still silences it on this device */ }

      }
      /* ── referral codes ────────────────────────────────────────────────
         A code is issued per customer and never recycled. Redemptions are
         counted from the jobs themselves, so the ledger cannot drift out of
         sync with the money. */
      const REF_ALPHA = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';   /* same as tickets: no 0/O/1/I/L */
      const normCode = c => String(c || '').trim().toUpperCase();
      function makeRefCode(c) {
        const base = String((c && c.first) || '').replace(/[^A-Za-z]/g, '').slice(0, 4).toUpperCase() || 'AP';
        for (let tries = 0; tries < 40; tries++) {
          let tail = '';
          for (let i = 0; i < 4; i++)tail += REF_ALPHA[Math.floor(Math.random() * REF_ALPHA.length)];
          const code = base + '-' + tail;
          if (!db.customers.some(x => normCode(x.refCode) === code)) return code;
        }
        return 'AP-' + uid().slice(-5).toUpperCase();
      }
      function ensureRefCode(id) {
        const c = cust(id);
        if (!c) return '';
        if (normCode(c.refCode)) return normCode(c.refCode);
        c.refCode = makeRefCode(c);
        push('customers', c);
        return c.refCode;
      }
      const custByCode = code => {
        const n = normCode(code);
        return n ? db.customers.find(c => normCode(c.refCode) === n) : null;
      };
      const yearOf = j => Number(String(j.date || j.created || '').slice(0, 4)) || 0;
      /* every job that burned this code, excluding drafts and dead tickets */
      const redemptionsOf = (code, year) => {
        const n = normCode(code);
        if (!n) return [];
        return db.jobs.filter(j => normCode(j.discountCode) === n
          && j.status !== 'cancelled' && j.status !== 'lead'
          && (!year || yearOf(j) === year));
      };
      function refLedger(custId) {
        const c = cust(custId);
        const code = c ? normCode(c.refCode) : '';
        const yr = new Date().getFullYear();
        if (!code) return { code: '', used: 0, left: REF_MAX_YEAR, earned: 0, spent: 0, balance: 0 };
        const all = redemptionsOf(code, yr);
        const byOthers = all.filter(j => j.customerId !== custId);
        const bySelf = all.filter(j => j.customerId === custId);
        const earned = Math.min(byOthers.length, REF_MAX_YEAR) * REF_GIVER;
        const spent = bySelf.reduce((s, j) => s + discOf(j), 0);
        return {
          code, used: byOthers.length, left: Math.max(0, REF_MAX_YEAR - byOthers.length),
          earned, spent, balance: Math.max(0, earned - spent)
        };
      }
      /* What a code is worth on this job, or why it isn't. */
      function priceCode(code, jobId, custId, type, price) {
        const n = normCode(code);
        if (!n) return { ok: true, amt: 0, msg: '' };
        const cap = Math.floor((Number(price) || 0) * DISC_MAX_PCT) / 100;
        if (cap <= 0) return { ok: false, amt: 0, msg: 'Set the quoted price first.' };
        const owner = custByCode(n);
        const yr = new Date().getFullYear();

        if (!owner) {   /* marketing code — amount is typed by hand */
          return { ok: true, amt: null, cap, msg: 'Marketing code. Enter the amount yourself (max ' + money(cap) + ' on this job).' };
        }
        const mine = owner.id === custId;
        const used = redemptionsOf(n, yr).filter(j => j.id !== jobId && j.customerId !== owner.id).length;

        if (mine) {
          const led = refLedger(custId);
          const already = redemptionsOf(n, yr).filter(j => j.id === jobId).reduce((s, j) => s + discOf(j), 0);
          const avail = Math.min(led.balance + already, cap);
          if (avail <= 0) return { ok: false, amt: 0, msg: 'No referral credit left this year.' };
          return { ok: true, amt: avail, cap, msg: 'Own code — spending ' + money(avail) + ' of earned credit.' };
        }
        if (used >= REF_MAX_YEAR)
          return { ok: false, amt: 0, msg: String(owner.first || 'That').trim() + '\u2019s code has hit ' + REF_MAX_YEAR + ' uses this year.' };
        const base = REPAIRY(type) ? REF_NEW_REPAIR : REF_NEW_INSTALL;
        const amt = Math.min(base, cap);
        return {
          ok: true, amt, cap,
          msg: 'Referred by ' + (cname(owner) || 'a customer') + '. ' + money(amt) + ' off; they earn ' + money(REF_GIVER) + '. ' +
            (REF_MAX_YEAR - used - 1) + ' use' + ((REF_MAX_YEAR - used - 1) === 1 ? '' : 's') + ' left on their code.'
        };
      }

      /* ── invoices ───────────────────────────────────────────────────────

      function invoiceText(j) {
        const c = cust(j.customerId) || {};
        const L = [];
        L.push(BIZ_NAME);
        L.push(invNo(j) + '  ·  ticket ' + (j.ticket || '—'));
        L.push('Bill to: ' + ([c.first, c.last].filter(Boolean).join(' ') || 'Customer'));
        L.push('');
        L.push((j.title || 'Work performed') + '  —  ' + money(sub(j)));
        if (j.taxable) L.push('NY sales tax @ ' + (Number(j.taxRate) || 0) + '%  —  ' + money(taxAmt(j)));
        L.push('Total: ' + money(totalOf(j)));
        L.push('Paid: ' + money(Number(j.paid) || 0));
        L.push('Balance due: ' + money(owed(j)));
        return L.join('\n');
      }

      function openInvoice(id) {
        const j = db.jobs.find(x => x.id === id);

        openModal(`<div style="padding:1.2rem 1.15rem 1.3rem">

      /* ── NY sales tax quarters ──────────────────────────────────────────
         New York runs Mar-May, Jun-Aug, Sep-Nov, Dec-Feb. Each return is due
         the 20th of the month after the quarter closes. This is a WORKSHEET
         built from your own job records — it is not a filing and not advice. */
      const NYQ = [{ m: [2, 3, 4], label: 'Mar – May', due: 'Jun 20' },
      { m: [5, 6, 7], label: 'Jun – Aug', due: 'Sep 20' },
      { m: [8, 9, 10], label: 'Sep – Nov', due: 'Dec 20' },
      { m: [11, 0, 1], label: 'Dec – Feb', due: 'Mar 20' }];
      const saleDate = j => j.date || (j.created ? String(j.created).slice(0, 10) : '');
      function quarterOf(iso) {
        if (!iso) return null;
        const mo = Number(String(iso).slice(5, 7)) - 1;
        const yr = Number(String(iso).slice(0, 4));
        for (let i = 0; i < NYQ.length; i++) {
          if (NYQ[i].m.includes(mo)) {
            /* Dec belongs to the quarter that ends the following February */
            const y = (i === 3 && mo === 11) ? yr + 1 : yr;
            return { i, y, key: y + '-Q' + i };
          }
        }
        return null;
      }
      function taxRows() {
        const acc = {};
        db.jobs.filter(j => j.status !== 'cancelled' && j.status !== 'lead' && j.status !== 'quoted').forEach(j => {
          const q = quarterOf(saleDate(j));
          if (!q) return;
          const a = acc[q.key] || (acc[q.key] = { key: q.key, i: q.i, y: q.y, taxed: 0, exempt: 0, tax: 0, jobs: 0 });
          a.jobs++;
          if (j.taxable) { a.taxed += sub(j); a.tax += taxAmt(j); } else a.exempt += sub(j);
        });
        const now = quarterOf(today());
        return Object.values(acc).sort((a, b) => b.key.localeCompare(a.key))
          .map(r => ({
            ...r, label: NYQ[r.i].label + ' ' + r.y, due: NYQ[r.i].due + ', ' + (r.i === 3 ? r.y : r.y),
            current: !!now && now.key === r.key
          }));
      }

      function referralsBlock() {
        const rows = db.customers.map(c => ({ c, l: refLedger(c.id) }))
          .filter(r => r.l.code).sort((a, b) => b.l.used - a.l.used || cname(a.c).localeCompare(cname(b.c)));
        const owed = rows.reduce((s, r) => s + r.l.balance, 0);
        return `
    <h2 class="sec">Referrals <span class="tag">${rows.length} code${rows.length === 1 ? '' : 's'} issued</span></h2>
    <div class="note">A customer's code gives a new customer <b>${money(REF_NEW_INSTALL)}</b> off an install or
      <b>${money(REF_NEW_REPAIR)}</b> off IT/repair work, and earns them <b>${money(REF_GIVER)}</b> toward their own next job.
      Capped at <b>${REF_MAX_YEAR} uses per code per calendar year</b>, and no single discount may exceed
      <b>${DISC_MAX_PCT}%</b> of the job. One discount per job — the Deck will not stack them.
      Issue a code from any invoice.${owed > 0 ? `<br><b style="color:var(--wood-soft)">${money(owed)} in unspent referral credit is outstanding.</b>` : ''}</div>
    ${rows.length ? `<div class="tablewrap"><table>
      <thead><tr><th>Customer</th><th>Code</th><th class="num">Used</th><th class="num">Left</th><th class="num">Credit</th></tr></thead>
      <tbody>${rows.map(r => `<tr style="cursor:default"><td>${esc(cname(r.c))}</td>
        <td><span class="tk">${esc(r.l.code)}</span></td>
        <td class="num">${r.l.used}</td><td class="num">${r.l.left}</td>
        <td class="num"><b>${money(r.l.balance)}</b></td></tr>`).join('')}</tbody></table></div>`

      get paid; paid ones are the customer's receipt. Print gives you a PDF — nothing is uploaded anywhere.

    ${list.length ? list.map(j => {
          const c = cust(j.customerId); const bal = owed(j);
          return `<div class="row invrow s-${j.status}" data-inv="${j.id}">
        <div class="main"><div class="t"><span class="tk">${esc(invNo(j))}</span>${esc(j.title || 'Untitled job')}</div>
          <div class="sub">${esc(c ? cname(c) : 'No customer')} · ${esc(j.date ? niceDate(j.date) : 'no date')}${j.taxable ? ' · +' + money(taxAmt(j)) + ' tax' : ''}</div></div>

      function taxBlock() {
        if (!isExec()) return '';
        const rows = taxRows();
        const held = rows.reduce((s, r) => s + r.tax, 0);
        return `
    <h2 class="sec">Tax information <span class="tag">C-class only</span></h2>
    <div class="note"><b>This is a worksheet built from your own job records, not a filing and not tax advice.</b>
      Check every figure against your books with your accountant before you file anything.</div>

    <h2 class="sec">Key dates</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Date</th><th>What</th></tr></thead><tbody>

      <tr style="cursor:default"><td>Dec 21, 2026</td><td><b>First sales tax return</b>, covering Sep 1 – Nov 30. Required even at $0.</td></tr>
      <tr style="cursor:default"><td>Jul 30, 2027</td><td>Registered agent renewal.</td></tr>
      </tbody></table></div>
    <div class="note">Quarters run Mar–May, Jun–Aug, Sep–Nov and Dec–Feb; each return is due the 20th of the month after
      the quarter closes. A return is required even when there were no sales, and the minimum late penalty is $50.</div>`;
      }

      /* ═══ MONEY ═════════════════════════════════════
         Invoices, referrals and the tax worksheet used to live at the bottom

          .reduce((s, j) => s + (Number(j.paid) || 0), 0);
        const codes = db.customers.map(c => refLedger(c.id)).filter(l => l.code);
        const held = isExec() ? taxRows().reduce((s, r) => s + r.tax, 0) : 0;

        const tabs = [{ k: 'invoices', label: 'Invoices', n: list.length },
        { k: 'referrals', label: 'Referrals', n: codes.length }];
        if (isExec()) tabs.push({ k: 'tax', label: 'Sales tax', n: null });
        if (!tabs.some(t => t.k === moneyTab)) moneyTab = tabs[0].k;

        const strip = `<div class="grid ${isExec() ? 'g3' : 'g2'}" style="margin-bottom:1.1rem">

      <div class="v">${money(held)}</div><div class="s">not yours to spend</div></div>` : ''}
  </div>`;

            : taxBlock();
        paint(strip + ptabs(tabs, moneyTab, 'money') + body);

    ${exec ? `<button class="btn primary" id="addmem" style="margin-top:.6rem">+ Add team member</button>` : ''}`;

      const ERASE_ITER = 310000;

      <p class="pubq-mut">IT &amp; Installations \u00b7 Queens, Brooklyn, Manhattan &amp; Nassau</p>
      <h2>${esc(q.title || 'Your quote')}</h2>
      <p class="pubq-mut">${esc(q.first ? ('Prepared for ' + q.first) : '')}${q.address ? ' \u00b7 ' + esc(q.address) : ''}</p>
      ${q.scope ? `<div class="pubq-scope">${esc(q.scope)}</div>` : ''}
      ${lines.length ? `<table class="pubq-t"><tbody>${lines.map(l => `<tr>
          <td><b>${esc(l.name || 'Work')}</b>${l.unit && l.unit !== 'flat'
              ? `<div class="pubq-mut">${esc(qtyOf(l) + ' ' + unitLabel(l.unit))}${Number(l.waste) > 0 ? ' (incl. offcut)' : ''}</div>` : ''}</td>
          <td class="pubq-n">${money(lineTotal(l))}</td></tr>`).join('')}</tbody></table>`
              : '<p class="pubq-mut">Details to follow.</p>'}
      <div class="pubq-tot">
        <div><span>Subtotal</span><b>${money(listPrice(shape))}</b></div>
        ${(Number(q.discount_amt) || 0) > 0 ? `<div><span>Discount</span><b>\u2212${money(q.discount_amt)}</b></div>` : ''}
        ${q.taxable ? `<div><span>Sales tax (${Number(q.tax_rate) || 0}%)</span><b>${money(taxAmt(shape))}</b></div>` : ''}
        <div class="pubq-grand"><span>Total</span><b>${money(totalOf(shape))}</b></div>
      </div>
      ${accepted
              ? `<div class="pubq-ok">Accepted by ${esc(q.accepted_by || 'you')} on ${esc(niceDate(String(q.accepted_at).slice(0, 10)))}.
             We\u2019ll be in touch to lock in a date.</div>`
              : `<div class="pubq-act">
             <label for="pq-name">Type your name to accept this quote</label>
             <input id="pq-name" autocomplete="name" placeholder="Your full name">
             <button class="pubq-btn" id="pq-go">Accept quote</button>
             <p class="pubq-mut" id="pq-msg"></p>
             <p class="pubq-fine">Accepting tells us to go ahead. It doesn\u2019t book a date \u2014 we\u2019ll
               confirm that with you directly. Prices hold for 30 days.</p>
           </div>`}
      <p class="pubq-foot">Questions? Call or text <a href="tel:+19293564688">(929) 356-4688</a><br>
        AnchorPoint IT and Installations LLC</p>`;
          const go = document.getElementById('pq-go');
          if (go) go.addEventListener('click', async () => {
            const nm = (document.getElementById('pq-name').value || '').trim();
            const msg = document.getElementById('pq-msg');
            if (nm.length < 2) { msg.textContent = 'Please type your name first.'; return; }
            go.disabled = true; msg.textContent = 'Sending\u2026';
            try {
              const { data, error } = await sb.rpc('accept_shared_quote', { p_token: tok, p_name: nm });
              if (error) throw error;
              q.accepted_at = data.accepted_at; q.accepted_by = data.accepted_by; draw();
            } catch (e) {
              go.disabled = false;
              msg.textContent = (e && e.message) || 'That didn\u2019t go through — please call us.';
            }
          });
        };
        draw();
      }

      (async () => {
        const tok = quoteToken();
        if (tok && sb) { await showPublicQuote(tok); return; }
        syncBadge();
        if (!sb) { openGate('No connection to the server. Your saved copy is intact — work offline below, or try again once you have a bar of signal.'); return; }
        const { data } = await sb.auth.getSession();
        if (data && data.session) startSession(data.session);
        else openGate();
      })();

      /* ═══ OFFLINE SHELL (service worker) ══════════════
         The data layer was already offline-proof; the *app* was not.
         This caches index.html and the CDN modules so a hard refresh
         in a basement with no bars still boots the app.               */
      (function () {
        /* OPTIONAL. Deck is one file and works fine without this.
           If a file called sw.js is ever sitting next to index.html it gets
           picked up here and the app survives a refresh with no signal.
           If it isn't there, this fails silently and nothing changes.
           No HTML edit is needed either way. */
        if (!('serviceWorker' in navigator)) return;
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return; reloading = true; location.reload();
        });
        addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            reg.addEventListener('updatefound', () => {
              const nw = reg.installing; if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed' && navigator.serviceWorker.controller)
                  toast('A newer Deck is ready', { label: 'Reload', run: () => nw.postMessage({ type: 'SKIP_WAITING' }) });
              });
            });
            setInterval(() => reg.update().catch(() => { }), 30 * 60 * 1000);
          }).catch(() => {/* no sw.js deployed — single-file mode, this is fine */ });
        });
      })();

      /* ═══ PULL TO REFRESH ════════════════════════════ */
      (function () {
        const ptr = document.getElementById('ptr');
        if (!ptr || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        let startY = null, pulling = false, dist = 0, busy = false;
        const MAX = 110, TRIGGER = 72;
        const show = d => {
          const p = Math.min(1, d / TRIGGER);
          ptr.style.transform = `translate(-50%, ${Math.min(d, MAX) * 0.55 - 46}px) rotate(${d * 2.4}deg)`;
          ptr.style.opacity = String(p);
        };
        const hide = () => {
          ptr.style.transition = 'transform .3s cubic-bezier(.2,.8,.3,1),opacity .25s ease';
          ptr.style.transform = 'translate(-50%,-120%)'; ptr.style.opacity = '0';
          setTimeout(() => { ptr.style.transition = ''; ptr.classList.remove('spin'); }, 320);
        };
        addEventListener('touchstart', e => {
          if (busy || scrollY > 2 || document.body.classList.contains('locked') || scrim.classList.contains('on')) return;
          startY = e.touches[0].clientY; pulling = true; dist = 0; ptr.style.transition = '';
        }, { passive: true });
        addEventListener('touchmove', e => {
          if (!pulling || startY === null) return;
          dist = e.touches[0].clientY - startY;
          if (dist <= 0) { show(0); return; }
          show(dist);
        }, { passive: true });
        addEventListener('touchend', async () => {
          if (!pulling) { return; }
          pulling = false;
          const go = dist >= TRIGGER;
          startY = null;
          if (!go) { hide(); return; }
          busy = true;
          ptr.classList.add('spin');
          ptr.style.transition = 'transform .25s ease';
          ptr.style.transform = 'translate(-50%,14px)'; ptr.style.opacity = '1';
          scrollTo({ top: 0, behavior: 'smooth' });
          try { if (ONLINE && sb) { await flushOutbox(); await pullAll(); } else { render(); } }
          catch (err) { console.warn(err); }
          setTimeout(() => { hide(); busy = false; toast('Refreshed'); }, 420);
        }, { passive: true });
      })();

      let wasCompact = compact();
      addEventListener('resize', () => {
        clearTimeout(window._rz); window._rz = setTimeout(() => {
          if (compact() !== wasCompact) { wasCompact = compact(); render(); }
        }, 180);
      });
      $('#tagline').textContent = TAGLINES[Math.floor(Math.random() * TAGLINES.length)];
      /* On a quote link the app must not render at all — not merely be hidden.
         A customer's device has no data, but HIS does, and building the whole
         board behind a display:none is both wasteful and a needless exposure. */
      if (!quoteToken()) { render(); syncBadge(); }
    })();
  </script>
</body>

</html>
