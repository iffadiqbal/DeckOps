  <script>
    /* Runs before any paint so the app never flashes the wrong theme.
       Saved choice wins; otherwise follow the phone's own setting. */
    (function () {
      try {
        var t = localStorage.getItem('anchorpoint-deck-theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#EAE5D9' : '#0D1316');
      } catch (e) { }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      /* ── dark (default) ───────────────────────────────────────── */
      --ink: #131A1E;
      --harbor: #1D2B33;
      --harbor-2: #22303A;
      --deep: #0B1114;
      --bone: #F3EFE7;
      --paper: #EAE4D8;
      --wood: #A9713A;
      --wood-soft: #C08A4F;
      --blue: #8FA8BC;
      --muted: #79868C;
      --tint-rgb: 243, 239, 231;
      /* low-alpha overlays: hovers, tracks, hairlines */
      --sh: 0, 0, 0;
      /* shadow channel                                */
      --red-rgb: 224, 104, 90;
      --danger-rgb: 217, 112, 95;
      --wood-rgb: 169, 113, 58;
      --blue-rgb: 143, 168, 188;
      --rail-a: #0E1519;
      --gate-a: #1B2A33;
      --bar-top: #7FD3A6;
      --topbar-bg: rgba(19, 26, 30, .9);
      --tabbar-bg: rgba(11, 17, 20, .94);
      --scrim-bg: rgba(8, 12, 14, .7);
      --on-wood: #fff;
      --on-red: #1a0f0d;
      --on-yellow: #1f1806;
      --on-green: #0b1c14;
      --toast-bg: var(--paper);
      --toast-fg: var(--ink);
      --toast-btn-bg: var(--ink);
      --toast-btn-fg: var(--bone);
      --line: rgba(var(--tint-rgb), .10);
      --line-2: rgba(var(--tint-rgb), .22);
      --lead: #8FA8BC;
      --quoted: #C08A4F;
      --sched: #6FA5C4;
      --active: #E0913A;
      --done: #6FBF8F;
      --paid: #4E9E75;
      --red: #E0685A;
      --yellow: #E3B24A;
      --green: #5FBE8A;
      --grey: #6E7C83;
      --danger: #D9705F;
      --sans: 'Figtree', ui-sans-serif, system-ui, -apple-system, sans-serif;
      --disp: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
      --r: 14px;
      --shadow: 0 18px 40px -22px rgba(var(--sh), .75);
    }

    /* ── light ────────────────────────────────────────────────────
   Same brand, inverted stack. Wood and the status colours are
   darkened because the dark-mode values fail contrast on paper. */
    html[data-theme="light"] {
      color-scheme: light;
      /* Four distinct planes, dimmest to brightest, so panels never melt together:
     deep (rail, table heads) < ink (page) < harbor-2 (hover) < harbor (cards, rows, inputs).
     Accents are darker than the dark-mode set because the page is no longer near-white. */
      --ink: #EAE5D9;
      --harbor: #FFFFFF;
      --harbor-2: #F6F2E9;
      --deep: #DFD8C8;
      --bone: #18232A;
      --paper: #D9D1BE;
      --wood: #7E5228;
      --wood-soft: #7C572F;
      --blue: #456071;
      --muted: #5B676D;
      --tint-rgb: 24, 35, 42;
      --sh: 104, 90, 70;
      --red-rgb: 174, 55, 44;
      --danger-rgb: 168, 62, 49;
      --wood-rgb: 126, 82, 40;
      --blue-rgb: 69, 96, 113;
      --rail-a: #F2EDE2;
      --gate-a: #E4DDCC;
      --bar-top: #3FA877;
      --topbar-bg: rgba(234, 229, 217, .9);
      --tabbar-bg: rgba(255, 255, 255, .94);
      --scrim-bg: rgba(40, 33, 24, .45);
      --on-wood: #FFFFFF;
      --on-red: #FFF4F2;
      --on-yellow: #241B04;
      --on-green: #F1FBF6;
      --toast-bg: #1D2B33;
      --toast-fg: #F3EFE7;
      --toast-btn-bg: #F3EFE7;
      --toast-btn-fg: #1D2B33;
      --line: rgba(var(--tint-rgb), .16);
      --line-2: rgba(var(--tint-rgb), .30);
      --lead: #456179;
      --quoted: #855426;
      --sched: #276687;
      --active: #8C570B;
      --done: #1D6C4A;
      --paid: #1B6444;
      --red: #AE372C;
      --yellow: #7A5D07;
      --green: #1D6C4A;
      --grey: #586570;
      --danger: #A83E31;
      --shadow: 0 14px 34px -22px rgba(var(--sh), .55);
    }

    /* a few dark-tuned depths are too heavy on paper */
    html[data-theme="light"] .rail {
      box-shadow: 0 18px 44px -30px rgba(var(--sh), .5)
    }

    html[data-theme="light"] .navbtn.on {
      box-shadow: 0 8px 20px -14px rgba(var(--sh), .45)
    }

    html[data-theme="light"] .modal {
      box-shadow: 0 30px 70px rgba(var(--sh), .28)
    }

    html[data-theme="light"] .gatebox {
      box-shadow: 0 30px 70px -34px rgba(var(--sh), .55)
    }

    html[data-theme="light"] .toast {
      box-shadow: 0 16px 38px rgba(var(--sh), .3)
    }

    html[data-theme="light"] .tabbar {
      box-shadow: 0 14px 34px -18px rgba(var(--sh), .4)
    }

    html[data-theme="light"] .fab {
      box-shadow: 0 12px 26px -12px rgba(var(--wood-rgb), .75)
    }

    html[data-theme="light"] .combolist {
      box-shadow: 0 18px 40px -22px rgba(var(--sh), .4)
    }

    /* the mark is a self-contained dark tile — give it breathing room on paper */
    html[data-theme="light"] .brand img,
    html[data-theme="light"] .gatebox img {
      box-shadow: 0 4px 14px -6px rgba(var(--sh), .5)
    }

    /* On paper, colour alone is not enough separation. Anything that is its own
   panel gets a resting hairline shadow so it sits ABOVE the page, not in it. */
    html[data-theme="light"] .card,
    html[data-theme="light"] .row,
    html[data-theme="light"] .member,
    html[data-theme="light"] .tablewrap,
    html[data-theme="light"] .balance,
    html[data-theme="light"] .lognote,
    html[data-theme="light"] .rule {
      box-shadow: 0 1px 2px rgba(var(--sh), .14), 0 3px 10px -6px rgba(var(--sh), .16)
    }

    html[data-theme="light"] .card:hover,
    html[data-theme="light"] .row:hover {
      box-shadow: 0 2px 4px rgba(var(--sh), .16), 0 10px 24px -14px rgba(var(--sh), .4)
    }

    /* recessed surfaces go the other way — the rail and table heads sit BELOW the page */
    html[data-theme="light"] th {
      border-bottom: 1px solid var(--line-2)
    }

    html[data-theme="light"] .empty {
      background: rgba(var(--tint-rgb), .03)
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      background: var(--ink);
      color: var(--bone);
      font-family: var(--sans);
      font-size: 15.5px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      max-width: 100%
    }

    button {
      cursor: pointer
    }

    button,
    a,
    .row,
    .pill,
    .seg,
    .navbtn,
    .tabbar button,
    .iconbtn,
    tbody tr {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation
    }

    body {
      overscroll-behavior-y: none
    }

    /* driven by the visualViewport watcher; 0 everywhere that has no dynamic chrome */
    :root {
      --vv-lift: 0px
    }

    .tabbar,
    .fab {
      transform: translateY(calc(-1 * var(--vv-lift)))
    }

    /* a bottom bar floating in the middle of the screen over an open keyboard is
   worse than no bar at all */
    html[data-kb="1"] .tabbar,
    html[data-kb="1"] .fab {
      display: none
    }

    .tabbar,
    .navbtn,
    .pill,
    .seg {
      user-select: none;
      -webkit-user-select: none
    }

    a {
      color: var(--wood-soft)
    }

    :focus-visible {
      outline: 2px solid var(--wood-soft);
      outline-offset: 2px;
      border-radius: 8px
    }

    h1,
    h2,
    h3 {
      font-family: var(--disp);
      line-height: 1.1;
      letter-spacing: -.012em
    }

    svg {
      display: block
    }

    .ic {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0
    }

    /* ── shell ─────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: 262px minmax(0, 1fr);
      min-height: 100vh
    }

    .rail {
      background: linear-gradient(180deg, var(--rail-a), var(--deep));
      border: 1px solid var(--line-2);
      border-radius: 20px;
      margin: calc(1rem + env(safe-area-inset-top)) 0 1rem 1rem;
      padding: 1.2rem .8rem;
      display: flex;
      flex-direction: column;
      gap: .24rem;
      position: sticky;
      top: calc(1rem + env(safe-area-inset-top));
      height: calc(100vh - 2rem - env(safe-area-inset-top));
      overflow-y: auto;
      box-shadow: 0 24px 60px -28px rgba(var(--sh), .85)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .35rem .4rem 1.5rem;
      min-width: 0
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      box-shadow: 0 6px 18px -6px rgba(var(--sh), .75);
      flex-shrink: 0
    }

    .brand b {
      font-family: var(--disp);
      font-weight: 800;
      font-size: 1.15rem;
      line-height: 1;
      display: block
    }

    .brand small {
      display: block;
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .2em;
      color: var(--blue);
      text-transform: uppercase;
      margin-top: 4px
    }

    .navbtn {
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .64rem .7rem;
      border-radius: 11px;
      background: none;
      border: 0;
      text-align: left;
      color: var(--bone);
      opacity: .68;
      font-weight: 500;
      width: 100%;
      position: relative;
      transition: opacity .16s ease, background .16s ease;
      min-width: 0
    }

    .navbtn span.lbl {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .navbtn {
      border: 1px solid transparent;
      transition: opacity .16s ease, background .16s ease, transform .16s ease, border-color .16s ease, box-shadow .16s ease
    }

    .navbtn:hover {
      opacity: 1;
      background: rgba(var(--tint-rgb), .05);
      transform: translateX(3px)
    }

    .navbtn.on {
      opacity: 1;
      background: linear-gradient(160deg, var(--harbor-2), var(--harbor));
      border-color: var(--line-2);
      box-shadow: 0 10px 26px -14px rgba(var(--sh), .85)
    }

    .navbtn.on::before {
      content: "";
      position: absolute;
      left: 0;
      top: 22%;
      bottom: 22%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--wood)
    }

    .navbtn .count {
      margin-left: auto;
      font-family: var(--mono);
      font-size: .7rem;
      font-weight: 500;
      color: var(--blue);
      background: rgba(var(--blue-rgb), .13);
      padding: .08em .45em;
      border-radius: 6px;
      min-width: 1.6em;
      text-align: center;
      flex-shrink: 0
    }

    .navbtn .count:empty {
      display: none
    }

    .navbtn .count.hot {
      color: var(--red);
      background: rgba(var(--red-rgb), .16)
    }

    .railfoot {
      margin-top: auto;
      padding: .7rem .55rem 0;
      border-top: 1px solid var(--line)
    }

    .railfoot .k {
      font-family: var(--mono);
      font-size: .58rem;
      letter-spacing: .13em;
      color: var(--muted);
      text-transform: uppercase
    }

    .railfoot .v {
      font-size: .8rem;
      color: var(--blue);
      margin-top: .15rem
    }

    .tagline {
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--wood-soft);
      padding-bottom: .7rem
    }

    main {
      min-width: 0;
      padding-bottom: 3rem
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 25;
      background: var(--topbar-bg);
      backdrop-filter: blur(14px) saturate(1.3);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-wrap: wrap;
      padding: calc(.9rem + env(safe-area-inset-top)) 1.5rem .9rem
    }

    .topbar h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-right: auto;
      white-space: nowrap;
      flex-shrink: 0
    }

    .search {
      position: relative;
      flex: 1 1 220px;
      min-width: 0;
      max-width: 360px
    }

    .search input {
      width: 100%;
      background: var(--harbor);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: .56rem 2.4rem .56rem 2.25rem;
      transition: border-color .16s ease, background .16s ease
    }

    .search input:focus {
      background: var(--harbor-2);
      border-color: var(--line-2);
      outline: none
    }

    .search .ic {
      position: absolute;
      left: .72rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      width: 17px;
      height: 17px
    }

    .bell {
      position: relative;
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--line-2);
      border-radius: 11px;
      padding: .5rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: color .16s ease, border-color .16s ease, background .16s ease
    }

    .bell:hover {
      color: var(--bone);
      border-color: var(--bone)
    }

    .bell.has {
      color: var(--lead);
      border-color: var(--lead)
    }

    .bell .n {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 9px;
      background: var(--red);
      color: var(--on-red);
      font-family: var(--mono);
      font-size: .6rem;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1
    }

    .bell.has .n {
      display: inline-flex
    }

    .notif {
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .7rem .8rem;
      border: 1px solid var(--line);
      border-left: 3px solid var(--lead);
      border-radius: 11px;
      margin-bottom: .45rem;
      background: var(--harbor);
      cursor: pointer;
      transition: background .16s ease
    }

    .notif:hover {
      background: var(--harbor-2)
    }

    .notif .nmain {
      flex: 1;
      min-width: 0
    }

    .notif .nt {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .notif .ns {
      font-size: .78rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .notif .nread {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      color: var(--muted);
      font-size: .72rem;
      padding: .32em .6em
    }

    .notif .nread:hover {
      border-color: var(--green);
      color: var(--green)
    }

    .pdot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--muted)
    }

    .pill.p-lead .pdot {
      background: var(--lead)
    }

    .pill.p-quoted .pdot {
      background: var(--quoted)
    }

    .pill.p-scheduled .pdot {
      background: var(--sched)
    }

    .pill.p-active .pdot {
      background: var(--active)
    }

    .pill.p-done .pdot {
      background: var(--done)
    }

    .pill.p-paid .pdot {
      background: var(--paid)
    }

    .pill.p-cancelled .pdot {
      background: var(--grey)
    }

    .pill.p-open .pdot {
      background: var(--wood-soft)
    }

    .pill.p-all .pdot {
      background: var(--blue)
    }

    .pill.p-lead.on {
      background: color-mix(in srgb, var(--lead) 20%, transparent);
      color: var(--lead);
      border-color: var(--lead)
    }

    .pill.p-quoted.on {
      background: color-mix(in srgb, var(--quoted) 20%, transparent);
      color: var(--quoted);
      border-color: var(--quoted)
    }

    .pill.p-scheduled.on {
      background: color-mix(in srgb, var(--sched) 20%, transparent);
      color: var(--sched);
      border-color: var(--sched)
    }

    .pill.p-active.on {
      background: color-mix(in srgb, var(--active) 20%, transparent);
      color: var(--active);
      border-color: var(--active)
    }

    .pill.p-done.on {
      background: color-mix(in srgb, var(--done) 20%, transparent);
      color: var(--done);
      border-color: var(--done)
    }

    .pill.p-paid.on {
      background: color-mix(in srgb, var(--paid) 20%, transparent);
      color: var(--paid);
      border-color: var(--paid)
    }

    .pill.p-cancelled.on {
      background: color-mix(in srgb, var(--grey) 20%, transparent);
      color: var(--grey);
      border-color: var(--grey)
    }

    .pill.p-open.on {
      background: color-mix(in srgb, var(--wood-soft) 22%, transparent);
      color: var(--wood-soft);
      border-color: var(--wood-soft)
    }

    .pill.p-all.on {
      background: color-mix(in srgb, var(--blue) 20%, transparent);
      color: var(--blue);
      border-color: var(--blue)
    }

    .row.s-lead {
      background: color-mix(in srgb, var(--lead) 7%, var(--harbor));
      border-left-width: 4px
    }

    .row.s-lead:hover {
      background: color-mix(in srgb, var(--lead) 12%, var(--harbor))
    }

    .row.unread .t::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      margin-right: .15rem;
      flex-shrink: 0
    }

    #invPrint {
      display: none
    }

    .invdoc {
      background: #fff;
      color: #131A1E;
      padding: 1.4rem;
      border-radius: 12px;
      font-size: .86rem
    }

    .invdoc .invhead {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      border-bottom: 2px solid #131A1E;
      padding-bottom: .9rem;
      margin-bottom: 1rem
    }

    .invdoc .invhead h2 {
      font-family: var(--disp);
      font-size: 1.5rem;
      margin: 0 0 .15rem
    }

    .invdoc .invmeta {
      text-align: right;
      font-family: var(--mono);
      font-size: .72rem;
      line-height: 1.7
    }

    .invdoc .invto {
      margin-bottom: 1rem;
      line-height: 1.6
    }

    .invdoc .invto b {
      display: block;
      font-size: .62rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #5B676D
    }

    .invdoc table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: .9rem
    }

    .invdoc th {
      text-align: left;
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #5B676D;
      border-bottom: 1px solid #D8D2C4;
      padding: .4rem .3rem
    }

    .invdoc td {
      padding: .55rem .3rem;
      border-bottom: 1px solid #EDE9DF;
      vertical-align: top
    }

    .invdoc td.num,
    .invdoc th.num {
      text-align: right;
      font-family: var(--mono);
      white-space: nowrap
    }

    .invtot {
      margin-left: auto;
      width: min(280px, 100%)
    }

    .invtot div {
      display: flex;
      justify-content: space-between;
      padding: .3rem 0;
      font-family: var(--mono);
      font-size: .8rem
    }

    .invtot div.due {
      border-top: 2px solid #131A1E;
      margin-top: .3rem;
      padding-top: .5rem;
      font-size: 1rem;
      font-weight: 700
    }

    .invdoc .invfoot {
      margin-top: 1.2rem;
      padding-top: .8rem;
      border-top: 1px solid #EDE9DF;
      font-size: .72rem;
      color: #5B676D;
      line-height: 1.6
    }

    .invrow .right {
      text-align: right
    }

    .taxq td.num {
      font-family: var(--mono)
    }

    .taxq tr.now {
      background: rgba(var(--tint-rgb), .06)
    }

    @media print {
      body>* {
        display: none !important
      }

      #invPrint {
        display: block !important;
        position: static
      }

      .invdoc {
        padding: 0;
        border-radius: 0;
        font-size: 11pt
      }

      @page {
        margin: 16mm
      }
    }

    .search kbd {
      position: absolute;
      right: .55rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--mono);
      font-size: .6rem;
      color: var(--muted);
      border: 1px solid var(--line-2);
      border-radius: 5px;
      padding: .1em .32em;
      pointer-events: none
    }

    .search input:focus~kbd {
      opacity: 0
    }

    .pad {
      padding: 1.4rem 1.5rem;
      max-width: 1200px
    }

    /* ── buttons ───────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .42em;
      border: 1px solid transparent;
      border-radius: 11px;
      padding: .6em 1em;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
      transition: filter .16s ease, background .16s ease, border-color .16s ease, transform .12s ease;
      min-width: 0;
      flex-shrink: 0
    }

    .btn:active {
      transform: translateY(1px)
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--wood-soft), var(--wood));
      color: var(--on-wood);
      box-shadow: 0 8px 20px -10px rgba(var(--wood-rgb), .9)
    }

    .btn.primary:hover {
      filter: brightness(1.09)
    }

    .btn.line {
      background: rgba(var(--tint-rgb), .03);
      border-color: var(--line-2);
      color: var(--bone)
    }

    .btn.line:hover {
      background: rgba(var(--tint-rgb), .09)
    }

    /* a .btn.line that is currently showing a panel — used by the activity log
   toggles so you can see which one is open */
    .btn.line.on {
      background: rgba(var(--tint-rgb), .14);
      border-color: var(--wood-soft);
      color: var(--bone)
    }

    .btn.sm {
      padding: .4em .72em;
      font-size: .82rem;
      border-radius: 9px
    }

    .btn.danger {
      background: transparent;
      border-color: rgba(var(--danger-rgb), .45);
      color: var(--danger)
    }

    .btn.danger:hover {
      background: rgba(var(--danger-rgb), .13)
    }

    .btn .ic {
      width: 16px;
      height: 16px
    }

    /* ── cards ─────────────────────────────────────── */
    .grid {
      display: grid;
      gap: .85rem
    }

    .g4 {
      grid-template-columns: repeat(4, minmax(0, 1fr))
    }

    .g3 {
      grid-template-columns: repeat(3, minmax(0, 1fr))
    }

    .g2 {
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .card {
      background: linear-gradient(160deg, var(--harbor-2), var(--harbor));
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 1rem 1.1rem;
      min-width: 0;
      transition: transform .18s ease, box-shadow .18s ease
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow)
    }

    .stat .k {
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue);
      display: flex;
      align-items: center;
      gap: .4rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .stat .v {
      font-family: var(--sans);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.018em;
      font-weight: 800;
      font-size: clamp(1.3rem, 3.6vw, 1.8rem);
      line-height: 1.15;
      margin-top: .3rem;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere
    }

    .stat .s {
      font-size: .77rem;
      color: var(--muted);
      margin-top: .1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    /* ── public quote page ── */
    body.pubq .app,
    body.pubq .tabbar,
    body.pubq .fab,
    body.pubq #gate,
    body.pubq #scrim {
      display: none !important
    }

    body.pubq {
      overflow: auto
    }

    .pubq-wrap {
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(1rem, 4vw, 3rem) 1rem calc(3rem + env(safe-area-inset-bottom))
    }

    .pubq-card {
      width: 100%;
      max-width: 620px;
      background: var(--harbor);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(1.2rem, 4vw, 2rem)
    }

    .pubq-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem
    }

    .pubq-card h1 {
      font-family: var(--disp);
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0
    }

    .pubq-card h2 {
      font-family: var(--disp);
      font-size: 1.25rem;
      margin: 1.4rem 0 .2rem
    }

    .pubq-tk {
      font-family: var(--mono);
      font-size: .66rem;
      color: var(--muted);
      border: 1px solid var(--line-2);
      border-radius: 7px;
      padding: .2rem .45rem
    }

    .pubq-mut {
      color: var(--muted);
      font-size: .86rem;
      margin: .25rem 0
    }

    .pubq-scope {
      background: var(--harbor-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .75rem .85rem;
      margin: 1rem 0;
      white-space: pre-wrap;
      font-size: .9rem
    }

    .pubq-t {
      width: 100%;
      border-collapse: collapse;
      margin: 1.1rem 0 .4rem;
      /* the global `table` rule carries min-width:680px for the app's wide data
     tables, which are wrapped in .tablewrap and scroll. This one must fit a
     phone instead. */
      min-width: 0;
      table-layout: fixed
    }

    .pubq-t td:first-child {
      word-break: break-word
    }

    .pubq-t td {
      padding: .6rem 0;
      border-bottom: 1px solid var(--line);
      vertical-align: top
    }

    .pubq-n {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-weight: 600
    }

    .pubq-tot {
      margin-top: .9rem;
      font-variant-numeric: tabular-nums
    }

    .pubq-tot div {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: .28rem 0;
      font-size: .92rem
    }

    .pubq-tot span {
      color: var(--muted)
    }

    .pubq-grand {
      border-top: 1px solid var(--line);
      margin-top: .45rem;
      padding-top: .6rem !important;
      font-size: 1.1rem !important
    }

    .pubq-grand b {
      font-weight: 800
    }

    .pubq-act {
      margin-top: 1.6rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--line)
    }

    .pubq-act label {
      display: block;
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .35rem
    }

    .pubq-act input {
      width: 100%;
      background: var(--harbor-2);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: .75rem .8rem;
      font-size: 16px;
      color: inherit;
      font-family: inherit
    }

    .pubq-act input:focus {
      border-color: var(--wood);
      outline: none
    }

    .pubq-btn {
      width: 100%;
      margin-top: .6rem;
      padding: .85rem 1rem;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--wood-soft), var(--wood));
      color: var(--on-wood);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer
    }

    .pubq-btn:disabled {
      opacity: .6
    }

    .pubq-ok {
      margin-top: 1.5rem;
      background: color-mix(in srgb, var(--done) 14%, transparent);
      border: 1px solid var(--done);
      border-radius: 12px;
      padding: .85rem .9rem;
      font-size: .92rem
    }

    .pubq-fine {
      color: var(--muted);
      font-size: .76rem;
      margin-top: .7rem
    }

    .pubq-foot {
      margin-top: 1.6rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .8rem;
      text-align: center
    }

    .pubq-foot a {
      color: var(--wood-soft)
    }

    .statread {
      display: flex;
      align-items: center;
      gap: .5rem;
      background: var(--harbor-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .62rem .75rem
    }

    .statread b {
      font-weight: 600
    }

    .stat.alert .v {
      color: var(--wood-soft)
    }

    .stat.good .v {
      color: var(--done)
    }

    .stat.bad .v {
      color: var(--red)
    }

    h2.sec {
      font-size: .96rem;
      font-weight: 600;
      margin: 1.7rem 0 .7rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      color: var(--bone);
      flex-wrap: wrap
    }

    h2.sec::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
      min-width: 20px
    }

    h2.sec .tag {
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .1em;
      color: var(--muted);
      text-transform: uppercase
    }

    /* ── filter bar ────────────────────────────────── */
    .filters {
      display: flex;
      gap: .45rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1rem
    }

    .filters select {
      background: var(--harbor);
      border: 1px solid var(--line-2);
      border-radius: 9px;
      padding: .4em 1.9em .4em .7em;
      font-size: .82rem;
      color: var(--bone);
      cursor: pointer;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--blue) 50%), linear-gradient(135deg, var(--blue) 50%, transparent 50%);
      background-position: calc(100% - 14px) 51%, calc(100% - 9px) 51%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat
    }

    .filters select:focus {
      outline: none;
      border-color: var(--wood)
    }

    .filters .tally {
      margin-left: auto;
      font-family: var(--mono);
      font-size: .76rem;
      color: var(--muted);
      white-space: nowrap
    }

    .filters .clear {
      color: var(--wood-soft);
      background: none;
      border: 0;
      font-size: .8rem;
      text-decoration: underline
    }

    .pill {
      border: 1px solid var(--line-2);
      background: transparent;
      border-radius: 999px;
      padding: .36em .8em;
      font-size: .81rem;
      color: var(--muted);
      transition: all .15s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: .42em
    }

    h2.sec .dot {
      box-shadow: none
    }

    .pill:hover {
      color: var(--bone);
      border-color: var(--bone)
    }

    .pill.on {
      background: var(--bone);
      color: var(--ink);
      border-color: var(--bone);
      font-weight: 600
    }

    .pill .n {
      font-family: var(--mono);
      font-size: .71rem;
      opacity: .65;
      margin-left: .35em
    }

    .pill.f-red.on {
      background: var(--red);
      border-color: var(--red);
      color: var(--on-red)
    }

    .pill.f-yellow.on {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--on-yellow)
    }

    .pill.f-green.on {
      background: var(--green);
      border-color: var(--green);
      color: var(--on-green)
    }

    /* ── rows ──────────────────────────────────────── */
    .row {
      display: flex;
      align-items: center;
      gap: .75rem;
      background: var(--harbor);
      border: 1px solid var(--line);
      border-left: 3px solid var(--muted);
      border-radius: 12px;
      padding: .75rem .9rem;
      margin-bottom: .5rem;
      transition: background .16s ease, box-shadow .16s ease;
      cursor: pointer;
      min-width: 0
    }

    .row:hover {
      background: var(--harbor-2);
      box-shadow: var(--shadow)
    }

    .row.s-lead {
      border-left-color: var(--lead)
    }

    .row.s-quoted {
      border-left-color: var(--quoted)
    }

    .row.s-scheduled {
      border-left-color: var(--sched)
    }

    .row.s-active {
      border-left-color: var(--active)
    }

    .row.s-done {
      border-left-color: var(--done)
    }

    .row.s-paid {
      border-left-color: var(--paid)
    }

    .row.s-cancelled {
      border-left-color: var(--grey);
      opacity: .72
    }

    .row.s-cancelled .t {
      text-decoration: line-through;
      text-decoration-color: var(--muted)
    }

    .c-cancelled {
      color: var(--grey)
    }

    .row.f-red {
      border-left-color: var(--red)
    }

    .row.f-yellow {
      border-left-color: var(--yellow)
    }

    .row.f-green {
      border-left-color: var(--green)
    }

    .row.f-grey {
      border-left-color: var(--grey)
    }

    .row .main {
      min-width: 0;
      flex: 1 1 auto
    }

    .row .t {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: .45rem;
      line-height: 1.4
    }

    .row .t>* {
      flex-shrink: 0
    }

    .row .sub {
      font-size: .8rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: .06rem
    }

    .row .sub.warn {
      color: var(--red)
    }

    .row .right {
      text-align: right;
      flex-shrink: 0;
      min-width: 0
    }

    .row .amt {
      font-family: var(--mono);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .row .owed {
      font-family: var(--mono);
      font-size: .71rem;
      color: var(--wood-soft);
      margin-top: .1rem;
      white-space: nowrap
    }

    .rowacts {
      display: flex;
      gap: .3rem;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity .16s ease
    }

    /* an empty actions or amount block used to leave a phantom 0.75rem gap on the right of the row */
    .rowacts:empty,
    .row .right:empty {
      display: none
    }

    .row:hover .rowacts,
    .row:focus-within .rowacts {
      opacity: 1
    }

    .iconbtn {
      width: 31px;
      height: 31px;
      border-radius: 9px;
      border: 1px solid var(--line-2);
      background: rgba(var(--tint-rgb), .03);
      display: grid;
      place-items: center;
      color: var(--blue);
      transition: background .15s ease, color .15s ease;
      flex-shrink: 0
    }

    .iconbtn:hover {
      background: rgba(var(--tint-rgb), .12);
      color: var(--bone)
    }

    .chip {
      display: inline-block;
      font-family: var(--mono);
      font-size: .57rem;
      letter-spacing: .09em;
      text-transform: uppercase;
      padding: .24em .48em;
      border-radius: 6px;
      border: 1px solid currentColor;
      font-weight: 500;
      white-space: nowrap
    }

    .c-lead {
      color: var(--lead)
    }

    .c-quoted {
      color: var(--quoted)
    }

    .c-scheduled {
      color: var(--sched)
    }

    .c-active {
      color: var(--active)
    }

    .c-done {
      color: var(--done)
    }

    .c-paid {
      color: var(--paid)
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(var(--tint-rgb), .05)
    }

    .d-red {
      background: var(--red);
      position: relative
    }

    .d-red::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(var(--red-rgb), .16);
      animation: breathe 2.2s ease-in-out infinite;
      will-change: transform, opacity
    }

    h2.sec .d-red::after,
    .seg.on .d-red::after,
    .statread .d-red::after {
      display: none
    }

    /* transform + opacity only — a box-shadow keyframe forces a repaint every frame */
    @keyframes breathe {

      0%,
      100% {
        transform: scale(1);
        opacity: .85
      }

      50% {
        transform: scale(1.75);
        opacity: .12
      }
    }

    .d-yellow {
      background: var(--yellow)
    }

    .d-green {
      background: var(--green)
    }

    .d-grey {
      background: var(--grey)
    }

    .miss {
      font-family: var(--mono);
      font-size: .56rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--red);
      border: 1px solid currentColor;
      border-radius: 5px;
      padding: .14em .4em;
      white-space: nowrap
    }

    .daygroup {
      margin-bottom: 1rem
    }

    .dayhead {
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .4rem;
      display: flex;
      gap: .5rem;
      align-items: center;
      flex-wrap: wrap
    }

    .dayhead b {
      color: var(--blue);
      font-weight: 600
    }

    .daygroup.hot .dayhead b {
      color: var(--wood-soft)
    }

    /* ── table ─────────────────────────────────────── */
    .tablewrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--harbor);
      -webkit-overflow-scrolling: touch
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px
    }

    th {
      font-family: var(--mono);
      font-size: .59rem;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--blue);
      text-align: left;
      padding: .65rem .85rem;
      background: var(--deep);
      white-space: nowrap
    }

    td {
      padding: .62rem .85rem;
      border-top: 1px solid var(--line);
      vertical-align: middle
    }

    tbody tr {
      cursor: pointer;
      transition: background .15s ease
    }

    tbody tr:hover {
      background: var(--harbor-2)
    }

    td.num {
      font-family: var(--mono);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums
    }

    .qty {
      font-family: var(--mono);
      font-weight: 600;
      min-width: 1.7em;
      display: inline-block;
      text-align: center
    }

    .qty.low {
      color: var(--wood-soft)
    }

    .qty.out {
      color: var(--red)
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      gap: .22rem
    }

    .stepper button {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid var(--line-2);
      background: transparent;
      line-height: 1;
      font-family: var(--mono);
      color: var(--blue);
      transition: background .15s ease, color .15s ease
    }

    .stepper button:hover {
      background: rgba(var(--tint-rgb), .1);
      color: var(--bone)
    }

    .sku {
      font-family: var(--mono);
      font-size: .67rem;
      color: var(--muted);
      margin-top: .08rem
    }

    /* ── pull to refresh ───────────────────────────── */
    .ptr {
      position: fixed;
      left: 50%;
      top: calc(env(safe-area-inset-top, 0px) + .3rem);
      z-index: 70;
      transform: translate(-50%, -120%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--harbor-2);
      border: 1px solid var(--line-2);
      color: var(--wood-soft);
      box-shadow: 0 10px 26px -10px rgba(var(--sh), .8);
      pointer-events: none
    }

    .ptr {
      opacity: 0
    }

    .ptr .ic {
      width: 20px;
      height: 20px;
      stroke-width: 2
    }

    .ptr.spin .ic {
      animation: ptrspin .8s linear infinite
    }

    @keyframes ptrspin {
      to {
        transform: rotate(360deg)
      }
    }

    /* ── modal tabs ────────────────────────────────── */
    /* ── page-level section tabs (Money, Data) ────────
   Distinct from .tabs/.tab, which are the in-modal
   underline tabs on the job card. These are a padded
   segmented track that scrolls sideways on a phone. */
    .ptabs {
      display: inline-flex;
      max-width: 100%;
      gap: .15rem;
      margin: 0 0 1.1rem;
      padding: .28rem;
      border-radius: 14px;
      background: var(--harbor-2);
      border: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch
    }

    .ptabs::-webkit-scrollbar {
      display: none
    }

    .ptab {
      flex: 0 0 auto;
      white-space: nowrap;
      background: none;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .63rem;
      letter-spacing: .11em;
      text-transform: uppercase;
      font-weight: 600;
      padding: .54rem .8rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .42rem;
      transition: color .16s ease, background .16s ease, border-color .16s ease
    }

    .ptab:hover {
      color: var(--bone)
    }

    .ptab.on {
      color: var(--bone);
      background: var(--harbor);
      border-color: var(--line-2);
      box-shadow: 0 6px 16px -12px rgba(var(--sh), .7)
    }

    .ptab .n {
      font-family: var(--mono);
      font-size: .6rem;
      font-weight: 500;
      color: var(--blue);
      letter-spacing: .04em
    }

    /* ── estimator ── */
    .estbar {
      display: flex;
      gap: .45rem;
      flex-wrap: wrap;
      align-items: center;
      margin: 0 0 .8rem
    }

    .estbar select {
      flex: 1 1 190px;
      min-width: 0
    }

    .estrow {
      background: var(--harbor);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .65rem .7rem;
      margin-bottom: .55rem
    }

    .esth {
      display: flex;
      gap: .45rem;
      align-items: center;
      margin-bottom: .5rem
    }

    .estname {
      flex: 1;
      min-width: 0
    }

    .estdel {
      flex: 0 0 auto;
      background: none;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      width: 30px;
      height: 30px;
      line-height: 1;
      font-size: 1rem;
      cursor: pointer
    }

    .estdel:hover {
      color: var(--red);
      border-color: var(--red)
    }

    .estg {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
      gap: .4rem
    }

    .estg label {
      display: block;
      font-family: var(--mono);
      font-size: .54rem;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .18rem
    }

    .estg input,
    .estg select,
    .estbar select,
    .estname {
      width: 100%;
      background: var(--harbor-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: .5rem .55rem;
      transition: border-color .15s ease, background .15s ease
    }

    .estg input:focus,
    .estg select:focus,
    .estbar select:focus,
    .estname:focus {
      border-color: var(--wood);
      outline: none
    }

    .estname {
      font-weight: 600
    }

    .estg input[readonly] {
      color: var(--muted);
      background: var(--harbor)
    }

    .estl {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: .5rem;
      margin-top: .5rem;
      padding-top: .45rem;
      border-top: 1px solid var(--line)
    }

    .estl span {
      font-family: var(--mono);
      font-size: .58rem;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .estt {
      font-weight: 700
    }

    .estx {
      color: var(--muted);
      font-size: .72rem
    }

    .estempty {
      border: 1px dashed var(--line-2);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      color: var(--muted);
      font-size: .82rem;
      margin-bottom: .8rem
    }

    .estmar {
      display: flex;
      justify-content: space-between;
      gap: .6rem;
      margin-top: .55rem;
      padding: .55rem .7rem;
      background: var(--harbor-2);
      border: 1px solid var(--line);
      border-radius: 11px;
      font-size: .8rem
    }

    .estmar b {
      font-weight: 700
    }

    .pbrow .sku {
      font-family: var(--mono);
      font-size: .62rem;
      color: var(--muted)
    }

    .estlink {
      margin-top: .45rem
    }

    .estlink label {
      display: block;
      font-family: var(--mono);
      font-size: .54rem;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .18rem
    }

    .estlink input {
      width: 100%;
      background: var(--harbor-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: .5rem .55rem
    }

    .estlink input:focus {
      border-color: var(--wood);
      outline: none
    }

    .estflag {
      margin-top: .45rem;
      font-size: .72rem;
      color: var(--wood-soft)
    }

    .estsup {
      color: var(--wood-soft);
      text-transform: none;
      letter-spacing: 0
    }

    /* ── photos ── */
    .phbar {
      display: flex;
      justify-content: space-between;
      gap: .6rem;
      flex-wrap: wrap;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: .9rem
    }

    .phmeta {
      font-family: var(--mono);
      font-size: .62rem;
      letter-spacing: .06em;
      color: var(--muted)
    }

    .phslot {
      margin-bottom: 1.1rem
    }

    .phrow {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: .55rem
    }

    .phrow h3 {
      font-size: 1rem;
      margin: 0;
      flex: 0 0 auto
    }

    .phrow .btn {
      margin-left: auto
    }

    .phgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
      gap: .5rem
    }

    .phcell {
      position: relative;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--harbor-2)
    }

    .phcell img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      cursor: zoom-in
    }

    .phcell figcaption {
      font-family: var(--mono);
      font-size: .55rem;
      color: var(--muted);
      padding: .25rem .35rem;
      text-align: center
    }

    .phdel {
      position: absolute;
      top: .25rem;
      right: .25rem;
      width: 24px;
      height: 24px;
      line-height: 1;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, .55);
      color: #fff;
      font-size: .95rem;
      cursor: pointer
    }

    .phdel:hover {
      background: var(--red)
    }

    .phdrop {
      border: 1px dashed var(--line-2);
      border-radius: 10px;
      padding: .9rem;
      text-align: center;
      color: var(--muted);
      font-size: .8rem
    }

    /* ── to-order list ── */
    .ordrow {
      display: flex;
      gap: .7rem;
      align-items: flex-start;
      justify-content: space-between;
      background: var(--harbor);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .75rem .85rem;
      margin-bottom: .6rem
    }

    .ordrow.done {
      opacity: .72
    }

    .ordmain {
      min-width: 0;
      flex: 1
    }

    .ordmain .t {
      display: flex;
      gap: .5rem;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: .2rem
    }

    .ordmain .qty {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--wood-soft)
    }

    .ordmain .sku {
      font-family: var(--mono);
      font-size: .62rem;
      color: var(--muted)
    }

    .ordmain .sub {
      font-size: .76rem;
      color: var(--muted);
      margin-top: .2rem
    }

    .ordacts {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex: 0 0 auto
    }

    .ordacts .btn {
      text-decoration: none
    }

    @media(max-width:620px) {
      .ordrow {
        flex-direction: column;
        align-items: stretch
      }

      .ordacts {
        justify-content: flex-start
      }

      .ordacts .btn {
        flex: 1 1 auto;
        text-align: center
      }
    }

    .ptab.on .n {
      color: var(--wood-soft)
    }

    .ptab.warn.on {
      color: var(--red)
    }

    .ptab.warn.on .n {
      color: var(--red)
    }

    @media (max-width:620px) {
      .ptabs {
        display: flex;
        width: 100%
      }

      .ptab {
        flex: 1 0 auto
      }
    }

    @media (max-width:380px) {
      .tabbar button {
        font-size: .53rem
      }
    }

    .tabs {
      display: flex;
      gap: .3rem;
      padding: .7rem 1.15rem 0;
      border-bottom: 1px solid var(--line)
    }

    .tab {
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: .92rem;
      padding: .5rem .7rem;
      margin-bottom: -1px
    }

    .tab:hover {
      color: var(--bone)
    }

    .tab.on {
      color: var(--bone);
      border-bottom-color: var(--wood)
    }

    /* ── customer type-ahead ───────────────────────── */
    .combo {
      position: relative
    }

    .combolist {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + .3rem);
      z-index: 5;
      background: var(--ink);
      border: 1px solid var(--line-2);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 22px 50px -18px rgba(var(--sh), .85);
      max-height: min(46vh, 320px);
      overflow-y: auto
    }

    .comboitem,
    .comboadd {
      display: flex;
      align-items: center;
      gap: .6rem;
      width: 100%;
      background: none;
      border: 0;
      color: var(--bone);
      text-align: left;
      padding: .68rem .85rem;
      font-size: .93rem;
      border-bottom: 1px solid var(--line)
    }

    .comboitem span {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .comboitem small {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--muted);
      flex-shrink: 0
    }

    .comboitem:hover,
    .comboadd:hover {
      background: rgba(var(--wood-rgb), .2)
    }

    .comboadd {
      color: var(--wood-soft);
      font-weight: 600
    }

    .comboempty {
      padding: .7rem .85rem;
      color: var(--muted);
      font-size: .88rem
    }

    .contactline {
      font-size: .84rem;
      color: var(--blue);
      margin-top: .4rem;
      overflow-wrap: anywhere
    }

    .segdis {
      opacity: .42
    }

    .lognote {
      background: var(--harbor);
      border-left: 3px solid var(--sched);
      border-radius: 10px;
      padding: .6rem .75rem;
      margin-bottom: .45rem;
      font-size: .89rem;
      overflow-wrap: anywhere
    }

    .lognote-h {
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: .2rem
    }

    /* ── audit log ─────────────────────────────────── */
    .log {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: .55rem .8rem;
      align-items: start
    }

    .logrow {
      display: contents
    }

    .logwhen {
      font-family: var(--mono);
      font-size: .63rem;
      color: var(--muted);
      white-space: nowrap;
      padding-top: .2rem
    }

    .logbody {
      min-width: 0;
      padding-bottom: .55rem;
      border-bottom: 1px solid var(--line)
    }

    .logtop {
      font-size: .88rem;
      overflow-wrap: anywhere
    }

    .logtop b {
      font-weight: 600
    }

    .logact {
      font-family: var(--mono);
      font-size: .56rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      border: 1px solid currentColor;
      border-radius: 5px;
      padding: .1em .35em;
      margin-right: .4em
    }

    .a-insert {
      color: var(--done)
    }

    .a-update {
      color: var(--sched)
    }

    .a-delete {
      color: var(--red)
    }

    .logdiff {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      margin-top: .2rem;
      overflow-wrap: anywhere
    }

    .who {
      color: var(--muted)
    }

    /* dashed = we are guessing the name from the address, not reading the roster */
    .who.unlinked {
      border-bottom: 1px dashed var(--line-2);
      cursor: help
    }

    .logdiff s {
      color: var(--red);
      text-decoration: none;
      opacity: .75
    }

    .logdiff em {
      color: var(--done);
      font-style: normal
    }

    /* ── tickets ───────────────────────────────────── */
    .tk {
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .06em;
      color: var(--blue);
      border: 1px solid var(--line-2);
      border-radius: 5px;
      padding: .14em .4em;
      flex-shrink: 0
    }

    .age {
      font-family: var(--mono);
      font-size: .66rem;
      letter-spacing: .04em;
      color: var(--muted);
      white-space: nowrap
    }

    .age.warm {
      color: var(--active)
    }

    .age.hot {
      color: var(--red);
      font-weight: 600
    }

    .byline {
      font-size: .7rem;
      color: var(--muted);
      opacity: .85;
      margin-top: .1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .locked {
      opacity: .55;
      pointer-events: none
    }

    .gatehint {
      font-size: .78rem;
      color: var(--muted);
      margin-top: .4rem
    }

    /* ── roles ─────────────────────────────────────── */
    .rolebadge {
      display: inline-block;
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .11em;
      text-transform: uppercase;
      padding: .22em .5em;
      border-radius: 6px;
      border: 1px solid var(--wood-soft);
      color: var(--wood-soft);
      margin-top: .3rem
    }

    .rolebadge.admin {
      border-color: var(--done);
      color: var(--done)
    }

    .member {
      display: flex;
      align-items: center;
      gap: .8rem;
      background: var(--harbor);
      border: 1px solid var(--line);
      border-left: 3px solid var(--wood-soft);
      border-radius: 12px;
      padding: .7rem .9rem;
      margin-bottom: .5rem;
      cursor: pointer;
      min-width: 0
    }

    .member .main {
      flex: 1;
      min-width: 0
    }

    .member .t {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .member .sub {
      font-size: .79rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .member.isme {
      border-left-color: var(--done)
    }

    /* ── login gate ────────────────────────────────── */
    .gate {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: radial-gradient(120% 90% at 50% 0%, var(--gate-a), var(--ink));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem
    }

    .gate.off {
      display: none
    }

    .gatebox {
      width: min(400px, 100%);
      background: linear-gradient(160deg, var(--harbor-2), var(--harbor));
      border: 1px solid var(--line-2);
      border-radius: 22px;
      padding: 1.8rem 1.5rem;
      text-align: center;
      box-shadow: 0 40px 90px -30px rgba(var(--sh), .9)
    }

    .gatebox img {
      width: 60px;
      height: 60px;
      border-radius: 17px;
      margin: 0 auto .9rem
    }

    .gatebox h2 {
      font-size: 1.4rem;
      font-weight: 800
    }

    .gsub {
      font-size: .86rem;
      color: var(--blue);
      margin-bottom: 1.3rem
    }

    .gatebox .field {
      text-align: left
    }

    .gatebox .btn {
      width: 100%;
      margin-top: .4rem;
      padding: .85em
    }

    .gerr {
      color: var(--red);
      font-size: .83rem;
      margin-top: .7rem;
      min-height: 1.1em
    }

    .gsmall {
      background: none;
      border: 0;
      color: var(--muted);
      font-size: .78rem;
      text-decoration: underline;
      margin-top: 1rem
    }

    .gsmall:hover {
      color: var(--bone)
    }

    .sync {
      display: inline-flex;
      align-items: center;
      gap: .4em;
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--blue);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .3em .7em;
      white-space: nowrap
    }

    .sync .d {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--done);
      flex-shrink: 0
    }

    .sync.busy .d {
      background: var(--wood-soft);
      animation: blink .9s infinite
    }

    .sync.off .d {
      background: var(--red)
    }

    .sync.bad {
      border-color: var(--red);
      color: var(--red)
    }

    .sync.tappable {
      cursor: pointer
    }

    .sync.queue .d {
      background: var(--yellow)
    }

    @keyframes blink {
      50% {
        opacity: .25
      }
    }

    .whoami {
      font-family: var(--disp);
      font-weight: 800;
      font-size: .98rem;
      letter-spacing: -.01em;
      color: var(--bone)
    }

    .railfoot .out {
      background: none;
      border: 0;
      color: var(--wood-soft);
      font-family: var(--mono);
      font-size: .58rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-decoration: underline;
      padding: 0;
      margin-top: .5rem
    }

    .stamp {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--muted);
      text-align: right;
      margin-top: .5rem
    }

    /* ── metrics ───────────────────────────────────── */
    .panel {
      background: linear-gradient(160deg, var(--harbor-2), var(--harbor));
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 1.05rem 1.15rem;
      min-width: 0
    }

    .panel .cap {
      font-family: var(--mono);
      font-size: .59rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue);
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
      margin-bottom: .2rem
    }

    .panel .cap .spacer {
      flex: 1
    }

    .panel h3 {
      font-family: var(--disp);
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: .75rem
    }

    .tog {
      display: flex;
      gap: .25rem
    }

    .tog button {
      border: 1px solid var(--line-2);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      padding: .2em .55em;
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .08em;
      text-transform: uppercase
    }

    .tog button.on {
      background: var(--bone);
      color: var(--ink);
      border-color: var(--bone)
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: .45rem;
      height: 132px;
      margin-top: .3rem
    }

    .bar {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: .32rem;
      min-width: 0
    }

    .bar i {
      display: block;
      width: 100%;
      max-width: 54px;
      border-radius: 8px 8px 3px 3px;
      height: var(--h);
      min-height: 4px;
      background: linear-gradient(180deg, var(--wood-soft), var(--wood));
      animation: grow .55s cubic-bezier(.2, .8, .3, 1) both
    }

    .bar.now i {
      background: linear-gradient(180deg, var(--bar-top), var(--done))
    }

    .bar.zero i {
      background: rgba(var(--tint-rgb), .09)
    }

    @keyframes grow {
      from {
        height: 0
      }

      to {
        height: var(--h)
      }
    }

    .bar .v {
      font-family: var(--mono);
      font-size: .62rem;
      color: var(--bone);
      white-space: nowrap
    }

    .bar .l {
      font-family: var(--mono);
      font-size: .57rem;
      letter-spacing: .09em;
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap
    }

    .hbar {
      display: grid;
      grid-template-columns: minmax(66px, 34%) minmax(0, 1fr) auto;
      gap: .55rem;
      align-items: center;
      margin-bottom: .42rem;
      font-size: .82rem
    }

    .hbar .nm {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--bone)
    }

    .hbar .track {
      background: rgba(var(--tint-rgb), .07);
      border-radius: 6px;
      height: 10px;
      overflow: hidden
    }

    .hbar .fill {
      height: 100%;
      border-radius: 6px;
      width: var(--w);
      background: var(--blue);
      animation: widen .6s cubic-bezier(.2, .8, .3, 1) both
    }

    @keyframes widen {
      from {
        width: 0
      }

      to {
        width: var(--w)
      }
    }

    .hbar .n {
      font-family: var(--mono);
      font-size: .74rem;
      color: var(--muted);
      white-space: nowrap
    }

    .goalbar {
      height: 13px;
      border-radius: 9px;
      background: rgba(var(--tint-rgb), .08);
      overflow: hidden;
      margin: .55rem 0 .45rem
    }

    .goalbar i {
      display: block;
      height: 100%;
      border-radius: 9px;
      width: var(--w);
      background: linear-gradient(90deg, var(--wood-soft), var(--done));
      animation: widen .7s cubic-bezier(.2, .8, .3, 1) both
    }

    .goalrow {
      display: flex;
      justify-content: space-between;
      gap: .6rem;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: .73rem;
      color: var(--muted)
    }

    .goalrow b {
      color: var(--bone)
    }

    .editgoal {
      background: none;
      border: 0;
      color: var(--wood-soft);
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-decoration: underline
    }

    .mini {
      display: flex;
      gap: 1.3rem;
      flex-wrap: wrap;
      margin-top: .85rem;
      padding-top: .85rem;
      border-top: 1px solid var(--line)
    }

    .mini>div {
      min-width: 0
    }

    .mini .k {
      font-family: var(--mono);
      font-size: .56rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue)
    }

    .mini .v {
      font-family: var(--sans);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.015em;
      font-weight: 800;
      font-size: 1.12rem;
      line-height: 1.2
    }

    /* ── empty ─────────────────────────────────────── */
    .empty {
      border: 1px dashed var(--line-2);
      border-radius: var(--r);
      padding: 2.1rem 1.3rem;
      text-align: center;
      color: var(--muted)
    }

    .empty b {
      display: block;
      color: var(--bone);
      font-family: var(--disp);
      font-size: 1.14rem;
      font-weight: 600;
      margin-bottom: .3rem
    }

    .empty .btn {
      margin-top: 1rem
    }

    /* ── modal ─────────────────────────────────────── */
    .scrim {
      position: fixed;
      inset: 0;
      background: var(--scrim-bg);
      backdrop-filter: blur(5px);
      z-index: 60;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 4vh .8rem 3rem;
      overflow-y: auto
    }

    .scrim.on {
      display: flex;
      animation: fade .18s ease
    }

    @keyframes fade {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .modal {
      width: min(600px, 100%);
      background: var(--ink);
      border: 1px solid var(--line-2);
      border-radius: 18px;
      box-shadow: 0 50px 100px rgba(var(--sh), .7);
      animation: pop .22s cubic-bezier(.2, .8, .3, 1);
      overflow: hidden
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.985)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .modal header {
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: .7rem;
      flex-wrap: wrap
    }

    .modal header h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-right: auto;
      min-width: 0;
      overflow-wrap: anywhere
    }

    .modal .body {
      padding: 1.15rem
    }

    .modal footer {
      padding: .9rem 1.15rem;
      border-top: 1px solid var(--line);
      display: flex;
      gap: .5rem;
      justify-content: flex-end;
      flex-wrap: wrap
    }

    /* action row inside a hand-built modal body (notifications, invoice).
   Mirrors .modal footer without the border/padding. Distinct from .rowacts. */
    .acts {
      display: flex;
      gap: .5rem;
      justify-content: flex-end;
      flex-wrap: wrap
    }

    .acts>.btn {
      min-width: 0
    }

    .field {
      margin-bottom: .8rem;
      min-width: 0
    }

    .field label {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-family: var(--mono);
      font-size: .59rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: .3rem
    }

    .field label .req {
      color: var(--wood-soft)
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      background: var(--harbor);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .62rem .75rem;
      transition: border-color .15s ease, background .15s ease
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      background: var(--harbor-2);
      border-color: var(--wood);
      outline: none
    }

    /* max-height is what actually stops the drag handle — without it a note box
   can be pulled down forever and the footer walks off the bottom of the sheet */
    .field textarea {
      min-height: 72px;
      max-height: 300px;
      resize: vertical;
      overflow-y: auto
    }

    .wc {
      font-family: var(--mono);
      font-size: .65rem;
      color: var(--muted);
      margin-top: .28rem;
      display: flex;
      justify-content: space-between;
      gap: .6rem;
      flex-wrap: wrap
    }

    .wc:empty {
      display: none
    }

    .wc .n {
      flex-shrink: 0;
      margin-left: auto;
      font-variant-numeric: tabular-nums
    }

    .wc.over {
      color: var(--red)
    }

    .wc.under {
      color: var(--wood-soft)
    }

    .field.bad input,
    .field.bad textarea {
      border-color: var(--red);
      background: rgba(var(--red-rgb), .06)
    }

    .field .err {
      display: none;
      color: var(--red);
      font-size: .76rem;
      margin-top: .26rem
    }

    .field.bad .err {
      display: block
    }

    .two {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: .8rem
    }

    .hint {
      font-size: .75rem;
      color: var(--muted);
      margin-top: .25rem
    }

    .rule {
      background: var(--harbor);
      border-left: 3px solid var(--wood);
      border-radius: 10px;
      padding: .6rem .8rem;
      font-size: .79rem;
      color: var(--blue);
      margin-bottom: .9rem
    }

    .rule b {
      color: var(--bone)
    }

    .balance {
      background: var(--harbor);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .55rem .8rem;
      font-family: var(--mono);
      font-size: .8rem;
      display: flex;
      justify-content: space-between;
      gap: .6rem;
      margin-bottom: .8rem;
      flex-wrap: wrap
    }

    .balance b {
      color: var(--wood-soft)
    }

    .segs {
      display: flex;
      gap: .28rem;
      flex-wrap: wrap
    }

    .seg {
      border: 1px solid var(--line-2);
      background: transparent;
      border-radius: 9px;
      padding: .38em .65em;
      font-size: .79rem;
      color: var(--muted);
      transition: all .15s ease;
      display: inline-flex;
      align-items: center;
      gap: .35em
    }

    .seg:hover {
      border-color: var(--bone);
      color: var(--bone)
    }

    .seg.on {
      background: var(--bone);
      color: var(--ink);
      border-color: var(--bone);
      font-weight: 600
    }

    .seg.on .dot {
      box-shadow: none
    }

    .seg.on.g-red {
      background: var(--red);
      border-color: var(--red);
      color: var(--on-red)
    }

    .seg.on.g-yellow {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--on-yellow)
    }

    .seg.on.g-green {
      background: var(--green);
      border-color: var(--green);
      color: var(--on-green)
    }

    .pillrow {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
      align-items: center
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.4rem;
      transform: translate(-50%, 150%);
      background: var(--toast-bg);
      color: var(--toast-fg);
      font-weight: 600;
      padding: .65rem .8rem .65rem 1rem;
      border-radius: 12px;
      z-index: 90;
      box-shadow: 0 20px 46px rgba(var(--sh), .5);
      display: flex;
      align-items: center;
      gap: .8rem;
      max-width: min(440px, 92vw);
      transition: transform .32s cubic-bezier(.2, .8, .3, 1);
      font-size: .92rem
    }

    .toast.on {
      transform: translate(-50%, 0)
    }

    .toast span {
      min-width: 0;
      overflow-wrap: anywhere
    }

    .toast button {
      background: var(--toast-btn-bg);
      color: var(--toast-btn-fg);
      border: 0;
      border-radius: 8px;
      padding: .4em .75em;
      font-weight: 600;
      font-size: .84rem;
      flex-shrink: 0
    }

    .banner {
      display: flex;
      align-items: center;
      gap: .8rem;
      background: linear-gradient(160deg, var(--harbor-2), var(--harbor));
      border: 1px solid var(--line);
      border-left: 3px solid var(--wood);
      border-radius: 12px;
      padding: .8rem .95rem;
      margin-bottom: 1.1rem;
      flex-wrap: wrap
    }

    .banner .txt {
      flex: 1 1 220px;
      font-size: .86rem;
      color: var(--blue);
      min-width: 0
    }

    .banner .txt b {
      color: var(--bone);
      display: block
    }

    .note {
      background: var(--harbor);
      border-left: 3px solid var(--wood);
      border-radius: 12px;
      padding: .85rem 1rem;
      font-size: .86rem;
      color: var(--blue);
      margin-bottom: 1rem
    }

    .note b {
      color: var(--bone)
    }

    .fab {
      display: none
    }

    .tabbar {
      display: none
    }

    .in {
      animation: rise .32s cubic-bezier(.2, .8, .3, 1) both
    }

    [data-anim="0"] .in {
      animation: none
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @media (max-width:1080px) {
      .g4 {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media (max-width:900px) {
      .app {
        grid-template-columns: minmax(0, 1fr)
      }

      .rail {
        display: none
      }

      main {
        padding-bottom: 6.8rem
      }

      .pad {
        padding: 1rem max(.9rem, env(safe-area-inset-left)) 1rem max(.9rem, env(safe-area-inset-right))
      }

      .topbar {
        padding: calc(.7rem + env(safe-area-inset-top)) .9rem .7rem
      }

      .topbar h1 {
        font-size: 1.18rem;
        width: 100%;
        margin: 0 0 .1rem
      }

      .search {
        max-width: none;
        flex: 1 1 auto
      }

      .topbar .btn.primary {
        display: none
      }

      .rowacts {
        opacity: 1
      }

      .iconbtn {
        width: 42px;
        height: 42px
      }

      .filters .tally {
        margin-left: 0;
        width: 100%
      }

      .modal footer .btn {
        flex: 1 1 130px
      }

      .acts>.btn {
        flex: 1 1 130px
      }

      .fab {
        display: grid;
        place-items: center;
        position: fixed;
        right: 1rem;
        bottom: calc(5.6rem + env(safe-area-inset-bottom));
        z-index: 45;
        width: 60px;
        height: 60px;
        border-radius: 20px;
        border: 0;
        color: var(--on-wood);
        background: linear-gradient(135deg, var(--wood-soft), var(--wood));
        box-shadow: 0 14px 30px -10px rgba(var(--sh), .8)
      }

      .fab .ic {
        width: 24px;
        height: 24px;
        stroke-width: 2
      }

      .tabbar {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 1fr);
        position: fixed;
        left: .6rem;
        right: .6rem;
        bottom: calc(.55rem + env(safe-area-inset-bottom));
        z-index: 40;
        background: var(--tabbar-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--line-2);
        border-radius: 20px;
        padding: .34rem .3rem;
        box-shadow: 0 20px 44px -14px rgba(var(--sh), .8)
      }

      .tabbar button {
        background: none;
        border: 0;
        color: var(--bone);
        opacity: .55;
        padding: .4rem 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: .18rem;
        font-size: .58rem;
        font-family: var(--mono);
        letter-spacing: .04em;
        text-transform: uppercase;
        transition: opacity .15s ease, color .15s ease;
        min-width: 0
      }

      .tabbar button.on {
        opacity: 1;
        color: var(--wood-soft)
      }
    }

    /* phones only: single column */
    @media (max-width:620px) {

      .g4,
      .g3,
      .g2 {
        grid-template-columns: minmax(0, 1fr)
      }

      .row {
        padding: .85rem .8rem;
        gap: .55rem;
        flex-wrap: wrap
      }

      .row .main {
        flex: 1 1 100%
      }

      .row .rowacts {
        order: 3
      }

      .row .right {
        order: 2;
        margin-left: auto;
        text-align: right
      }

      .row .amt {
        font-size: .95rem
      }

      .row .owed {
        font-size: .68rem
      }

      /* the name can wrap here, so the flag dot and chips have to sit on the
     FIRST line rather than float to the vertical centre of a two-line block */
      .row .t {
        white-space: normal;
        overflow: visible;
        align-items: flex-start
      }

      .row .t>.dot {
        margin-top: .4rem
      }

      .row .t>.tk,
      .row .t>.miss {
        margin-top: .17rem
      }

      .row .sub {
        white-space: normal
      }

      .stat .v {
        font-size: clamp(1.25rem, 7vw, 1.7rem)
      }

      .balance {
        font-size: .76rem
      }

      .tabs {
        padding: .6rem .9rem 0
      }

      .log {
        grid-template-columns: minmax(0, 1fr)
      }

      .logwhen {
        padding-top: 0
      }

      .hbar {
        grid-template-columns: minmax(56px, 40%) minmax(0, 1fr) auto;
        font-size: .78rem
      }

      .bar .v {
        font-size: .56rem
      }

      .filters select {
        max-width: 100%
      }
    }

    @media (max-width:380px) {
      .row .amt {
        font-size: .88rem
      }

      .tk {
        font-size: .55rem
      }
    }

    /* modals become bottom sheets with pinned header + actions */
    @media (max-width:900px) {
      .scrim {
        padding: 0;
        align-items: flex-end
      }

      .modal {
        width: 100%;
        max-height: 92vh;
        max-height: 92dvh;
        display: flex;
        flex-direction: column;
        border-radius: 22px 22px 0 0;
        border-bottom: 0;
        animation: sheet .3s cubic-bezier(.2, .85, .3, 1)
      }

      .modal header {
        position: sticky;
        top: 0;
        z-index: 3;
        background: var(--ink);
        border-radius: 22px 22px 0 0
      }

      .modal header::before {
        content: "";
        position: absolute;
        top: .45rem;
        left: 50%;
        transform: translateX(-50%);
        width: 38px;
        height: 4px;
        border-radius: 4px;
        background: var(--line-2)
      }

      .modal header {
        padding-top: 1.3rem
      }

      .modal .body {
        overflow-y: auto;
        flex: 1 1 auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain
      }

      .modal footer {
        position: sticky;
        bottom: 0;
        z-index: 3;
        background: var(--ink);
        padding-bottom: calc(.9rem + env(safe-area-inset-bottom));
        box-shadow: 0 -12px 24px -18px #000
      }

      .field input,
      .field select,
      .field textarea,
      .search input,
      .estg input,
      .estg select,
      .estbar select,
      .estname {
        font-size: 16px
      }

      /* one padding value for the whole sheet so the header, tabs, body and footer line up */
      .modal {
        --sheet-x: 1rem
      }

      .modal header {
        padding: 1.3rem var(--sheet-x) .85rem
      }

      .modal .tabs {
        padding: .55rem var(--sheet-x) 0
      }

      .modal .body {
        padding: 1rem var(--sheet-x) 1.15rem
      }

      .modal footer {
        padding: .85rem var(--sheet-x);
        padding-bottom: calc(.85rem + env(safe-area-inset-bottom))
      }

      .modal header h3 {
        font-size: 1.08rem
      }

      .modal .body>.pane>.field:first-child {
        margin-top: 0
      }

      .balance {
        padding: .6rem .75rem
      }
    }

    @keyframes sheet {
      from {
        transform: translateY(100%)
      }

      to {
        transform: none
      }
    }

    /* every finger target on a touch screen */
    @media (pointer:coarse) {
      .stepper button {
        width: 40px;
        height: 40px;
        font-size: 1.1rem
      }

      .qty {
        min-width: 2.2em;
        font-size: 1.02rem
      }

      .pill {
        padding: .52em 1em
      }

      .seg {
        padding: .58em .9em
      }

      .navbtn {
        padding: .82rem .75rem
      }

      .tabbar button {
        padding: .55rem 0
      }

      .btn {
        padding: .75em 1.15em
      }

      .btn.sm {
        padding: .55em .9em
      }

      .rowacts {
        opacity: 1
      }

      .modal footer .btn {
        flex: 1 1 130px;
        padding: .85em 1em
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important
      }
    }

    /* ── Planner ─────────────────────────────────────────────────────
   Stage colour arrives per-chip as an inline --x, so this adds no new
   colour tokens and no new --on-* pairs. */
    .calbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .6rem;
      flex-wrap: wrap;
      margin: 0 0 .85rem
    }

    .calnav {
      display: flex;
      align-items: center;
      gap: .4rem;
      flex-wrap: wrap
    }

    .callabel {
      font-family: var(--disp);
      font-size: 1.02rem;
      font-weight: 600;
      min-width: 9.5rem
    }

    .calsel {
      max-width: 15rem
    }

    .caldow {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 4px
    }

    .caldow span {
      font-family: var(--mono);
      font-size: .56rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center
    }

    .calgrid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px
    }

    .calday {
      min-height: 88px;
