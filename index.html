          dim = Math.round(dim * 0.7);                          /* still fat — shrink the pixels */
        }
        if (bmp.close) bmp.close();
        return out;                                         /* best effort; caller checks size */
      }

      async function uploadPhotos(job, slot, files) {
        if (!ONLINE || !sb) return toast('Photos need a connection — try again once you\u2019re back online');
        const already = photosOf(job, slot).length;
        const room = PH_MAX_PER_SLOT - already;
        if (room <= 0) return toast(`That\u2019s the ${PH_MAX_PER_SLOT}-photo limit for ${slot}. Delete one first.`);
        const list = [...files].slice(0, room);
        if (files.length > room) toast(`Only room for ${room} more \u2014 taking the first ${room}`);
        let done = 0, failed = 0, skipped = 0;
        setSync('busy', 'Uploading');
        for (const f of list) {
          if (!/^image\//.test(f.type || '')) { skipped++; continue; }
          const shrunk = await shrinkImage(f);
          if (!shrunk || !shrunk.blob) { failed++; continue; }
          if (shrunk.blob.size > PH_HARD_BYTES) { failed++; continue; }
          const path = `${job.id}/${slot}/${uid()}.jpg`;
          const { error } = await sb.storage.from(PH_BUCKET)
            .upload(path, shrunk.blob, { contentType: 'image/jpeg', upsert: false });
          if (error) { console.warn('photo upload failed', error); failed++; continue; }
          job.photos = (Array.isArray(job.photos) ? job.photos : []).concat([{
            id: uid(), slot, path, w: shrunk.w, h: shrunk.h, bytes: shrunk.blob.size,
            at: new Date().toISOString(), by: MYEMAIL || who()
          }]);
          done++;
        }
        if (done) { upsert('jobs', job); save(); }
        syncBadge();
        const bits = [];
        if (done) bits.push(done + ' added');
        if (failed) bits.push(failed + " couldn't be read");
        if (skipped) bits.push(skipped + ' not an image');
        toast(bits.length ? bits.join(' \u00b7 ') : 'Nothing to upload');
        return done;
      }

      async function removePhoto(job, photoId) {
        const p = photosOf(job).find(x => x.id === photoId); if (!p) return;
        if (!confirm('Delete this photo? It is removed from storage and cannot be undone.')) return;
        if (ONLINE && sb) {
          const { error } = await sb.storage.from(PH_BUCKET).remove([p.path]);
          /* a missing object is fine — the row going is the point */
          if (error && !/not.*found/i.test(error.message || '')) { console.warn('photo delete failed', error); return toast('Could not delete that photo'); }
        } else return toast('Deleting a photo needs a connection');
        job.photos = photosOf(job).filter(x => x.id !== photoId);
        upsert('jobs', job); save(); toast('Photo deleted');
      }

      /* Signed URLs, because the bucket is private. Cached for the modal's life so
         flipping between tabs doesn't re-sign the same images every time. */
      const phUrlCache = new Map();
      async function signPhotos(list) {
        const need = list.filter(p => !phUrlCache.has(p.path)).map(p => p.path);
        if (need.length && ONLINE && sb) {
          const { data, error } = await sb.storage.from(PH_BUCKET).createSignedUrls(need, PH_SIGN_SECS);
          if (error) console.warn('signing failed', error);
          (data || []).forEach(d => { if (d && d.signedUrl && !d.error) phUrlCache.set(d.path, d.signedUrl); });
        }
        return list.map(p => ({ ...p, url: phUrlCache.get(p.path) || '' }));
      }

      /* one place that answers "is this SKU already something we stock or price" */
      const partBySku = sk => {
        const k = String(sk || '').trim().toLowerCase();
        return k ? db.parts.find(p => String(p.sku || '').trim().toLowerCase() === k) : null;
      };
      /* Estimate line -> parts. Runs on job save so a link typed while quoting
         reaches the catalogue without waiting for someone to tap Ordered.
         Deliberately only FILLS BLANKS on parts that already exist — it never
         creates a part (that's the auto-create trap the To-order list avoids) and
         never overwrites a link or supplier somebody chose. */
      function backfillPartLinks(job) {
        if (!seeMoney()) return 0;
        let n = 0;
        estLines(job).forEach(l => {
          const url = safeUrl(l.link); if (!url) return;
          const p = partBySku(l.sku); if (!p) return;
          let touched = false;
          if (!safeUrl(p.link)) { p.link = url; touched = true; }
          if (touched && !String(p.supplier || '').trim()) p.supplier = supplierFromUrl(url);
          if (touched) { upsert('parts', p); n++; }
        });
        return n;
      }
      function safeUrl(u) {
        const t = String(u || '').trim(); if (!t) return '';
        try {
          const p = new URL(/^https?:\/\//i.test(t) ? t : 'https://' + t);
          return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : '';
        } catch (e) { return ''; }
      }
      /* a price-book row becomes a line. A part with a price set uses it as the
         override; one with only a cost falls through to cost + markup. */
      const lineFromPart = p => ({
        id: uid(), sku: p.sku || '', link: p.link || '', name: p.name || '',
        kind: p.kind || 'material', unit: p.unit || 'each', qty: 1, w: '', h: '',
        waste: WASTEABLE(p.unit || 'each') ? WASTE_DEFAULT : 0,
        cost: Number(p.cost) || 0, markup: Number(p.markup) || 0,
        price: Number(p.price) > 0 ? Number(p.price) : '', ordered: false, orderedAt: ''
      });
      const tel = p => String(p || '').replace(/[^0-9+]/g, '');
      const icon = n => `<svg class="ic" viewBox="0 0 24 24"><use href="#i-${n}"/></svg>`;
      const jobsOf = id => db.jobs.filter(j => j.customerId === id);
      const uniq = a => [...new Set(a.filter(Boolean))].sort();

      /* record completeness — first + last + at least one of phone/email */
      function missingBits(c) {
        const m = [];
        if (!String(c.first || '').trim()) m.push('first name');
        if (!String(c.last || '').trim()) m.push('last name');
        if (!String(c.phone || '').trim() && !String(c.email || '').trim()) m.push('phone or email');
        return m;
      }

      /* ═══ customer status ═══════════════════════════
         Derived from that customer's job stages every render.
         A hand-set status is a temporary pin: as soon as the
         jobs change what the automatic status would be, the pin
         releases and the customer follows the jobs again.      */
      function autoFlag(c) {
        const t = today(), js = jobsOf(c.id);
        const gap = missingBits(c);
        if (gap.length) return { level: 'red', why: 'Record incomplete — missing ' + gap.join(' + ') };
        if (c.followUp && c.followUp <= t) return { level: 'red', why: 'Follow-up due ' + niceDate(c.followUp) };
        const late = js.find(j => j.date && j.date < t && ['quoted', 'scheduled', 'active'].includes(j.status));
        if (late) return { level: 'red', why: '“' + late.title + '” is past its date' };
        const stale = js.find(j => ['lead', 'quoted'].includes(j.status) && !j.date && j.created && (Date.now() - new Date(j.created).getTime()) > 3 * 864e5);
        if (stale) return { level: 'red', why: '“' + stale.title + '” has sat 3+ days with no date' };
        const owedOld = js.find(j => owed(j) > 0 && j.status === 'done' && j.date && j.date < plus(-14));
        if (owedOld) return { level: 'red', why: (seeMoney() ? money(owed(owedOld)) + ' unpaid' : 'Unpaid') + ' for over 2 weeks' };
        const open = js.filter(isOpen);
        if (open.length) {
          const n = {}; open.forEach(j => n[j.status] = (n[j.status] || 0) + 1);
          return { level: 'yellow', why: STATUS.filter(s => n[s[0]]).map(s => n[s[0]] + ' ' + s[1].toLowerCase()).join(' · ') };
        }
        const cancelled = js.filter(j => j.status === 'cancelled').length;
        if (js.length) return { level: 'green', why: (js.length - cancelled) + ' paid' + (cancelled ? ' · ' + cancelled + ' cancelled' : '') + ' and closed' };
        return { level: 'grey', why: 'No jobs logged yet' };
      }
      function flagInfo(c) {
        const auto = autoFlag(c);
        if (c.flag && c.flag !== 'auto')
          return { level: c.flag, why: 'Pinned to ' + flagName(c.flag).toLowerCase() + ' · ' + auto.why, pinned: true, auto };
        return auto;
      }
      /* release any pin whose underlying job picture has moved on */
      function syncFlags() {
        db.customers.forEach(c => {
          if (c.flag && c.flag !== 'auto' && c.flagBasis !== autoFlag(c).level) {
            c.flag = 'auto'; c.flagBasis = ''; push('customers', c);
          }
        });
      }
      const flagOf = c => flagInfo(c).level;

      /* ═══ toast ═════════════════════════════════════ */
      function toast(msg, action) {
        const t = $('#toast');
        t.innerHTML = '';
        const s = document.createElement('span'); s.textContent = msg; t.appendChild(s);
        if (action) {
          const b = document.createElement('button'); b.textContent = action.label;
          b.onclick = () => { action.run(); t.classList.remove('on'); }; t.appendChild(b);
        }
        t.classList.add('on'); clearTimeout(t._h);
        t._h = setTimeout(() => t.classList.remove('on'), action ? 7000 : 2600);
      }
      async function copy(text, msg) {
        try { await navigator.clipboard.writeText(text); toast(msg || 'Copied'); }
        catch (e) {
          const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select();
          try { document.execCommand('copy'); toast(msg || 'Copied'); } catch (_) { toast('Could not copy'); } a.remove();
        }
      }

      /* ═══ note length rules ═════════════════════════
         One place to change the limits. NOTE_MIN is the "customer called" guard —
         a note has to be a real sentence before it is worth anyone reading. */
      const NOTE_MAX = 256, NOTE_MIN = 8, NOTE_MAXCHARS = 2400;
      const wordCount = s => String(s || '').trim().split(/\s+/).filter(Boolean).length;

      /* Attaches a live counter under a textarea and hands back a validator.
         floor:false  → cap only, no minimum (parts and customer notes)
         required:true→ may not be left empty at all                          */
      function wireNote(sel, opts) {
        const el = $(sel); if (!el || el.readOnly) return () => '';
        opts = opts || {};
        const floor = opts.floor !== false, required = !!opts.required;
        el.setAttribute('maxlength', String(NOTE_MAXCHARS));
        const c = document.createElement('div'); c.className = 'wc';
        el.parentNode.insertBefore(c, el.nextSibling);
        const draw = () => {
          const n = wordCount(el.value), empty = !n;
          const short = floor && !empty && n < NOTE_MIN;
          let note = '';
          if (empty) note = required ? 'A full sentence is required.' : (floor ? 'A sentence or two, not two words.' : '');
          else if (n > NOTE_MAX) note = (n - NOTE_MAX) + ' over the limit';
          else if (short) note = (NOTE_MIN - n) + ' more word' + (NOTE_MIN - n === 1 ? '' : 's') + ' needed';
          c.innerHTML = `<span>${esc(note)}</span>` + (empty ? '' : `<span class="n">${n} / ${NOTE_MAX}</span>`);
          c.classList.toggle('over', n > NOTE_MAX);
          c.classList.toggle('under', short || (empty && required));
        };
        el.addEventListener('input', draw); draw();
        /* returns '' when valid, otherwise the message to show */
        return () => {
          const n = wordCount(el.value);
          if (!n) return required ? 'Write a note before saving — a sentence about what actually happened.' : '';
          if (n > NOTE_MAX) return 'That note is ' + n + ' words. Keep it under ' + NOTE_MAX + ' — trim it or split it across two notes.';
          if (floor && n < NOTE_MIN) return 'Write a full sentence — at least ' + NOTE_MIN + ' words. “Customer called” tells the next person nothing.';
          return '';
        };
      }
      /* run a list of validators, flag the first failure, and stop the save */
      function checkNotes(pairs) {
        for (const [wrap, check, sel] of pairs) {
          const msg = check();
          if (msg) {
            const w = $(wrap); if (w) w.classList.add('bad');
            const err = w && w.querySelector('.err'); if (err) err.textContent = msg;
            const el = $(sel); if (el) { el.focus(); if (el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
            toast(msg);
            return false;
          }
          const w = $(wrap); if (w) w.classList.remove('bad');
        }
        return true;
      }

      /* ═══ modal ═════════════════════════════════════ */
      const scrim = $('#scrim'), modal = $('#modal');
      /* Anything a modal wires up outside its own DOM (global listeners, timers)
         registers a teardown here, so nothing survives the modal that created it. */
      let modalCleanup = [], modalDirty = false;
      function onModalClose(fn) { modalCleanup.push(fn); }
      function runModalCleanup() {
        const q = modalCleanup; modalCleanup = [];
        q.forEach(f => { try { f(); } catch (e) { console.error('modal cleanup', e); } });
      }
      function openModal(html) {
        runModalCleanup(); modalDirty = false; modal.innerHTML = html; scrim.classList.add('on');
        const f = modal.querySelector('input,select,textarea'); if (f && innerWidth > 900) setTimeout(() => f.focus(), 50);
      }
      function closeModal() { runModalCleanup(); modalDirty = false; scrim.classList.remove('on'); modal.innerHTML = ''; }
      /* a stray tap on the backdrop used to wipe a half-filled card with no warning */
      function requestClose() {
        if (modalDirty && !confirm('Close without saving? What you typed on this card will be lost.')) return;
        closeModal();
      }
      modal.addEventListener('input', () => { modalDirty = true; });
      modal.addEventListener('change', () => { modalDirty = true; });
      modal.addEventListener('click', e => { if (e.target.closest('.seg,.comboitem,.comboadd')) modalDirty = true; });
      scrim.addEventListener('click', e => { if (e.target === scrim) requestClose(); });
      addEventListener('unhandledrejection', e => console.error('unhandled', e.reason));

      /* ═══ routing + filter state ════════════════════ */
      let view = 'today', query = '';
      const F = {
        job: { stage: 'open', type: '', cust: '', who: '', sort: 'date' },
        cust: { flag: '', source: '', sort: 'name', owing: false },
        part: { stock: '', device: '', supplier: '', sort: 'name' }
      };
      const TITLES = {
        today: 'Today', jobs: 'Jobs', customers: 'Customers', parts: 'Parts inventory',
        money: 'Money', data: 'Data & backup'
      };
      /* A view can be gated. Hiding the button is presentation only — what a
         person can actually READ is enforced by RLS in Postgres, not here. */
      const VIEWOK = { money: () => isAdmin() };
      const viewAllowed = v => !VIEWOK[v] || VIEWOK[v]();
      /* which section of Money / Data is open */
      let moneyTab = 'invoices', dataTab = 'overview';
      /* Planner state. jobsTab starts on 'list' deliberately — tapping Jobs
         should still land on the working list, not a calendar. */
      let jobsTab = 'list', calAnchor = '', planWho = '';
      /* Parts is two things now: what's on the shelf, and what things cost. */
      let partsTab = 'inventory';
      function syncNav() {
        $$('[data-need="admin"]').forEach(b => { b.hidden = !isAdmin(); });
      }
      function go(v) {
        if (!viewAllowed(v)) v = 'today';          /* never strand anyone on a hidden tab */
        view = v; $('#viewTitle').textContent = v === 'today' ? greet() : TITLES[v];
        $$('.navbtn,.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
        scrollTo({ top: 0 }); render();
      }
      /* one segmented track, used by both Money and Data */
      const ptabs = (tabs, cur, attr) => `<div class="ptabs" role="tablist">${tabs.map(t =>
        `<button class="ptab ${t.warn ? 'warn ' : ''}${t.k === cur ? 'on' : ''}" role="tab" data-ptab="${attr}" data-k="${t.k}"
    aria-selected="${t.k === cur}">${esc(t.label)}${t.n != null ? `<span class="n">${t.n}</span>` : ''}</button>`).join('')}</div>`;

      $$('.navbtn,.tabbar button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
      let qTimer = null;
      $('#q').addEventListener('input', e => {
        const v = e.target.value.trim().toLowerCase();
        clearTimeout(qTimer);
        /* render() ends in a synchronous save(), so typing "kitchen" used to mean
           seven full repaints and seven localStorage writes. One is enough. */
        qTimer = setTimeout(() => { if (v === query) return; query = v; render(); }, 140);
      });
      function addNew() { view === 'customers' ? editCustomer() : view === 'parts' ? editPart() : editJob(); }
      $('#addBtn').addEventListener('click', addNew);
      loadLeadsRead();
      $('#bell').addEventListener('click', openNotifs);
      $('#fab').addEventListener('click', addNew);
      addEventListener('keydown', e => {
        if (e.key === 'Escape') { if (scrim.classList.contains('on')) requestClose(); return; }
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
        if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
        if (e.key.toLowerCase() === 'n') { e.preventDefault(); addNew(); }
      });

      /* ═══ render ════════════════════════════════════ */
      const greet = () => {
        const h = new Date().getHours();
        return h < 5 ? 'Burning the midnight oil' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      };
      const TAGLINES = ['All hands on Deck', 'Steady as she goes', 'Tight cables, tight ship', 'Quote it · book it · anchor it', 'Drop anchor, get paid'];
      function render() {
        syncFlags();
        if (view === 'today') $('#viewTitle').textContent = greet();
        const t = today();
        const needy = db.customers.filter(c => flagOf(c) === 'red').length;
        setTxt('c-today', db.jobs.filter(j => j.date === t && isOpen(j)).length || '');
        setTxt('c-jobs', db.jobs.filter(isOpen).length || '');
        setTxt('c-cust', needy || '');
        setTxt('c-parts', (db.parts.filter(p => p.track !== false && Number(p.qty) <= Number(p.lowAt || 0)).length + openOrders().length) || '');
        /* lastExport is a UTC timestamp; slicing the first 10 chars gave the UTC
           date, so an evening export in New York read as "Tomorrow". iso() shifts
           to local time first. */
        setTxt('lastexp', db.meta.lastExport ? niceDate(iso(new Date(db.meta.lastExport))) : 'never');
        identify();
        syncNav();
        syncBell();
        if (!viewAllowed(view)) view = 'today';   /* tier changed under us mid-session */
        setTxt('c-money', isAdmin() ? (invoiceable().filter(j => owed(j) > 0).length || '') : '');
        ({ today: vToday, jobs: vJobs, customers: vCustomers, parts: vParts, money: vMoney, data: vData }[view])();
        save();
      }
      function backupBanner() {
        if (!db.jobs.length && !db.customers.length) return '';
        const last = db.meta.lastExport;
        if (last && (Date.now() - new Date(last).getTime()) < 7 * 864e5) return '';
        return `<div class="banner in">${icon('alert')}<div class="txt"><b>Back up your data</b>
    ${last ? 'The last backup by anyone on the team is over a week old.' : 'Nobody has exported a backup yet.'}</div>
    <button class="btn line sm" data-act="backup">Export now</button></div>`;
      }

      /* ═══ metrics ═══════════════════════════════════ */
      let chartMode = 'cash';
      /* the Collected mode is money; keep non-managers off it even though the
         button that switches to it is hidden from them */
      const chartSafe = () => { if (!seeMoney() && chartMode === 'cash') chartMode = 'jobs'; return chartMode; };
      const kMoney = n => { n = Number(n) || 0; return n >= 1000 ? '$' + (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : '$' + Math.round(n); };
      function lastMonths(k) {
        const out = [], now = new Date();
        for (let i = k - 1; i >= 0; i--) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          out.push({
            key: ('' + d.getFullYear()) + '-' + String(d.getMonth() + 1).padStart(2, '0'),
            label: d.toLocaleDateString('en-US', { month: 'short' })
          });
        }
        return out;
      }
      function pulse() {
        const t = today(), months = lastMonths(6), thisMo = t.slice(0, 7);
        const cash = m => db.jobs.filter(j => j.date && j.date.slice(0, 7) === m).reduce((s, j) => s + (Number(j.paid) || 0), 0);
        const won = m => db.jobs.filter(j => j.date && j.date.slice(0, 7) === m).length;
        const leads = m => db.jobs.filter(j => j.created && j.created.slice(0, 7) === m).length;
        const series = months.map(m => ({ ...m, v: chartSafe() === 'cash' ? cash(m.key) : chartMode === 'jobs' ? won(m.key) : leads(m.key) }));
        const max = Math.max(1, ...series.map(s => s.v));
        const fmt = v => chartMode === 'cash' ? kMoney(v) : String(v);

        const goal = Number(db.meta.goal) || 0, got = cash(thisMo);
        const pct = goal > 0 ? Math.min(100, Math.round(got / goal * 100)) : 0;

        const stages = STATUS.filter(s => s[0] !== 'cancelled').map(s => ({
          k: s[0], n: s[1],
          c: db.jobs.filter(j => j.status === s[0]).length,
          v: db.jobs.filter(j => j.status === s[0]).reduce((a, j) => a + (Number(j.price) || 0), 0)
        }));
        const stageMax = Math.max(1, ...stages.map(s => s.c));

        const srcMap = {}; db.customers.forEach(c => { const k = (c.source || '').trim() || 'Not recorded'; srcMap[k] = (srcMap[k] || 0) + 1; });
        const srcs = Object.entries(srcMap).sort((a, b) => b[1] - a[1]).slice(0, 6);
        const srcMax = Math.max(1, ...srcs.map(s => s[1]));

        const team = {}; db.jobs.filter(isOpen).forEach(j => { const k = (j.assignee || '').trim() || 'Unassigned'; team[k] = (team[k] || 0) + 1; });
        const crew = Object.entries(team).sort((a, b) => b[1] - a[1]);
        const crewMax = Math.max(1, ...crew.map(c => c[1]));

        const paidJobs = db.jobs.filter(j => j.status === 'paid');
        const closeRate = db.jobs.length ? Math.round(paidJobs.length / db.jobs.length * 100) : 0;
        const avgJob = paidJobs.length ? paidJobs.reduce((s, j) => s + (Number(j.price) || 0), 0) / paidJobs.length : 0;
        const pipeline = db.jobs.filter(j => ['quoted', 'scheduled', 'active'].includes(j.status)).reduce((s, j) => s + (Number(j.price) || 0), 0);

        return `<h2 class="sec">The numbers</h2>
  <div class="grid g2">
    <div class="panel">
      <div class="cap">Last 6 months<span class="spacer"></span>
        <span class="tog">
          ${seeMoney() ? `<button data-cm="cash" class="${chartSafe() === 'cash' ? 'on' : ''}">Collected</button>` : ''}
          <button data-cm="jobs" class="${chartSafe() === 'jobs' ? 'on' : ''}">Jobs</button>
          <button data-cm="leads" class="${chartSafe() === 'leads' ? 'on' : ''}">New leads</button>
        </span></div>
      <h3>${chartSafe() === 'cash' ? money(series.reduce((s, x) => s + x.v, 0)) + ' collected' : series.reduce((s, x) => s + x.v, 0) + (chartMode === 'jobs' ? ' jobs on the books' : ' leads logged')}</h3>
      <div class="bars">${series.map(s => `<div class="bar ${s.key === thisMo ? 'now' : ''} ${s.v ? '' : 'zero'}" title="${esc(s.label)}: ${fmt(s.v)}">
        <span class="v">${s.v ? fmt(s.v) : ''}</span><i style="--h:${Math.round(s.v / max * 100)}%"></i><span class="l">${s.label}</span></div>`).join('')}</div>
      <div class="mini">
        <div><div class="k">Close rate</div><div class="v">${closeRate}%</div></div>
        ${seeMoney() ? `<div><div class="k">Avg job</div><div class="v">${money(Math.round(avgJob))}</div></div>
        <div><div class="k">In the pipeline</div><div class="v">${money(pipeline)}</div></div>`
            : `<div><div class="k">Open jobs</div><div class="v">${db.jobs.filter(isOpen).length}</div></div>`}
      </div>
    </div>
    <div class="panel">
      ${seeMoney() ? `<div class="cap">This month's goal<span class="spacer"></span>
        ${isManager() ? '<button class="editgoal" data-goal>Change</button>' : ''}</div>
      <h3>${money(got)} <span style="color:var(--muted);font-size:.8rem;font-family:var(--mono)">of ${money(goal)}</span></h3>
      <div class="goalbar"><i style="--w:${pct}%"></i></div>
      <div class="goalrow"><span>${pct}% there</span><span>${got >= goal ? '<b>Goal met — nice.</b>' : '<b>' + money(Math.max(0, goal - got)) + '</b> to go'}</span></div>` : ''}
      <div class="cap"${seeMoney() ? ' style="margin-top:1.1rem"' : ''}>Pipeline by stage</div>
      ${stages.map(s => `<div class="hbar"><span class="nm">${esc(s.n)}</span>
        <span class="track"><span class="fill" style="--w:${Math.round(s.c / stageMax * 100)}%;background:var(--${s.k === 'done' ? 'done' : s.k === 'paid' ? 'paid' : s.k === 'active' ? 'active' : s.k === 'scheduled' ? 'sched' : s.k === 'quoted' ? 'quoted' : 'lead'})"></span></span>
        <span class="n">${s.c}${(s.v && seeMoney()) ? ' · ' + kMoney(s.v) : ''}</span></div>`).join('')}
    </div>
  </div>
  <div class="grid g2" style="margin-top:.85rem">
    <div class="panel"><div class="cap">Where customers come from</div>
      <h3>${db.customers.length} customer${db.customers.length === 1 ? '' : 's'}</h3>
      ${srcs.length ? srcs.map(s => `<div class="hbar"><span class="nm">${esc(s[0])}</span>
        <span class="track"><span class="fill" style="--w:${Math.round(s[1] / srcMax * 100)}%;background:var(--wood-soft)"></span></span>
        <span class="n">${s[1]}</span></div>`).join('') : '<div class="goalrow">Fill in “how they found you” to see which channel works.</div>'}</div>
    <div class="panel"><div class="cap">Open work by person</div>
      <h3>${db.jobs.filter(isOpen).length} open job${db.jobs.filter(isOpen).length === 1 ? '' : 's'}</h3>
      ${crew.length ? crew.map(c => `<div class="hbar"><span class="nm" title="${esc(withRole(c[0]))}">${esc(c[0] === 'Unassigned' ? c[0] : withRole(c[0]))}</span>
        <span class="track"><span class="fill" style="--w:${Math.round(c[1] / crewMax * 100)}%;background:${c[0] === 'Unassigned' ? 'var(--grey)' : 'var(--sched)'}"></span></span>
        <span class="n">${c[1]}</span></div>`).join('') : '<div class="goalrow">Nothing open right now.</div>'}</div>
  </div>`;
      }

      /* ═══ TODAY ═════════════════════════════════════ */
      function vToday() {
        if (query) return vSearch();
        const t = today(), h14 = plus(14);
        const open = db.jobs.filter(isOpen);
        const todays = open.filter(j => j.date === t);
        const upcoming = open.filter(j => j.date && j.date > t && j.date <= h14).sort((a, b) => a.date.localeCompare(b.date));
        const overdue = open.filter(j => j.date && j.date < t && j.status !== 'lead').sort((a, b) => a.date.localeCompare(b.date));
        const outstanding = db.jobs.reduce((s, j) => s + owed(j), 0);
        const owedCount = db.jobs.filter(j => owed(j) > 0).length;
        const monthPaid = db.jobs.filter(j => j.date && j.date.slice(0, 7) === t.slice(0, 7)).reduce((s, j) => s + (Number(j.paid) || 0), 0);
        const low = db.parts.filter(p => Number(p.qty) <= Number(p.lowAt || 0));
        const marked = db.customers.map(c => ({ c, f: flagInfo(c) }));
        const red = marked.filter(x => x.f.level === 'red'), yellow = marked.filter(x => x.f.level === 'yellow');
        const green = marked.filter(x => x.f.level === 'green');

        let h = backupBanner();
        h += `<div class="grid ${seeMoney() ? 'g4' : 'g3'}">
    <div class="card stat in ${red.length ? 'bad' : ''}"><div class="k">${icon('alert')} Needs attention</div><div class="v">${red.length}</div>
      <div class="s">${yellow.length} in progress · ${green.length} complete</div></div>
    <div class="card stat in"><div class="k">${icon('today')} Booked today</div><div class="v">${todays.length}</div><div class="s">${upcoming.length} in the next 14 days</div></div>
    ${seeMoney() ? `
    <div class="card stat in ${outstanding > 0 ? 'alert' : ''}"><div class="k">Owed to you</div><div class="v">${money(outstanding)}</div><div class="s">${owedCount} job${owedCount === 1 ? '' : 's'} unpaid</div></div>
    <div class="card stat in ${monthPaid > 0 ? 'good' : ''}"><div class="k">Collected this month</div><div class="v">${money(monthPaid)}</div><div class="s">${new Date().toLocaleDateString('en-US', { month: 'long' })}</div></div>`
            : `<div class="card stat in"><div class="k">Open jobs</div><div class="v">${open.length}</div><div class="s">${overdue.length} past their date</div></div>`}
  </div>`;

        if (db.jobs.length || db.customers.length) h += pulse();
        if (!db.jobs.length && !db.customers.length) {
          h += `<h2 class="sec">Start here</h2>
      <div class="empty"><b>Nothing on the board yet</b>Add a customer, then log the job.
        <div><button class="btn primary" data-act="new-customer">Add your first customer</button></div></div>`;
        }
        if (red.length) {
          h += `<h2 class="sec"><span class="dot d-red"></span>Needs attention <span class="tag">${red.length}</span></h2>` +
            red.map(x => custRow(x.c, x.f)).join('');
        }
        if (overdue.length) { h += `<h2 class="sec">Jobs past their date <span class="tag">${overdue.length}</span></h2>` + overdue.map(jobRow).join(''); }
        h += `<h2 class="sec">Today</h2>` + (todays.length ? todays.map(jobRow).join('') : `<div class="empty">Calm seas — nothing on the books today.</div>`);
        if (yellow.length) {
          h += `<h2 class="sec"><span class="dot d-yellow"></span>In progress <span class="tag">${yellow.length}</span></h2>` +
            yellow.slice(0, 8).map(x => custRow(x.c, x.f)).join('') +
            (yellow.length > 8 ? `<button class="btn line sm" data-act="see-yellow">See all ${yellow.length}</button>` : '');
        }
        h += `<h2 class="sec">Next 14 days</h2>`;
        if (!upcoming.length) h += `<div class="empty">Nothing booked ahead. That's the number worth fixing.</div>`;
        else {
          const by = {}; upcoming.forEach(j => { (by[j.date] = by[j.date] || []).push(j); });
          h += Object.keys(by).sort().map(d => `<div class="daygroup ${d <= plus(2) ? 'hot' : ''}">
      <div class="dayhead"><b>${niceDate(d)}</b> ${d}</div>${by[d].map(jobRow).join('')}</div>`).join('');
        }
        if (low.length) {
          h += `<h2 class="sec">Parts to reorder <span class="tag">${low.length}</span></h2>
    <div class="pillrow">`+ low.map(p => `<button class="pill" data-part="${p.id}">${esc(p.name)}<span class="n">${Number(p.qty) || 0}</span></button>`).join('') + `</div>`;
        }
        paint(h);
        $$('[data-cm]').forEach(b => b.addEventListener('click', () => { chartMode = b.dataset.cm; render(); }));
        $$('[data-goal]').forEach(b => b.addEventListener('click', () => {
          if (!isManager()) { toast('Only a manager or above can set the goal'); return; }
          const v = prompt('Monthly collection goal, in dollars:', db.meta.goal || 3000);
          if (v === null) return; const n = Number(String(v).replace(/[^0-9.]/g, ''));
          if (!isNaN(n) && n >= 0) { db.meta.goal = n; pushMeta(); render(); toast('Goal set to ' + money(n)); }
        }));
        $$('[data-act="see-yellow"]').forEach(b => b.addEventListener('click', () => { F.cust.flag = 'yellow'; go('customers'); }));
      }

      /* global search */
      function vSearch() {
        const hit = s => String(s || '').toLowerCase().includes(query);
        const jobs = db.jobs.filter(j => {
          const c = cust(j.customerId);
          return hit(j.ticket) || hit(j.title) || hit(j.notes) || hit(j.type) || hit(j.address) || hit(j.assignee) || (c && (hit(cname(c)) || hit(c.phone) || hit(c.address)));
        });
        const people = db.customers.filter(c => hit(cname(c)) || hit(c.phone) || hit(c.email) || hit(c.address) || hit(c.notes) || hit(c.source));
        const parts = db.parts.filter(p => hit(p.name) || hit(p.device) || hit(p.sku) || hit(p.supplier) || hit(p.notes));
        let h = `<div class="filters"><span class="tally">Results for “${esc(query)}”</span></div>`;
        if (!jobs.length && !people.length && !parts.length) h += `<div class="empty"><b>No matches</b>Try part of a name, address, or part number.</div>`;
        if (jobs.length) { h += `<h2 class="sec">Jobs <span class="tag">${jobs.length}</span></h2>` + jobs.map(jobRow).join(''); }
        if (people.length) { h += `<h2 class="sec">Customers <span class="tag">${people.length}</span></h2>` + people.map(c => custRow(c)).join(''); }
        if (parts.length) { h += `<h2 class="sec">Parts <span class="tag">${parts.length}</span></h2>` + parts.map(partRow).join(''); }
        paint(h);
      }
      const compact = () => matchMedia('(max-width:760px)').matches;
      function partCard(p) {
        const q = Number(p.qty) || 0, lo = Number(p.lowAt) || 0;
        const cls = q <= 0 ? 'out' : (q <= lo ? 'low' : '');
        const edge = q <= 0 ? 'var(--red)' : (q <= lo ? 'var(--wood-soft)' : 'var(--done)');
        const m = (Number(p.price) || 0) - (Number(p.cost) || 0);
        return `<div class="row in" data-part="${p.id}" style="border-left-color:${edge}">
    <div class="main"><div class="t">${esc(p.name)}</div>
      <div class="sub">${esc(p.device || '—')} · ${money(p.cost)} → ${money(p.price)} · ${money(m)} margin</div></div>
    <div class="rowacts"><span class="stepper">
      <button data-dec="${p.id}" aria-label="Used one">−</button>
      <span class="qty ${cls}">${q}</span>
      <button data-inc="${p.id}" aria-label="Received one">+</button></span></div></div>`;
      }
      const partRow = p => `<div class="row" data-part="${p.id}" style="border-left-color:var(--blue)">
  <div class="main"><div class="t">${esc(p.name)}</div><div class="sub">${esc(p.device || '—')} · ${Number(p.qty) || 0} on hand${p.supplier ? ' · ' + esc(p.supplier) : ''}</div></div>
  <div class="right"><div class="amt">${money(p.price)}</div></div></div>`;

      function jobRow(j) {
        const c = cust(j.customerId);
        const bits = [j.type, c ? cname(c) : 'No customer', j.date ? niceDate(j.date) : 'No date', niceTime(j.time), j.assignee ? '→ ' + withRole(j.assignee) : ''].filter(Boolean);
        const aged = isOpen(j) && j.created && since(j.created)
          ? ` · <span class="age ${ageCls(j.created)}" title="${esc(ageTitle(j.created))}">${esc(since(j.created))}</span>`
          : '';
        const acts = [];
        if (c && c.phone) acts.push(`<button class="iconbtn" data-text="${j.id}" title="Text customer" aria-label="Text customer">${icon('msg')}</button>`);
        acts.push(`<button class="iconbtn" data-quote="${j.id}" title="Copy quote" aria-label="Copy quote">${icon('copy')}</button>`);
        if (isOpen(j)) acts.push(`<button class="iconbtn" data-adv="${j.id}" title="Move to ${label(NEXT[j.status])}" aria-label="Advance stage">${icon('next')}</button>`);
        return `<div class="row s-${j.status}${isUnreadLead(j) ? ' unread' : ''} in" data-job="${j.id}">
    <div class="main"><div class="t">${j.ticket ? `<span class="tk">${esc(j.ticket)}</span>` : ''}${esc(j.title || 'Untitled job')}</div>
      <div class="sub">${esc(bits.join(' · '))}${aged}</div>
      ${j.updatedBy ? `<div class="byline">Last updated by ${esc(actor(j.updatedBy).name)}</div>` : ''}</div>
    <div class="rowacts">${acts.join('')}</div>
    <div class="right">${seeMoney() ? `<div class="amt">${money(j.price)}</div>
      ${owed(j) > 0 ? `<div class="owed">${money(owed(j))} owed</div>` : `<span class="chip c-${j.status}">${esc(label(j.status))}</span>`}`
            : `<span class="chip c-${j.status}">${esc(label(j.status))}</span>`}</div></div>`;
      }
      function custRow(c, f) {
        f = f || flagInfo(c);
        const js = jobsOf(c.id);
        const bal = js.reduce((s, j) => s + owed(j), 0), life = js.reduce((s, j) => s + (Number(j.paid) || 0), 0);
        const gaps = missingBits(c);
        const acts = c.phone ? `<a class="iconbtn" href="tel:${esc(tel(c.phone))}" title="Call" aria-label="Call">${icon('phone')}</a>
    <a class="iconbtn" href="sms:${esc(tel(c.phone))}" title="Text" aria-label="Text">${icon('msg')}</a>` : '';
        const right = !seeMoney() ? ''
          : (isExec() ? `<div class="amt">${money(life)}</div>` : '')
          + (bal > 0 ? `<div class="owed">${money(bal)} owed</div>` : '');
        return `<div class="row f-${f.level} in" data-cust="${c.id}">
    <div class="main"><div class="t"><span class="dot d-${f.level}" title="${esc(flagName(f.level))}"></span>${esc(cname(c))}
      ${gaps.length ? `<span class="miss">incomplete</span>` : ''}</div>
      <div class="sub ${f.level === 'red' ? 'warn' : ''}">${esc(f.why)}${c.phone ? ' · ' + esc(c.phone) : ''}</div></div>
    ${acts ? `<div class="rowacts">${acts}</div>` : ''}
    ${right ? `<div class="right">${right}</div>` : ''}</div>`;
      }

      let animKey = '';
      function paint(html) {
        /* animate the entrance when you ARRIVE somewhere, not every time the list
           redraws underneath you */
        const key = view + '|' + jobsTab + '|' + moneyTab + '|' + dataTab + '|' + partsTab;
        $('#view').dataset.anim = (key === animKey) ? '0' : '1';
        animKey = key;
        $('#view').innerHTML = html;
        $$('[data-job]').forEach(r => r.addEventListener('click', e => { if (!e.target.closest('.rowacts')) editJob(r.dataset.job); }));
        $$('[data-cust]').forEach(r => r.addEventListener('click', e => { if (!e.target.closest('.rowacts')) editCustomer(r.dataset.cust); }));
        $$('[data-part]').forEach(r => r.addEventListener('click', e => {
          /* a reorder link inside the row must open the shop, not the part card */
          if (e.target.closest('.stepper') || e.target.closest('a[href]')) return;
          editPart(r.dataset.part);
        }));
        $$('[data-adv]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); advance(b.dataset.adv); }));
        $$('[data-text]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); textCustomer(b.dataset.text); }));
        $$('[data-quote]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); copyQuote(b.dataset.quote); }));
        $$('[data-act="new-customer"]').forEach(b => b.addEventListener('click', () => editCustomer()));
        $$('[data-act="new-job"]').forEach(b => b.addEventListener('click', () => editJob()));
        $$('[data-act="new-part"]').forEach(b => b.addEventListener('click', () => editPart()));
        $$('[data-act="backup"]').forEach(b => b.addEventListener('click', exportBackup));
      }

      function advance(id) {
        const j = db.jobs.find(x => x.id === id); if (!j) return;
        const was = j.status, wasPaid = j.paid, to = NEXT[was];
        if (to === 'scheduled' && !isManager()) { toast('A manager has to approve the schedule'); return; }
        if (to === 'paid' && owed(j) > 0 && !isManager()) { toast('Only a manager or above can record a payment'); return; }
        if (to === 'paid' && owed(j) > 0) {
          if (!confirm('Mark paid — record the remaining ' + money(owed(j)) + ' as collected?')) return;
          j.paid = totalOf(j);
        }
        j.status = to; push('jobs', j);
        render(); toast(j.title + ' → ' + label(j.status), { label: 'Undo', run: () => { j.status = was; j.paid = wasPaid; push('jobs', j); render(); } });
      }
      function textCustomer(id) {
        const j = db.jobs.find(x => x.id === id); if (!j) { toast('That job is no longer here'); render(); return; }
        const c = cust(j.customerId);
        if (!c || !c.phone) { toast('No phone on file for this customer'); return; }
        const when = j.date ? niceDate(j.date) + (j.time ? ' at ' + niceTime(j.time) : '') : 'the scheduled date';
        const msg = `Hi ${c.first || cname(c)} — confirming ${j.title} for ${when}. Anything changes, just text me. — AnchorPoint`;
        location.href = 'sms:' + tel(c.phone) + '?&body=' + encodeURIComponent(msg);
      }
      function copyQuote(id) {
        const j = db.jobs.find(x => x.id === id); if (!j) { toast('That job is no longer here'); render(); return; }
        const c = cust(j.customerId);
        const lines = ['AnchorPoint IT & Installations', `Quote — ${j.title}`,
          c ? `For: ${cname(c)}${c.address ? ', ' + c.address : ''}` : null,
          j.date ? `Scheduled: ${niceDate(j.date)}${j.time ? ' at ' + niceTime(j.time) : ''}` : null, '',
          j.notes ? `Scope: ${j.notes}` : null, '',
          ...(estLines(j).length ? ['Breakdown:',
            ...estLines(j).map(l => '  \u00b7 ' + (l.name || 'Line item') +
              ((l.unit || 'each') === 'flat' ? '' : '  ' + estQty(l) + ' ' + unitLabel(l.unit || 'each')) +
              (seeMoney() ? '  \u2014  ' + money(estLine(l)) : '')), ''] : []),
          seeMoney() ? `Total: ${money(j.price)}` : null,
          (seeMoney() && Number(j.paid) > 0) ? `Paid to date: ${money(j.paid)}` : null,
          (seeMoney() && owed(j) > 0) ? `Balance due: ${money(owed(j))}` : null, '',
          'Jobs over $500 take a 50% deposit at booking. 30-day workmanship warranty in writing.',
          'Questions: ' + BIZ_PHONE].filter(x => x !== null);
        copy(lines.join('\n'), 'Quote copied — paste into a text or email');
      }

      /* ═══ JOBS ══════════════════════════════════════ */
      /* ── PLANNER ──────────────────────────────────────────────────
         A calendar over the same jobs. No new tables and no new columns:
         job_date, job_time, assignee and status are all inside the column
         grants staff already hold, so this needed no SQL and shows no money.
         Chips carry data-job, which paint() already wires to editJob, so a
         chip opens the same card as a list row. */
      const STCOL = {
        lead: '--lead', quoted: '--quoted', scheduled: '--sched', active: '--active',
        done: '--done', paid: '--paid', cancelled: '--grey'
      };
      const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
        'August', 'September', 'October', 'November', 'December'];
      /* Every date calculation runs on local Y-M-D parts, never on a Date
         parsed from the ISO string — new Date('2026-08-03') is UTC midnight
         and lands on Aug 2 in New York, which would put jobs on the wrong
         day for anyone west of Greenwich. Same bug class as the "Last backup
         said Tomorrow" one. */
      const ymd = s => { const p = String(s || '').split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
      const shift = (s, n) => { const d = ymd(s); d.setDate(d.getDate() + n); return iso(d); };
      const anchor = () => calAnchor || today();
      const byTime = (a, b) => (to24(a.time) || '99:99').localeCompare(to24(b.time) || '99:99');

      function planPool() {
        return db.jobs.filter(j => {
          if (j.status === 'cancelled') return false;
          if (planWho === '~un') return !String(j.assignee || '').trim();
          if (planWho) return j.assignee === planWho;
          return true;
        });
      }
      function dayMap() {
        const m = {}; planPool().filter(j => j.date).forEach(j => { (m[j.date] = m[j.date] || []).push(j); });
        Object.keys(m).forEach(k => m[k].sort(byTime)); return m;
      }
      function calChip(j) {
        const c = cust(j.customerId), t = to24(j.time);
        const tip = [j.title || 'Untitled job', c ? cname(c) : 'No customer', j.time ? niceTime(j.time) : 'No time set',
        j.assignee ? withRole(j.assignee) : 'Unassigned', label(j.status)].join(' · ');
        return `<button class="calchip" data-job="${j.id}" style="--x:var(${STCOL[j.status] || '--grey'})"
    title="${esc(tip)}">${j.time ? `<span class="calt${t ? '' : ' raw'}">${esc(niceTime(j.time))}</span>` : ''}<span class="caln">${esc(j.title || 'Untitled job')}</span></button>`;
      }
      function planBar(text, prev, next) {
        const me = (teamByEmail(MYEMAIL) || {}).name || '';
        const names = uniq([...db.team.map(m => m.name), ...db.jobs.map(x => x.assignee)])
          .filter(n => n && n !== me);
        return `<div class="calbar">
    <div class="calnav">
      <button class="iconbtn" data-cal="${prev}" title="Back" aria-label="Back">‹</button>
      <span class="callabel">${esc(text)}</span>
      <button class="iconbtn" data-cal="${next}" title="Forward" aria-label="Forward">›</button>
      <button class="btn line" data-cal="${today()}">Today</button>
    </div>
    <select class="calsel" data-planwho aria-label="Whose schedule">
      <option value="">Everyone</option>
      ${me ? `<option value="${esc(me)}" ${planWho === me ? 'selected' : ''}>Just me</option>` : ''}
      <option value="~un" ${planWho === '~un' ? 'selected' : ''}>Unassigned</option>
      ${names.map(n => `<option value="${esc(n)}" ${planWho === n ? 'selected' : ''}>${esc(withRole(n))}</option>`).join('')}
    </select></div>`;
      }
      /* Dateless open jobs would be invisible on a calendar, which is exactly
         how a lead goes stale. They get pinned under every view. */
      function unschedBlock() {
        const u = planPool().filter(j => !j.date && isOpen(j)).sort((a, b) =>
          String(b.created || '').localeCompare(String(a.created || '')));
        if (!u.length) return '';
        return `<div class="unsched"><div class="unschedh">No date yet<span class="agn">${u.length}</span></div>
    <div class="unschedl">${u.map(calChip).join('')}</div></div>`;
      }
      function vMonth() {
        const a = ymd(anchor()), y = a.getFullYear(), mo = a.getMonth();
        const first = new Date(y, mo, 1).getDay(), days = new Date(y, mo + 1, 0).getDate();
        const map = dayMap();
        let cells = '';
        for (let i = 0; i < first; i++)cells += '<div class="calday out"></div>';
        for (let n = 1; n <= days; n++) {
          const ds = iso(new Date(y, mo, n)), list = map[ds] || [];
          cells += `<div class="calday${ds === today() ? ' now' : ''}"><div class="calnum">${n}</div>` +
            list.slice(0, 3).map(calChip).join('') +
            (list.length > 3 ? `<button class="calmore" data-cal="${ds}" data-jump="agenda">+${list.length - 3} more</button>` : '') +
            `</div>`;
        }
        return planBar(MON[mo] + ' ' + y, iso(new Date(y, mo - 1, 1)), iso(new Date(y, mo + 1, 1))) +
          `<div class="caldow">${DOW.map(d => `<span>${d}</span>`).join('')}</div>` +
          `<div class="calgrid">${cells}</div>` + unschedBlock();
      }
      function vWeek() {
        const start = shift(anchor(), -ymd(anchor()).getDay()), map = dayMap();
        let cols = '';
        for (let i = 0; i < 7; i++) {
          const ds = shift(start, i), d = ymd(ds), list = map[ds] || [];
          cols += `<div class="wkcol${ds === today() ? ' now' : ''}">
      <div class="wkh"><span class="wkd">${DOW[d.getDay()]}</span><span class="wkn">${d.getDate()}</span></div>
      <div class="wkl">${list.length ? list.map(calChip).join('') : '<div class="wkempty">—</div>'}</div></div>`;
        }
        const e = ymd(shift(start, 6)), s = ymd(start);
        return planBar(MON[s.getMonth()].slice(0, 3) + ' ' + s.getDate() + ' – ' + MON[e.getMonth()].slice(0, 3) + ' ' + e.getDate(),
          shift(start, -7), shift(start, 7)) + `<div class="wk">${cols}</div>` + unschedBlock();
      }
      function vAgenda() {
        const from = anchor();
        const list = planPool().filter(j => j.date && j.date >= from)
          .sort((a, b) => a.date.localeCompare(b.date) || byTime(a, b));
        const order = [], by = {};
        list.forEach(j => { if (!by[j.date]) { by[j.date] = []; order.push(j.date); } by[j.date].push(j); });
        const body = order.length ? order.map(ds => `<div class="agday">
      <div class="agh">${esc(niceDate(ds))}<span class="agn">${by[ds].length}</span></div>
      ${by[ds].map(calChip).join('')}</div>`).join('')
          : `<div class="empty"><b>Nothing scheduled from here on</b>Step back a week, or give a job a date.</div>`;
        return planBar('From ' + niceDate(from), shift(from, -7), shift(from, 7)) + body + unschedBlock();
      }

      function vJobs() {
        const tabs = [{ k: 'list', label: 'List' }, { k: 'month', label: 'Month' }, { k: 'week', label: 'Week' }, { k: 'agenda', label: 'Agenda' }];
        const body = ({ list: jobsList, month: vMonth, week: vWeek, agenda: vAgenda }[jobsTab] || jobsList)();
        paint(ptabs(tabs, jobsTab, 'jobs') + body);
        wirePtabs();
        if (jobsTab === 'list') wireJobList();
        else {
          $$('[data-cal]').forEach(b => b.addEventListener('click', () => {
            calAnchor = b.dataset.cal;
            if (b.dataset.jump) jobsTab = b.dataset.jump;
            render();
          }));
          $$('[data-planwho]').forEach(s => s.addEventListener('change', () => { planWho = s.value; render(); }));
        }
      }

      function jobsList() {
        const f = F.job;
        const stageCount = s => db.jobs.filter(j => s === 'all' ? 1 : s === 'open' ? isOpen(j) : j.status === s).length;
        const stages = [['open', 'Open'], ['lead', 'Leads'], ['quoted', 'Quoted'], ['scheduled', 'Scheduled'], ['active', 'In progress'], ['done', 'Unpaid'], ['paid', 'Paid'], ['cancelled', 'Cancelled'], ['all', 'All']];
        let list = db.jobs.slice();
        if (f.stage === 'open') list = list.filter(isOpen);
        else if (f.stage !== 'all') list = list.filter(j => j.status === f.stage);
        if (f.type) list = list.filter(j => j.type === f.type);
        if (f.cust) list = list.filter(j => j.customerId === f.cust);
        if (f.who) list = list.filter(j => (f.who === '~un' ? !String(j.assignee || '').trim() : j.assignee === f.who));
        if (query) list = list.filter(j => {
          const c = cust(j.customerId);
          return ((j.ticket || '') + ' ' + j.title + ' ' + (j.notes || '') + ' ' + (j.type || '') + ' ' + (j.address || '') + ' ' + (j.assignee || '') + ' ' + (c ? cname(c) : '')).toLowerCase().includes(query);
        });
        const sorts = {
          date: (a, b) => (b.date || '0').localeCompare(a.date || '0'),
          dateAsc: (a, b) => (a.date || '9').localeCompare(b.date || '9'),
          price: (a, b) => (Number(b.price) || 0) - (Number(a.price) || 0),
          owed: (a, b) => owed(b) - owed(a),
          name: (a, b) => String(a.title).localeCompare(String(b.title)),
          ticket: (a, b) => String(b.ticket || '').localeCompare(String(a.ticket || ''))
        };
        list.sort(sorts[f.sort] || sorts.date);
        const total = list.reduce((s, j) => s + (Number(j.price) || 0), 0);
        const owedSum = list.reduce((s, j) => s + owed(j), 0);
        const custOpts = db.customers.slice().sort((a, b) => cname(a).localeCompare(cname(b)));

        let h = `<div class="filters">` +
          stages.map(s => `<button class="pill p-${s[0]} ${f.stage === s[0] ? 'on' : ''}" data-stage="${s[0]}"><span class="pdot"></span>${s[1]}<span class="n">${stageCount(s[0])}</span></button>`).join('') +
          `</div><div class="filters">
      <select data-jf="type"><option value="">All types</option>${TYPES.map(t => `<option ${f.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <select data-jf="cust"><option value="">All customers</option>${custOpts.map(c => `<option value="${c.id}" ${f.cust === c.id ? 'selected' : ''}>${esc(cname(c))}</option>`).join('')}</select>
      <select data-jf="who"><option value="">Anyone</option><option value="~un" ${f.who === '~un' ? 'selected' : ''}>Unassigned</option>
        ${uniq([...db.team.map(m => m.name), ...db.jobs.map(x => x.assignee)]).map(n => `<option value="${esc(n)}" ${f.who === n ? 'selected' : ''}>${esc(withRole(n))}</option>`).join('')}</select>
      <select data-jf="sort">
        <option value="date" ${f.sort === 'date' ? 'selected' : ''}>Newest first</option>
        <option value="dateAsc" ${f.sort === 'dateAsc' ? 'selected' : ''}>Oldest first</option>
        <option value="price" ${f.sort === 'price' ? 'selected' : ''}>Biggest price</option>
        <option value="owed" ${f.sort === 'owed' ? 'selected' : ''}>Most owed</option>
        <option value="name" ${f.sort === 'name' ? 'selected' : ''}>Job name A–Z</option>
        <option value="ticket" ${f.sort === 'ticket' ? 'selected' : ''}>Ticket, newest</option></select>
      ${(f.type || f.cust || f.who || f.stage !== 'open' || f.sort !== 'date') ? `<button class="clear" data-clear="job">Clear filters</button>` : ''}
      <span class="tally">${list.length} shown${seeMoney() ? ' · ' + money(total) + (owedSum ? ' · ' + money(owedSum) + ' owed' : '') : ''}</span></div>`;
        h += list.length ? list.map(jobRow).join('')
          : `<div class="empty"><b>No jobs match</b>${query || f.type || f.cust ? 'Try clearing a filter.' : 'Log work the moment you quote it — even a maybe.'}
      <div><button class="btn primary" data-act="new-job">Add a job</button></div></div>`;
        return h;
      }

      function wireJobList() {
        const f = F.job;
        $$('[data-stage]').forEach(b => b.addEventListener('click', () => { f.stage = b.dataset.stage; render(); }));
        $$('[data-jf]').forEach(s => s.addEventListener('change', () => { f[s.dataset.jf] = s.value; render(); }));
        $$('[data-clear="job"]').forEach(b => b.addEventListener('click', () => { F.job = { stage: 'open', type: '', cust: '', who: '', sort: 'date' }; render(); }));
      }

        const c = cust(cid);

        if (c.phone) bits.push(`<a href="tel:${esc(tel(c.phone))}">${esc(c.phone)}</a>`);
        if (c.email) bits.push(`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`);
        if (c.address) bits.push(esc(c.address));
        return bits.length ? bits.join(' · ') : '<span style="color:var(--muted)">No phone or email on file</span>';

        openModal(`

          <div class="field"><label>Assigned to</label><select id="f-who">${crewOpts(j.assignee || '')}</select></div>

        <div class="field"><label>Stage</label><div class="segs" id="f-status">

        }).join('')}</div>

          <div class="field"><label>Quoted price</label>

            ${(Array.isArray(j.est) && j.est.length) ? `<div class="hint">Built from ${j.est.length} line${j.est.length === 1 ? '' : 's'} on the Estimate tab.</div>` : ''}</div>

            <div class="segs" id="f-taxable">

        </div>

          <div class="field"><label>Discount amount</label>
            <input type="number" step="0.01" id="f-discamt" value="${esc(j.discountAmt || '')}" placeholder="${seeMoney() ? '0' : '\u2014'}" ${(!canMoney && id) ? 'readonly' : ''}></div>
        </div>
        <div class="gatehint" id="discNote" style="margin:-.4rem 0 .8rem"></div>
        <div class="balance"><span>Quoted</span><b id="mList">${jm(listPrice(j))}</b></div>
        <div class="balance"><span>Discount</span><b id="mDisc">${seeMoney() ? '&minus;' + money(discOf(j)) : '\u2014'}</b></div>
        <div class="balance"><span>Subtotal</span><b id="mSub">${jm(sub(j))}</b></div>
        <div class="balance"><span>Sales tax <span id="mRate" style="color:var(--muted)"></span></span><b id="mTax">${jm(taxAmt(j))}</b></div>
        <div class="balance"><span>Total charged</span><b id="mTot">${jm(totalOf(j))}</b></div>

          <div class="err"></div>
          ${notesLocked ? '<div class="gatehint">The original notes are the permanent record. Add anything new below.</div>' : ''}</div>

            <textarea id="f-newnote" placeholder="Rescheduled to Saturday at the customer's request — he is repainting Thursday."></textarea>
            <div class="err"></div>
            <div class="hint">Saved with your name and the time. Notes can be added but never edited or removed.</div></div>`: ''}

        ${j.ticket ? `<div class="stamp">Ticket ${esc(j.ticket)}</div>` : ''}
        ${j.updatedBy || j.updatedAt ? `<div class="stamp">Last updated${j.updatedBy ? ' by ' + actorHtml(j.updatedBy) : ''}${j.updatedAt ? ' · ' + new Date(j.updatedAt).toLocaleString() : ''}</div>` : ''}

      <div class="pane" id="pane-est" hidden>

        </div>`: ''}
        <div id="estlines"></div>

        <div class="balance"><span>Estimate subtotal</span><b id="estSub">&mdash;</b></div>
        <div class="estmar" id="estMarBox" hidden><span>Cost <b id="estCst">&mdash;</b></span><span>Margin <b id="estMar">&mdash;</b></span></div>

      <div class="pane" id="pane-photos" hidden>

      </div>
      <div class="pane" id="pane-history" hidden>
        <div id="jhist"><div class="empty">Loading history…</div></div>
      </div>
    </div>
    <footer>${(id && isManager()) ? `<button class="btn line" id="shareq">${j.shareToken ? 'Copy link' : 'Share quote'}</button>
      <button class="btn line" id="dupe">Duplicate</button>`: ''}
      <button class="btn line" id="cancel">Cancel</button>
      <button class="btn primary" id="ok">${id ? 'Save job' : 'Add job'}</button></footer>`);

        /* ── note length rules ── */
        if (draft) modalDirty = true;   /* restored work is still unsaved work */
        if (pendingNote && $('#f-newnote')) $('#f-newnote').value = pendingNote;
        const okNotes = wireNote('#f-notes');
        const okReason = wireNote('#f-reason', { required: true });
        const okNew = wireNote('#f-newnote');

        /* ── tabs ── */
        let histLoaded = false;
        $$('#jtabs .tab').forEach(b => b.addEventListener('click', () => {
          $$('#jtabs .tab').forEach(x => x.classList.toggle('on', x === b));
          const want = b.dataset.pane;
          ['details', 'est', 'photos', 'history'].forEach(p => {
            const el = $('#pane-' + p); if (el) el.hidden = (p !== want);
          });

            histLoaded = true;
            Promise.resolve(loadJobHistory(j.id)).catch(e => { histLoaded = false; console.error(e); });
          }
        }));

        /* ── customer type-ahead ── */
        const q = $('#f-custq'), list = $('#f-clist');
        function drawList() {
          const term = q.value.trim().toLowerCase();
          let hits = db.customers.slice().sort((a, b) => cname(a).localeCompare(cname(b)));
          if (term) hits = hits.filter(c => (cname(c) + ' ' + (c.phone || '') + ' ' + (c.email || '') + ' ' + (c.address || '')).toLowerCase().includes(term));
          hits = hits.slice(0, 8);
          list.innerHTML =
            `<button type="button" class="comboadd" data-new="1">＋ New customer${term ? ' “' + esc(q.value.trim()) + '”' : ''}</button>` +
            (picked ? `<button type="button" class="comboitem" data-pick="">Clear selection</button>` : '') +
            (hits.length ? hits.map(c => `<button type="button" class="comboitem" data-pick="${c.id}">
          <span>${esc(cname(c))}</span><small>${esc(c.phone || c.email || c.address || '')}</small></button>`).join('')
              : `<div class="comboempty">No match${term ? ' for “' + esc(q.value.trim()) + '”' : ''}</div>`);
          list.hidden = false;
        }
        function choose(cid) {
          picked = cid;
          q.value = cid ? cname(cust(cid)) : '';
          $('#f-contact').innerHTML = jobContactLine(cid);
          list.hidden = true;
        }
        q.addEventListener('focus', drawList);
        q.addEventListener('input', drawList);
        q.addEventListener('keydown', e => {
          if (e.key === 'Escape') { list.hidden = true; e.stopPropagation(); }
          if (e.key === 'Enter') {
            e.preventDefault(); const first = list.querySelector('[data-pick]:not([data-pick=""])');
            if (first) choose(first.dataset.pick);
          }
        });
        list.addEventListener('click', e => {
          const add = e.target.closest('[data-new]');
          if (add) {
            const typed = q.value.trim(); list.hidden = true;
            /* Opening the customer card replaces this modal's DOM. Snapshot the form
               first and reopen the job from it — otherwise everything typed here is
               gone and choose() throws on elements that no longer exist. */
            const snap = Object.assign(collect(), { _newnote: id ? String(($('#f-newnote') || {}).value || '') : '' });
            editCustomer(null, newId => {
              snap.customerId = newId;
              editJob(id, newId, snap);

            return;
          }
          const pick = e.target.closest('[data-pick]');

        /* this used to be an unremoved document listener — one more fired on every

        const closeList = e => { if (!e.target.closest('.combo') && !e.target.closest('.combolist')) list.hidden = true; };
        document.addEventListener('click', closeList);
        onModalClose(() => document.removeEventListener('click', closeList));
        q.addEventListener('blur', () => {
          setTimeout(() => {
            if (list.hidden) q.value = picked ? cname(cust(picked)) : '';
          }, 180);
        });

        /* ── stage + money ── */
        const taxOn = () => !!$('#f-taxable .seg.on[data-tax="1"]');
        const recalc = () => {
          const shape = {
            price: $('#f-price').value, paid: $('#f-paid').value,

        /* ── photos ────────────────────────────────────────────────────── */
        if (id) {

          async function paintPhotos() {

            box.innerHTML = `<div class="phbar">
          <span>${photosOf(j).length} photo${photosOf(j).length === 1 ? '' : 's'} on this job \u00b7 ${esc(phSize(used))}</span>

          /* ── delegation, deliberately ──────────────────────────────────

          const phBox = $('#phBox');

        $$('#f-status .seg').forEach(b => b.addEventListener('click', () => {

          photos: livePhotos(),

      function histFail(box, msg) {

      async function loadJobHistory(jobId) {
        const box = document.getElementById('jhist');
        if (!box || !jobId) return;
        box.dataset.job = jobId;
        if (!ONLINE || !sb) { box.innerHTML = '<div class="empty">History needs a connection — sign in online to read it.</div>'; return; }
        box.innerHTML = '<div class="empty">Loading history…</div>';
        try {
          const { data, error } = await sb.from('audit').select('*').eq('tbl', 'jobs').eq('row_id', jobId)
            .order('at', { ascending: false }).limit(80).abortSignal(readTimeout(12000));
          if (error) { histFail(box, error.message || error.code || ''); return; }
          if (!data || !data.length) { box.innerHTML = '<div class="empty">No changes recorded yet. Edits from here on will show up.</div>'; return; }
          box.innerHTML = '<div class="log">' + data.map(r => {
            const when = new Date(r.at);

            return `<div class="logrow">
        <div class="logwhen">${when.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}<br>${when.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</div>

        </div></div>`;
          }).join('') + '</div>';
        } catch (err) {
          console.error('history failed', err);
          histFail(box, (err && err.name === 'TimeoutError')
            ? 'The database did not answer within 12 seconds. The rest of the Deck is unaffected — it runs from your local copy.'
            : (err && err.message) || String(err));
        }
