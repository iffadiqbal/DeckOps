      background: var(--harbor);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .3rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden
    }

    .calday.out {
      background: none;
      border-color: transparent
    }

    .calday.now {
      border-color: var(--wood-soft);
      box-shadow: inset 0 0 0 1px var(--wood-soft)
    }

    .calnum {
      font-family: var(--mono);
      font-size: .62rem;
      color: var(--muted);
      line-height: 1
    }

    .calday.now .calnum {
      color: var(--wood-soft);
      font-weight: 700
    }

    .calchip {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-left: 3px solid var(--x);
      background: color-mix(in srgb, var(--x) 14%, transparent);
      color: var(--bone);
      font-family: var(--sans);
      border-radius: 5px;
      padding: .22rem .3rem;
      font-size: .66rem;
      line-height: 1.25;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .calchip:hover {
      background: color-mix(in srgb, var(--x) 26%, transparent)
    }

    .calt {
      font-family: var(--mono);
      font-size: .58rem;
      color: var(--x);
      margin-right: .28rem
    }

    .caln {
      font-weight: 500
    }

    .calt.raw {
      color: var(--yellow);
      font-style: italic
    }

    .calmore {
      background: none;
      border: 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .56rem;
      text-align: left;
      padding: .1rem .3rem;
      cursor: pointer
    }

    .calmore:hover {
      color: var(--bone)
    }

    .wk {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px
    }

    .wkcol {
      background: var(--harbor);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .35rem;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .wkcol.now {
      border-color: var(--wood-soft)
    }

    .wkh {
      display: flex;
      align-items: baseline;
      gap: .3rem;
      justify-content: center;
      padding-bottom: .25rem;
      border-bottom: 1px solid var(--line)
    }

    .wkd {
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .wkn {
      font-family: var(--disp);
      font-size: .9rem;
      font-weight: 600
    }

    .wkcol.now .wkn {
      color: var(--wood-soft)
    }

    .wkl {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .wkempty {
      color: var(--muted);
      font-size: .7rem;
      text-align: center;
      padding: .4rem 0
    }

    .agday {
      margin-bottom: 1.05rem
    }

    .agh {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .4rem
    }

    .agn {
      background: var(--harbor-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .05rem .42rem;
      font-size: .58rem;
      font-family: var(--mono);
      color: var(--muted)
    }

    .agday .calchip,
    .unschedl .calchip {
      font-size: .78rem;
      padding: .45rem .55rem;
      white-space: normal
    }

    .unsched {
      margin-top: 1.2rem;
      background: var(--harbor);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .7rem .8rem
    }

    .unschedh {
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .5rem;
      display: flex;
      align-items: center;
      gap: .45rem
    }

    .unschedl {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    @media(max-width:620px) {
      .calday {
        min-height: 62px;
        padding: .22rem;
        border-radius: 8px
      }

      .calchip {
        font-size: .6rem;
        padding: .16rem .22rem
      }

      .calgrid .calt {
        display: none
      }

      .callabel {
        min-width: 0;
        font-size: .92rem
      }

      .calsel {
        max-width: 100%;
        width: 100%
      }

      .wk {
        grid-template-columns: 1fr;
        gap: 6px
      }

      .wkcol {
        min-height: 0
      }

      .wkh {
        justify-content: flex-start
      }
    }
  </style>
</head>

    (function () {

      const C_ROLES = ['CEO', 'COO', 'CFO', 'CTO', 'CIO', 'CSO', 'President', 'Founder', 'Co-Founder', 'Owner', 'Co-Owner', 'Partner'];
      const MGR_RE = /manager|supervisor|director|lead\b|head of/i;
      const ROLE_IDEAS = ['Operations Manager', 'Office Manager', 'Lead IT Engineer', 'IT Technician',
        'Lead Installer', 'Installer', 'Repair Technician', 'Apprentice', 'Subcontractor', 'Dispatcher', 'Bookkeeper'];
      const roleTier = r => {
        const s = String(r || '').trim();
        if (!s) return 'staff';
        if (C_ROLES.some(x => x.toLowerCase() === s.toLowerCase())) return 'exec';
        if (MGR_RE.test(s)) return 'manager';
        return 'staff';
      };
      let MYTIER = 'staff';                                 // authoritative: read from public.staff
      const isSuper = () => !!MYEMAIL && MYEMAIL === SUPER_EMAIL;
      const isExec = () => isSuper() || MYTIER === 'exec';
      const isManager = () => isExec() || MYTIER === 'manager';
      /* Who may SEE job money at all. The server no longer sends price, paid or
         discount_amt below this line — they arrive null — so every money readout
         in the app has to check this or it renders "$0" and looks broken.
         One place to change if you decide staff should see prices again. */
      const seeMoney = () => isManager();
      const jm = n => seeMoney() ? money(n) : '\u2014';
      const tierName = () => isSuper() ? 'Superadmin' : MYTIER === 'exec' ? 'Owner / C-class' : MYTIER === 'manager' ? 'Manager' : 'Staff';
      const isAdmin = () => isExec() || MYADMIN;
      /* Was: isSuper() || MYROLE==='CEO'. MYROLE comes from the team roster,
         which any exec can edit — so an exec could type themselves into the
         danger zone. The owner login is the only thing that opens it now. */
      const isCEO = () => isSuper();
      const shortName = n => {
        const p = String(n || '').trim().split(/\s+/);
        return p.length > 1 ? p[0] + ' ' + p[p.length - 1][0] + '.' : (p[0] || '');
      };
      const memberByName = n => db.team.find(m => m.name === n);
      const roleOf = n => { const m = memberByName(n); return m && m.role ? m.role : ''; };
      const withRole = n => { const r = roleOf(n); return r ? n + ' — ' + r : n; };
      const who = () => ME || '';

      /* ── who did this ────────────────────────────────────────────
         The audit trail only ever carries a login email, so the log was
         labelling people "Ilove5874". The roster in Data → Team already holds
         the real name and it lives in Supabase under settings.team, so every
         device resolves it the same way — no new column needed. The email
         drops to a tooltip, and is only used as a label when nothing else
         is on file.                                                        */
      const EMAILISH = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const teamByEmail = e => {
        const s = String(e || '').trim().toLowerCase();
        if (!s) return null;
        return db.team.find(m => m.email && String(m.email).trim().toLowerCase() === s) || null;
      };
      /* → {name, sub, linked}. `sub` is the hover text: the account behind the name. */
      function actor(email) {
        const raw = String(email || '').trim();
        if (!raw) return { name: 'Unknown', sub: 'No login recorded against this change', linked: false };

        if (!EMAILISH.test(raw)) return { name: raw, sub: 'Not a signed-in user — ' + raw, linked: true };

        const full = m && String(m.name || '').trim();

          name: shortName(full),
          sub: (m.role ? full + ' — ' + m.role : full) + ' · ' + raw, linked: true
        };
        return {
          name: shortName(nameFrom(raw)) || raw,
          sub: raw + ' — not on the team list, so this is guessed from the address', linked: false
        };
      }
      const actorHtml = email => {
        const a = actor(email);
        return `<span class="who${a.linked ? '' : ' unlinked'}" title="${esc(a.sub)}">${esc(a.name)}</span>`;
      };
      /* login emails in a set of audit rows that no roster card claims */
      const strayActors = rows => uniq(rows.map(r => String(r.actor_email || '').trim())
        .filter(e => EMAILISH.test(e) && !teamByEmail(e)));

          up: c => ({

            address: c.address || '', source: c.source || '', notes: c.notes || '', flag: c.flag || 'auto',
            flag_basis: c.flagBasis || '', follow_up: c.followUp || null, ref_code: (c.refCode || '').trim(),
            created: c.created || new Date().toISOString()
          }),
          down: r => ({
            id: r.id, first: r.first || '', last: r.last || '', phone: r.phone || '', email: r.email || '',
            address: r.address || '', source: r.source || '', notes: r.notes || '', flag: r.flag || 'auto',
            flagBasis: r.flag_basis || '', followUp: r.follow_up || '', refCode: r.ref_code || '', created: r.created,
            updatedAt: r.updated_at, updatedBy: r.updated_by || ''

        jobs: {
          up: j => ({
            id: j.id, customer_id: j.customerId || null, title: j.title || '', type: j.type || 'Install',
            status: j.status || 'lead', job_date: j.date || null, job_time: j.time || '',
            /* Below manager these arrive null from jobs_v. Sending Number(null)||0
               would look like "set the price to zero" and the guard would reject
               the whole save — so a staff member could not rename a job. Omit
               them instead: PostgREST only writes the keys it is given. */
            /* `est` rides with the money keys on purpose. Below manager the
               view hands back the SAME lines with cost/markup/price/line
               removed — sending that stripped copy back would wipe the real
               figures off every line. So it is omitted, exactly like price. */

            ...(seeMoney() ? {
              price: Number(j.price) || 0, paid: Number(j.paid) || 0,
              discount_amt: Number(j.discountAmt) || 0,

            } : {}),
            address: j.address || '',

            assignee: j.assignee || '', notes: j.notes || '', ticket: j.ticket || '',
            notes_log: Array.isArray(j.notesLog) ? j.notesLog : [], cancel_reason: j.cancelReason || '',
            /* updated_by is no longer sent — migration 11 stamps it from the login
               email in a trigger, so it can't be typed. `created` IS still sent,
               because a manager restoring a backup has to carry the original dates
               across; the same trigger overrides it to now() for anyone below
               manager and holds it steady on every update. */
            created: j.created || new Date().toISOString()
          }),
          down: r => ({
            id: r.id, customerId: r.customer_id || '', title: r.title || '', type: r.type || 'Install',
            status: r.status || 'lead', date: r.job_date || '', time: r.job_time || '',
            price: r.price, paid: r.paid, address: r.address || '', assignee: r.assignee || '', notes: r.notes || '',
            taxable: !!r.taxable, taxRate: Number(r.tax_rate) || 0,
            discountCode: r.discount_code || '', discountAmt: Number(r.discount_amt) || 0,
            ticket: r.ticket || '', notesLog: Array.isArray(r.notes_log) ? r.notes_log : [],
            cancelReason: r.cancel_reason || '', est: Array.isArray(r.est) ? r.est : [],
            shareToken: r.share_token || '', acceptedAt: r.accepted_at || '', acceptedBy: r.accepted_by || '',
            photos: Array.isArray(r.photos) ? r.photos
              : ((db.jobs.find(x => x.id === r.id) || {}).photos || []),
            created: r.created, updatedAt: r.updated_at, updatedBy: r.updated_by || ''
          })
        },
        parts: {
          up: p => ({
            id: p.id, name: p.name || '', sku: p.sku || '', device: p.device || '', qty: Number(p.qty) || 0,
            cost: Number(p.cost) || 0, price: Number(p.price) || 0, low_at: Number(p.lowAt) || 0,
            supplier: p.supplier || '', notes: p.notes || '',
            unit: p.unit || 'each', kind: p.kind || 'material', link: safeUrl(p.link),
            markup: Number(p.markup) || 0, track: p.track !== false,
            created: p.created || new Date().toISOString()
          }),
          down: r => ({
            id: r.id, name: r.name || '', sku: r.sku || '', device: r.device || '', qty: r.qty,
            cost: r.cost, price: r.price, lowAt: r.low_at, supplier: r.supplier || '', notes: r.notes || '',
            unit: r.unit || 'each', kind: r.kind || 'material', link: r.link || '',
            markup: Number(r.markup) || 0, track: r.track !== false,
            created: r.created, updatedAt: r.updated_at, updatedBy: r.updated_by || ''
          })
        }
      };

      /* ═══ DATA + MIGRATIONS ═════════════════════════ */
      const blank = { customers: [], jobs: [], parts: [], team: [], meta: { schema: SCHEMA, lastExport: null, goal: 3000, eraseHash: '', eraseSalt: '', eraseIter: 0 } };
      function migrate(d) {
        d.meta = d.meta || {};
        const from = Number(d.meta.schema) || 1;
        if (from < 2) {
          d.jobs.forEach(j => { if (j.address === undefined) j.address = ''; });
          d.customers.forEach(c => { if (c.source === undefined) c.source = ''; });
        }
        if (from < 3) {                       // v2 → v3: split name, add follow-up fields
          d.customers.forEach(c => {
            if (c.first === undefined) {
              const p = String(c.name || '').trim().split(/\s+/);
              c.first = p.shift() || ''; c.last = p.join(' ');
            }
            if (c.flag === undefined) c.flag = 'auto';
            if (c.followUp === undefined) c.followUp = '';
          });
        }
        if (from < 4) { d.customers.forEach(c => { if (c.flagBasis === undefined) c.flagBasis = ''; }); }
        if (from < 5) {
          d.jobs.forEach(j => { if (j.assignee === undefined) j.assignee = ''; });
          if (d.meta.goal === undefined) d.meta.goal = 3000;
        }
        if (from < 6) { if (!Array.isArray(d.team)) d.team = []; }
        if (from < 7) {
          const ordered = d.jobs.slice().sort((a, b) => String(a.created || '').localeCompare(String(b.created || '')));
          let n = 0;
          ordered.forEach(j => { if (!j.ticket) { n++; j.ticket = 'AP-' + String(n).padStart(4, '0'); } });
        }
        if (from < 8) {
          d.jobs.forEach(j => {
            if (!Array.isArray(j.notesLog)) j.notesLog = [];
            if (j.cancelReason === undefined) j.cancelReason = '';
          });
        }
        if (from < 9) {                       // v8 → v9: estimator
          d.jobs.forEach(j => { if (!Array.isArray(j.est)) j.est = []; });
          d.parts.forEach(p => {
            if (p.unit === undefined) p.unit = 'each';
            if (p.kind === undefined) p.kind = 'material';
            if (p.markup === undefined) p.markup = 0;
            if (p.track === undefined) p.track = true;
          });
        }
        if (from < 10) {                      // v9 → v10: customer status is derived only
          d.customers.forEach(c => { c.flag = 'auto'; c.flagBasis = ''; });
        }
        if (from < 11) {                      // v10 → v11: where-to-buy link on parts
          d.parts.forEach(p => { if (p.link === undefined) p.link = ''; });
        }
        if (from < 12) {                      // v11 → v12: before/after photos
          d.jobs.forEach(j => { if (!Array.isArray(j.photos)) j.photos = []; });
        }
        /* future: if(from<13){ ... } */
        d.meta.schema = SCHEMA;
        return d;
      }
      function load() {
        try {
          const raw = localStorage.getItem(KEY);
          if (!raw) return structuredClone(blank);
          return migrate(Object.assign(structuredClone(blank), JSON.parse(raw)));
        } catch (e) { console.error(e); return structuredClone(blank); }
      }
      let db = load();
      function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Could not save — storage may be full'); } }
      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

      /* ═══ THEME ═════════════════════════════════════ */
      const THEME_KEY = 'anchorpoint-deck-theme';
      const systemTheme = () => matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      function currentTheme() {                       // 'light' | 'dark' | 'auto'
        try { const t = localStorage.getItem(THEME_KEY); return (t === 'light' || t === 'dark') ? t : 'auto'; }
        catch (e) { return 'auto'; }
      }
      function applyTheme() {
        const pick = currentTheme();
        const t = pick === 'auto' ? systemTheme() : pick;
        document.documentElement.setAttribute('data-theme', t);
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#EAE5D9' : '#0D1316');
      }
      function setTheme(pick) {
        try { if (pick === 'auto') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, pick); } catch (e) { }
        applyTheme();
      }
      /* follow the device live, but only while the user is on "Match device" */
      try {
        matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
          if (currentTheme() === 'auto') { applyTheme(); if (view === 'data') render(); }
        });
      } catch (e) { }
      applyTheme();
      function nextTicket() {
        const taken = new Set(db.jobs.map(j => j.ticket));
        for (let tries = 0; tries < 50; tries++) {
          let s = '';
          const r = new Uint8Array(6); (crypto.getRandomValues ? crypto.getRandomValues(r) : r.fill(0));
          for (let i = 0; i < 6; i++)s += TICKET_ALPHABET[r[i] % TICKET_ALPHABET.length];
          const tk = 'AP-' + s;
          if (!taken.has(tk)) return tk;
        }
        return 'AP-' + Date.now().toString(36).toUpperCase().slice(-6);
      }

      /* ═══ SYNC ═══════════════════════════════════════
         Every change is applied locally first (so the UI never
         waits on the network), cached to localStorage, then
         pushed up. Failed pushes land in an outbox and retry.  */
      let outbox = [];
      try { outbox = JSON.parse(localStorage.getItem(OUT) || '[]'); } catch (e) { outbox = []; }
      if (!Array.isArray(outbox)) outbox = [];
      const saveOut = () => { try { localStorage.setItem(OUT, JSON.stringify(outbox)); } catch (e) { } };

      const setTxt = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
      function setSync(state, txt) {
        const el = document.getElementById('sync'); if (!el) return;
        el.className = 'sync' + (state ? ' ' + state : '');
        setTxt('syncTxt', txt);
      }
      function syncBadge() {
        const st = stuckItems().length, live = outbox.length - st;
        if (st) setSync('bad', st + " can't save");
        else if (offlineMode || !ONLINE) setSync('off', outbox.length ? outbox.length + ' waiting' : 'Offline');
        else if (live) setSync('queue', live + ' syncing');
        else setSync('', 'Synced');
        /* AFTER setSync — it assigns className outright and would wipe this */
        const el = document.getElementById('sync');
        if (el) el.classList.toggle('tappable', st > 0);
      }
      /* What is blocked, why, and the two things you can do about it. Without this
         the only way to see a stuck write was the browser console. */
      function showStuck() {
        const st = stuckItems();
        if (!st.length) return toast('Nothing is stuck');
        const label = i => {
          const p = i.payload || {};
          const nice = { jobs: 'Job', customers: 'Customer', parts: 'Part', settings: 'Setting' }[i.table] || i.table;
          return nice + ' \u00b7 ' + (p.ticket || p.name || p.title || p.key || p.sku || i.id || p.id || 'record');
        };
        openModal(`<div style="padding:1.2rem 1.15rem 1.3rem">
    <h3 style="margin-bottom:.5rem">Changes that couldn\u2019t be saved</h3>
    <div class="note">These were edited on this device but the server rejected them, and they have
      <b>stopped retrying</b>. The usual cause is the database being a migration behind the app \u2014
      run the latest SQL, then Retry.</div>
    ${st.map((i, n) => `<div class="estrow">
      <div class="esth"><b>${esc(label(i))}</b></div>
      <div class="estx">${esc(i.err || 'unknown error')}</div>
      <div class="estx" style="margin-top:.3rem">Tried ${i.tries || 1} time${(i.tries || 1) === 1 ? '' : 's'}</div>
      <div class="acts" style="margin-top:.55rem">
        <button class="btn line sm" data-drop="${n}">Discard this one</button></div>
    </div>`).join('')}
    <div class="acts" style="margin-top:1rem">
      <button class="btn line" id="stuckDrop">Discard all</button>
      <button class="btn primary" id="stuckRetry">Retry now</button>
      <button class="btn line" id="stuckClose">Close</button></div></div>`);
        $('#stuckClose').addEventListener('click', closeModal);
        $$('[data-drop]').forEach(b => b.addEventListener('click', () => {
          const gone = stuckItems()[Number(b.dataset.drop)];
          outbox = outbox.filter(x => x !== gone); saveOut(); syncBadge();
          closeModal(); toast('Change discarded');
        }));
        $('#stuckDrop').addEventListener('click', () => {
          if (!confirm('Discard ' + st.length + " change" + (st.length === 1 ? '' : 's') + " that couldn't be saved? The edit stays on this device but will never reach the server.")) return;
          outbox = outbox.filter(i => !i.stuck); saveOut(); syncBadge();
          closeModal(); toast('Discarded');
        });
        $('#stuckRetry').addEventListener('click', async () => {
          outbox.forEach(i => { i.stuck = false; i.tries = 0; });
          saveOut(); closeModal(); await flushOutbox();
        });
      }

      const denied = e => {
        const s = ((e && (e.message || '')) + ' ' + (e && e.code || '')).toLowerCase();
        return e && (e.code === '42501' || s.includes('row-level security') || s.includes('permission denied') || s.includes('violates'));
      };
      /* The database is behind the app: a column this build writes doesn't exist
         server-side yet. Silently queueing that to the outbox is the worst possible
         answer — the write never lands, the next pull overwrites what you typed,
         and the work disappears with no explanation. Say it out loud instead. */
      const schemaGap = e => {
        const s = ((e && (e.message || '')) + ' ' + (e && e.code || '') + ' ' + (e && e.details || '')).toLowerCase();
        return !!e && (e.code === 'PGRST204' || e.code === '42703' ||
          (s.includes('column') && (s.includes('does not exist') || s.includes('schema cache'))));
      };
      /* Migration 10 took SELECT on price/paid/discount_amt away from every
         signed-in user — managers included, because they read those through
         jobs_v instead. An UPSERT compiles to
             insert ... on conflict (id) do update set price = excluded.price
         and reading `excluded.price` counts as a SELECT on jobs.price, so the
         whole statement was rejected with "permission denied for table jobs".
         A plain UPDATE with literal values needs only UPDATE on the column, and
         a plain INSERT needs only INSERT. So: update, and insert if it matched
         nothing. The duplicate-key swallow covers the case where the row count
         comes back unknown and the row did in fact already exist. */
      async function saveJob(payload) {
        const upd = await sb.from('jobs').update(payload, { count: 'exact' }).eq('id', payload.id);
        if (upd.error) return upd;
        if (upd.count === 0 || upd.count == null) {
          const ins = await sb.from('jobs').insert(payload);
          if (ins.error && ins.error.code !== '23505') return ins;   // 23505 = it was there after all
        }
        return { error: null };
      }
      const putRow = (table, payload) => table === 'jobs' ? saveJob(payload) : sb.from(table).upsert(payload);

      async function push(table, row) {
        row.updatedBy = MYEMAIL || who(); row.updatedAt = new Date().toISOString();
        const payload = M[table].up(row);
        if (!ONLINE || !sb) { outbox.push({ op: 'up', table, payload }); saveOut(); syncBadge(); return; }
        setSync('busy', 'Saving');
        const { error } = await putRow(table, payload);
        if (error) {
          if (denied(error)) { toast(error.message || "Your access level doesn't allow that change"); await pullAll(); }
          else if (schemaGap(error)) {
            /* do NOT queue this — replaying it just fails forever */
            console.error('schema gap', error);
            setSync('bad', 'Not saved');
            toast('Not saved — the database is missing a column this version needs. Run the latest migration, then reopen this record.');
          }
          else {
            console.warn('push failed', error);
            outbox.push({ op: 'up', table, payload, tries: 1, err: String((error && error.message) || error || 'unknown error') });
            saveOut();
          }
        }
        syncBadge();
      }
      async function pushDelete(table, id) {
        if (!ONLINE || !sb) { outbox.push({ op: 'del', table, id }); saveOut(); syncBadge(); return; }
        setSync('busy', 'Saving');
        const { error } = await sb.from(table).delete().eq('id', id);
        if (error) {
          if (denied(error)) { toast('Only a manager or above can delete records'); await pullAll(); }
          else {
            console.warn('delete failed', error);
            outbox.push({ op: 'del', table, id, tries: 1, err: String((error && error.message) || error || 'unknown error') });
            saveOut();
          }
        }
        syncBadge();
      }
      /* One row edited five times in a dead zone is still one row. Collapse the
         queue before it goes up: last write wins, a delete cancels every earlier
         write to that record, and a re-add after a delete survives. */
      function outboxKey(item) {
        if (item.op === 'del') return item.table + '|' + item.id;
        const p = item.payload || {};
        if (p.id != null) return item.table + '|' + p.id;
        if (p.key != null) return item.table + '|key:' + p.key;
        return item.table + '|' + JSON.stringify(p);
      }
      function coalesceOutbox(queue) {
        const byKey = new Map();
        for (const item of queue) {
          const k = outboxKey(item), prev = byKey.get(k);
          if (!prev || item.op === 'del' || prev.op === 'del') { byKey.set(k, item); continue; }
          byKey.set(k, { op: 'up', table: item.table, payload: Object.assign({}, prev.payload, item.payload) });
        }
        return [...byKey.values()];
      }
      /* A write that can never succeed used to sit in the queue retrying every
         20 seconds forever, with the reason buried in console.warn. The badge just
         read "2 syncing" and nothing ever happened. Give up after MAX_TRIES, keep
         the reason on the item, and say so out loud. */
      const MAX_TRIES = 4;
      const stuckItems = () => outbox.filter(i => i.stuck);
      async function flushOutbox() {
        if (!ONLINE || !sb) return;
        const live = outbox.filter(i => !i.stuck);
        if (!live.length) { syncBadge(); return; }
        setSync('busy', 'Syncing');
        const raw = live.length;
        const queue = coalesceOutbox(live);
        outbox = stuckItems(); saveOut();
        for (const item of queue) {
          const { error } = item.op === 'del'
            ? await sb.from(item.table).delete().eq('id', item.id)
            : await putRow(item.table, item.payload);
          if (!error) continue;
          if (denied(error)) { console.warn('dropped a denied change', item); continue; }
          item.tries = (item.tries || 0) + 1;
          item.err = String((error && error.message) || error || 'unknown error');
          /* a missing column will never resolve by trying again */
          if (schemaGap(error) || item.tries >= MAX_TRIES) item.stuck = true;
          outbox.push(item);
        }
        saveOut(); syncBadge();
        const st = stuckItems();
        if (st.length) toast(st.length + ' change' + (st.length === 1 ? '' : 's') + " couldn't be saved",
          { label: 'Show me', run: showStuck });
        else if (!outbox.length) toast(raw > queue.length
          ? 'All changes synced · ' + raw + ' edits merged into ' + queue.length
          : 'All changes synced');
      }

      async function pushTeam() {
        save();
        if (ONLINE && sb) {
          setSync('busy', 'Saving');
          const { error } = await sb.from('settings').upsert({ key: 'team', value: { list: db.team } });
          if (error) {
            if (denied(error)) { toast('Only an owner or C-class member can change the team list'); await pullAll(); }
            else console.warn(error);
          }
          syncBadge();
        }
        else { outbox.push({ op: 'up', table: 'settings', payload: { key: 'team', value: { list: db.team } } }); saveOut(); syncBadge(); }
      }

      /* local-first mutators used everywhere in the UI */
      function upsertLocal(table, rec) {
        const arr = db[table]; const i = arr.findIndex(x => x.id === rec.id);
        if (i >= 0) arr[i] = rec; else arr.push(rec);
      }
      function upsert(table, rec) {
        rec.updatedBy = MYEMAIL || who(); rec.updatedAt = new Date().toISOString();
        upsertLocal(table, rec); push(table, rec);
      }
      function removeRec(table, id) {
        db[table] = db[table].filter(x => x.id !== id);
        pushDelete(table, id);
      }

      async function pullTier() {
        MYTIER = 'staff';
        if (!ONLINE || !sb) return;
        const { data, error } = await sb.from('staff').select('tier').eq('user_id', MYUID).maybeSingle();
        if (error) { console.warn('tier lookup failed', error); return; }
        if (data && data.tier) MYTIER = data.tier;
      }
      async function pullAll() {
        if (!ONLINE || !sb) return;
        setSync('busy', 'Loading');
        const [c, j, p, s] = await Promise.all([
          sb.from('customers').select('*'),
          sb.from('jobs_v').select('*'),      /* read view: money is null below manager */
          sb.from('parts').select('*'),
          sb.from('settings').select('*')
        ]);
        if (c.error || j.error || p.error) {
          const e = c.error || j.error || p.error;
          console.warn('pull failed', e);
          toast('Load failed: ' + (e.message || e.code || 'unknown') + ' — showing cached copy');
          syncBadge(); return;
        }
        try {
          db.customers = (c.data || []).map(M.customers.down);
          db.jobs = (j.data || []).map(M.jobs.down);
          db.parts = (p.data || []).map(M.parts.down);
          if (s && !s.error && Array.isArray(s.data)) {
            const g = s.data.find(r => r.key === 'goal'), tm = s.data.find(r => r.key === 'team'), er = s.data.find(r => r.key === 'erase');
            if (g && g.value && g.value.monthly != null) db.meta.goal = Number(g.value.monthly);
            if (tm && tm.value && Array.isArray(tm.value.list)) db.team = tm.value.list;
            /* Backup is deliberately SHARED — one admin exporting silences the
               nag for the whole team. Take whichever stamp is later so a device
               that backed up while offline is not overwritten by a stale server
               row. Absent row (migration 12 not run) leaves the local value. */
            const bk = s.data.find(r => r.key === 'backup');
            if (bk && bk.value && bk.value.at) {
              const mine = db.meta.lastExport ? new Date(db.meta.lastExport).getTime() : 0;
              const theirs = new Date(bk.value.at).getTime();
              if (isFinite(theirs) && theirs > mine) db.meta.lastExport = bk.value.at;
            }
            /* Read leads are the opposite — scoped to ONE person. RLS only ever
               returns this account's row, but filter by key anyway. */
            if (MYEMAIL) {
              const lr = s.data.find(r => r.key === 'leadsread:' + MYEMAIL);
              if (lr && lr.value) mergeLeadsRead(lr.value.ids);
            }
            /* the erase row only comes back for the owner login now — RLS */
            if (er && er.value) {
              db.meta.eraseHash = er.value.hash || '';
              db.meta.eraseSalt = er.value.salt || ''; db.meta.eraseIter = Number(er.value.iter) || 0;
            }
          }
          save(); syncBadge();
        } catch (err) { console.error('mapping failed', err); toast('Data problem: ' + (err.message || err)); }
        try { render(); } catch (err) { console.error('render failed', err); toast('Display problem: ' + (err.message || err)); }
      }
      let pullTimer = null;
      const pullSoon = () => { clearTimeout(pullTimer); pullTimer = setTimeout(pullAll, 450); };

      function watchLive() {
        if (!sb) return;
        sb.channel('deck-live')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'customers' }, pullSoon)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'jobs' }, pullSoon)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'parts' }, pullSoon)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, pullSoon)
          .subscribe();
      }
      /* ── keep the bottom bar glued to the VISUAL viewport ──────────────
         iOS Safari's URL/tool bar and its rubber-band overscroll both shrink the
         visual viewport without moving the layout viewport, so `position:fixed;
         bottom:x` drifts upward as you scroll. Track the difference and take it
         back out with a transform. Desktop and Android report a lift of 0, so this
         is inert there. */
      (function () {
        const vv = window.visualViewport; if (!vv) return;
        const root = document.documentElement;
        /* ⚠️ v1 of this was WORSE than the bug it fixed. Three corrections:
           1. It subtracted vv.offsetTop. During a top rubber-band iOS reports
              offsetTop NEGATIVE, so the lift grew with how hard you pulled and the
              bar climbed the screen. offsetTop describes the visual viewport being
              scrolled INSIDE the layout viewport (pinch-zoom, scroll-into-view) —
              it has nothing to do with browser chrome. Only vv.height does.
           2. It called any shrink over 140px "the keyboard" and hid the bar. A hard
              pull cleared 140 easily, so the bar vanished mid-gesture. Ask what is
              focused instead — that is what a keyboard actually means.
           3. Nothing is compensated mid-bounce now; the last good value holds. */
        const MAX_LIFT = 120;      /* no browser toolbar is taller than this */
        let raf = 0;
        const typing = () => {
          const a = document.activeElement;
          return !!a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName || ''));
        };
        const bouncing = () => scrollY < 0 ||
          (scrollY + innerHeight) > document.documentElement.scrollHeight + 1;
        const place = () => {
          raf = 0;
          if (typing()) { root.dataset.kb = '1'; root.style.setProperty('--vv-lift', '0px'); return; }
          delete root.dataset.kb;
